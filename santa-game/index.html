<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<!--PWA-->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<meta name="theme-color" content="#0E1A45">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="산타선물">
<!--/PWA-->
<title>산타 선물 대작전</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: one landscape stage. On an upright phone the whole app turns 90° so it is always played sideways. */
:root{
  --night:#0E1A45;
  --night2:#22336F;
  --red:#E0413A;
  --red-deep:#A82A25;
  --green:#2E8B57;
  --green-deep:#1E6340;
  --gold:#F5C542;
  --gold-deep:#C9951A;
  --snow:#F4F8FF;
  --ink:#22264A;
  --muted:#6B6F92;
  --line:#DDE3F3;
  --display:'Jua','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --body:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --padL:max(14px,env(safe-area-inset-left,0px));
  --padR:max(14px,env(safe-area-inset-right,0px));
  --padT:max(10px,env(safe-area-inset-top,0px));
  --padB:max(10px,env(safe-area-inset-bottom,0px));
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--night);color:var(--snow);font-family:var(--body);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;overscroll-behavior:none}
button{font-family:var(--display);cursor:pointer;color:var(--ink)}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
[hidden]{display:none!important}

#app{position:fixed;inset:0;overflow:hidden;background:var(--night)}
@media (orientation:portrait){
  :root{--padL:max(14px,env(safe-area-inset-top,0px));--padR:max(14px,env(safe-area-inset-bottom,0px));--padT:10px;--padB:10px}
  #app{inset:auto;top:0;left:100vw;width:100vh;width:100dvh;height:100vw;transform-origin:0 0;transform:rotate(90deg)}
}
.scr{position:absolute;inset:0;overflow:hidden}
.scr>canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

.btn{border:0;border-radius:18px;padding:12px 20px;font-size:20px;background:var(--snow);box-shadow:0 5px 0 #B9C3E0;
  transition:transform .08s, box-shadow .08s;display:inline-flex;align-items:center;justify-content:center;gap:8px;line-height:1.15}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #B9C3E0}
.btn.red{background:var(--red);color:#fff;box-shadow:0 5px 0 var(--red-deep)}
.btn.red:active{box-shadow:0 1px 0 var(--red-deep)}
.btn.green{background:var(--green);color:#fff;box-shadow:0 5px 0 var(--green-deep)}
.btn.green:active{box-shadow:0 1px 0 var(--green-deep)}
.btn.gold{background:var(--gold);box-shadow:0 5px 0 var(--gold-deep)}
.btn.gold:active{box-shadow:0 1px 0 var(--gold-deep)}
.iconbtn{border:0;width:44px;height:44px;border-radius:999px;background:rgba(244,248,255,.92);font-size:18px;display:grid;place-items:center;flex:none}

/* 처음 화면 */
.titlebox{position:absolute;inset:0;display:flex;flex-direction:column;align-items:flex-end;justify-content:flex-start;gap:10px;text-align:right;
  padding:calc(var(--padT) + 14px) var(--padR) var(--padB) var(--padL);pointer-events:none}
.titlebox h1{font-size:clamp(34px,7vh,54px);color:#fff;text-shadow:0 4px 0 var(--red-deep),0 0 24px rgba(255,220,120,.35);letter-spacing:.02em}
.titlebox p{margin:0;font-size:16px;color:#DCE3FF;max-width:19em;line-height:1.45}
.titlebox .row{display:flex;gap:12px;pointer-events:auto;margin-top:6px}
.titlebox .total{font-family:var(--display);font-size:15px;color:var(--gold)}
.topright{position:absolute;top:var(--padT);left:var(--padL);display:flex;gap:8px}

/* 달력 */
.cal{background:radial-gradient(120% 90% at 80% 0%, #2B3F86 0%, var(--night) 60%);display:flex;flex-direction:column;gap:10px;
  padding:var(--padT) var(--padR) var(--padB) var(--padL)}
.calhead{display:flex;align-items:center;gap:12px}
.calhead h2{font-size:24px;flex:1;color:#fff}
.chip{background:rgba(244,248,255,.95);color:var(--ink);border-radius:999px;padding:7px 14px;font-family:var(--display);font-size:18px;display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums;white-space:nowrap}
.back{border:0;background:var(--snow);border-radius:14px;height:42px;padding:0 14px;font-size:17px;box-shadow:0 4px 0 #B9C3E0}
.grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:8px}
.door{border:0;border-radius:14px;background:#FDF6E8;box-shadow:0 4px 0 #C9B48E;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px;min-height:0;position:relative}
.door b{font-family:var(--display);font-weight:400;font-size:clamp(20px,5.5vh,30px);line-height:1}
.door .st{font-size:13px;letter-spacing:1px;color:#D9A400;min-height:1em}
.door .st i{font-style:normal;color:#CFC7B4}
.door.locked{background:#3A4A86;box-shadow:0 4px 0 #26336A;color:#8C99CC}
.door.next{background:var(--gold);box-shadow:0 4px 0 var(--gold-deep);animation:glow 1.4s ease-in-out infinite}
.door.eve{background:var(--red);color:#fff;box-shadow:0 4px 0 var(--red-deep)}
.door.eve.locked{background:#6B3A55;box-shadow:0 4px 0 #4A2639;color:#D8A9BE}
.door small{font-family:var(--body);font-size:10px}
@keyframes glow{50%{transform:translateY(-2px)}}
@media (prefers-reduced-motion:reduce){.door.next{animation:none}}

/* 썰매 꾸미기 */
.shopbody{flex:1;min-height:0;display:flex;gap:14px}
.preview{flex:1;min-width:0;border-radius:18px;overflow:hidden;position:relative;background:#0B1640;box-shadow:inset 0 0 0 2px rgba(255,255,255,.12)}
.preview canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.items{flex:1.35;min-width:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-bottom:6px}
.sec{font-family:var(--display);font-size:16px;color:#DCE3FF;margin-top:2px}
.irow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.item{border:0;border-radius:14px;background:#FDF6E8;box-shadow:0 4px 0 #C9B48E;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;min-width:0}
.item b{font-weight:400;font-size:15px}
.item small{font-family:var(--body);font-size:11px;color:var(--muted);line-height:1.25}
.item .pr{font-family:var(--display);font-size:14px;color:#B88400}
.item.on{background:var(--gold);box-shadow:0 4px 0 var(--gold-deep)}
.item.on .pr{color:var(--ink)}
.item .sw{width:36px;height:14px;border-radius:7px;border:2px solid var(--ink)}
.calhead .back.small{font-size:15px;padding:0 12px}

/* 플레이 화면 */
.hud{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:8px;pointer-events:none;
  padding:var(--padT) var(--padR) 0 var(--padL)}
.hud .chip{font-size:17px;padding:6px 12px;opacity:.88}
.hearts{display:flex;gap:2px;background:rgba(244,248,255,.95);border-radius:999px;padding:6px 10px;font-size:18px;line-height:1}
.hearts i{font-style:normal;color:var(--red)}
.hearts i.off{color:#C3C8DE}
.timebar{flex:1;max-width:260px;margin-left:auto;display:flex;align-items:center;gap:6px;background:rgba(244,248,255,.95);border-radius:999px;padding:6px 10px;color:var(--ink);font-family:var(--display);font-size:13px}
.timebar .tb{flex:1;height:8px;border-radius:5px;background:#D5DBF0;overflow:hidden}
.timebar .tb i{display:block;height:100%;width:0;background:linear-gradient(90deg,#4B5FB8,#F5A35A)}
.hud .iconbtn{pointer-events:auto}
.dropbtn{position:absolute;right:var(--padR);bottom:var(--padB);width:104px;height:104px;border-radius:50%;border:0;
  background:var(--red);color:#fff;font-size:22px;line-height:1.1;box-shadow:0 6px 0 var(--red-deep),0 0 0 6px rgba(255,255,255,.18);touch-action:none}
.dropbtn:active,.dropbtn.on{transform:translateY(4px);box-shadow:0 2px 0 var(--red-deep),0 0 0 6px rgba(255,255,255,.25)}
.dropbtn small{display:block;font-family:var(--body);font-size:12px;opacity:.9;margin-top:2px}
.steerhint{position:absolute;left:var(--padL);bottom:var(--padB);background:rgba(8,12,35,.6);border-radius:14px;padding:8px 12px;font-family:var(--display);font-size:15px;color:#fff;pointer-events:none;transition:opacity .8s;max-width:45%}

.ov{position:absolute;inset:0;background:rgba(6,10,32,.6);display:grid;place-items:center;z-index:20;padding:var(--padT) var(--padR) var(--padB) var(--padL)}
.panel{background:#FFFDF6;color:var(--ink);border-radius:24px;padding:18px 22px;width:100%;max-width:440px;max-height:100%;overflow-y:auto;
  display:flex;flex-direction:column;gap:10px;text-align:center;box-shadow:0 8px 0 rgba(0,0,0,.25)}
.panel h2{font-size:26px}
.panel p{margin:0;color:var(--muted);line-height:1.45}
.panel .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.panel .row.one{grid-template-columns:1fr}
.goal{font-family:var(--display);font-size:20px;color:var(--ink)}
.bigstars{font-size:40px;letter-spacing:6px;color:var(--gold);line-height:1}
.bigstars i{font-style:normal;color:#D9DCE8}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stats div{background:#F0F3FC;border-radius:14px;padding:8px 4px;display:flex;flex-direction:column;gap:2px}
.stats span{font-size:12px;color:var(--muted)}
.stats b{font-family:var(--display);font-weight:400;font-size:22px;font-variant-numeric:tabular-nums}
.toast{position:absolute;left:50%;top:22%;transform:translateX(-50%);z-index:30;background:rgba(8,12,35,.88);color:#fff;font-family:var(--display);font-size:17px;
  padding:10px 16px;border-radius:14px;width:max-content;max-width:calc(100% - 40px);text-align:center;line-height:1.4;pointer-events:none}
</style>
</head>
<body>
<div id="app">

  <!-- 처음 화면 -->
  <section id="title" class="scr">
    <canvas id="titleCv"></canvas>
    <div class="titlebox">
      <h1>산타 선물 대작전</h1>
      <p>루돌프 썰매를 타고 하늘의 선물을 받아서, 굴뚝으로 쏙 배달해요!</p>
      <div class="row"><button class="btn red" id="btnStart">시작하기</button></div>
      <div class="total" id="tTotal"></div>
    </div>
    <div class="topright"><button class="iconbtn" id="btnMute" aria-label="소리 켜기/끄기">🔊</button></div>
  </section>

  <!-- 크리스마스 달력 -->
  <section id="cal" class="scr cal" hidden>
    <div class="calhead">
      <button class="back" id="calBack">← 처음</button>
      <h2>12월 달력</h2>
      <button class="back small" id="btnDiff">난이도: 보통</button>
      <button class="back small" id="btnShop">🛷 썰매 꾸미기</button>
      <span class="chip" id="calStars">★ 0</span>
    </div>
    <div class="grid" id="calGrid"></div>
  </section>

  <!-- 썰매 꾸미기 -->
  <section id="shop" class="scr cal" hidden>
    <div class="calhead">
      <button class="back" id="shopBack">← 달력</button>
      <h2>썰매 꾸미기</h2>
      <span class="chip" id="shopStars">남은 별 ★ 0</span>
    </div>
    <div class="shopbody">
      <div class="preview"><canvas id="shopCv"></canvas></div>
      <div class="items" id="shopList"></div>
    </div>
  </section>

  <!-- 배달하는 밤 -->
  <section id="play" class="scr" hidden>
    <canvas id="playCv"></canvas>
    <div class="hud">
      <div class="hearts" id="hHearts"></div>
      <span class="chip" id="hSack">🎁 0</span>
      <span class="chip" id="hDone">🏠 0/0</span>
      <div class="timebar"><span>🌙</span><div class="tb"><i id="hTime"></i></div><span>☀️</span></div>
      <button class="iconbtn" id="btnPause" aria-label="잠깐 멈추기">⏸</button>
    </div>
    <div class="steerhint" id="steerHint">왼손: 화면을 위아래로 문질러 썰매 움직이기</div>
    <button class="dropbtn" id="btnDrop">선물<br>쏙!<small>오른손</small></button>

    <div class="ov" id="readyOv" hidden>
      <div class="panel">
        <h2 id="rdTitle">12월 1일 밤</h2>
        <div class="goal" id="rdGoal">선물 5개 배달하기</div>
        <p id="rdTip"></p>
        <div class="row one"><button class="btn red" id="btnReady">출발!</button></div>
      </div>
    </div>
    <div class="ov" id="pauseOv" hidden>
      <div class="panel">
        <h2>잠깐 쉬어요</h2>
        <p>루돌프도 숨을 고르고 있어요.</p>
        <div class="row"><button class="btn" id="btnQuit">달력으로</button><button class="btn red" id="btnResume">계속하기</button></div>
      </div>
    </div>
    <div class="ov" id="resultOv" hidden>
      <div class="panel">
        <h2 id="resTitle">배달 성공!</h2>
        <div class="bigstars" id="resStars"></div>
        <div class="stats">
          <div><span>배달한 집</span><b id="resDone">0</b></div>
          <div><span>굴뚝 쏙!</span><b id="resChim">0</b></div>
          <div><span>받은 선물</span><b id="resCaught">0</b></div>
        </div>
        <p id="resMsg"></p>
        <div class="row"><button class="btn" id="btnCal">달력으로</button><button class="btn red" id="btnNext">다음 밤</button></div>
      </div>
    </div>
  </section>

  <div class="toast" id="toast" hidden></div>
</div>

<script>
(() => {
'use strict';

/* ---------- 게임 설정 (아들과 함께 바꿔 보세요!) ---------- */
const DAYS = 24;                 // 12월 1일 ~ 24일
function dayCfg(d){
  return {
    d,
    speed: 150 + d*4,            // 썰매 빠르기
    len: Math.min(85, 55 + d*1.2), // 밤의 길이(초)
    target: 4 + Math.ceil(d*0.55), // 배달해야 하는 집 수
    coal: d>=2 ? Math.min(0.55, 0.12 + d*0.02) : 0,   // 석탄이 떨어지는 정도
    cloud: d>=4 ? Math.min(0.45, 0.08 + d*0.015) : 0, // 먹구름이 나오는 정도
    giftEvery: Math.max(2.1, 3.3 - d*0.04),           // 하늘 선물이 내려오는 간격(초)
    snow: d>=6 ? Math.min(0.4, 0.1 + d*0.012) : 0,     // 장난꾸러기 눈사람이 나오는 정도
    sack: 5, hearts: 3,
  };
}
/* 난이도: 아이가 고를 수 있어요 */
const DIFF = {
  easy:  {name:'쉬움',   speed:0.85, target:0.8, danger:0.6, hearts:4},
  normal:{name:'보통',   speed:1,    target:1,   danger:1,   hearts:3},
  hard:  {name:'어려움', speed:1.15, target:1.2, danger:1.3, hearts:3},
};
function cfgFor(d,demo){
  const c=dayCfg(d); if(demo) return c; const k=DIFF[S.diff]||DIFF.normal;
  return {...c, speed:c.speed*k.speed, target:Math.max(3,Math.round(c.target*k.target)), coal:c.coal*k.danger, cloud:c.cloud*k.danger, snow:c.snow*k.danger, hearts:k.hearts};
}
/* 썰매 꾸미기: 달력에서 모은 별로 사요 */
const SHOP = [
  {id:'red',    kind:'color', name:'빨간 썰매', price:0},
  {id:'blue',   kind:'color', name:'파란 썰매', price:3},
  {id:'green',  kind:'color', name:'초록 썰매', price:3},
  {id:'purple', kind:'color', name:'보라 썰매', price:5},
  {id:'gold',   kind:'color', name:'황금 썰매', price:12},
  {id:'d2', kind:'deer', deer:2, name:'루돌프 2마리', price:0,  desc:'처음 썰매'},
  {id:'d4', kind:'deer', deer:4, name:'루돌프 4마리', price:6,  desc:'썰매가 더 빨리 움직여요'},
  {id:'d6', kind:'deer', deer:6, name:'루돌프 6마리', price:14, desc:'썰매가 아주 빨리 움직여요'},
  {id:'lights', kind:'toggle', name:'반짝이 전구', price:4, desc:'알록달록 불빛'},
  {id:'bell',   kind:'toggle', name:'썰매 방울',   price:2, desc:'선물 받을 때 딸랑딸랑'},
  {id:'sack',   kind:'perk',   name:'큰 자루',     price:8, desc:'선물 12개까지, 출발할 때 2개 더'},
];
const SLEIGH_COLORS = {red:['#C8302A','#F5C542'], blue:['#2F6BD8','#F4F8FF'], green:['#2E8B57','#F5C542'], purple:['#8A4FD0','#FFD978'], gold:['#E2B228','#FFF4CF']};
const STEER_SPEED = {2:380, 4:470, 6:560};
const GIFT_COLORS = [['#E0413A','#F5C542'],['#2E8B57','#F4F8FF'],['#4A7BE0','#F5C542'],['#B05CD6','#F4F8FF'],['#F08A3C','#2E8B57']];
const THANKS = ['고마워요 산타!','와 선물이다!','메리 크리스마스!','산타 최고!','우와아!'];

/* ---------- 저장 ---------- */
const SAVE_KEY='santa-gift-v1';
const fresh=()=>({stars:{}, total:0, muted:false, diff:'normal', spent:0, owned:{red:true,d2:true}, eq:{color:'red',deer:2,lights:false,bell:false}});
let S=fresh();
try{ const raw=localStorage.getItem(SAVE_KEY); if(raw) S=Object.assign(fresh(),JSON.parse(raw)); }catch(e){}
function save(){ try{ localStorage.setItem(SAVE_KEY,JSON.stringify(S)); }catch(e){} }
const starsOf = d => S.stars[d]||0;
const unlocked = d => d===1 || starsOf(d-1)>0;
const totalStars = () => Object.values(S.stars).reduce((a,b)=>a+b,0);
const starsLeft = () => totalStars() - (S.spent||0);
const look = () => ({color:S.eq.color, deer:S.eq.deer, lights:S.eq.lights, bell:S.eq.bell});

const $=id=>document.getElementById(id);
const rand=(a,b)=>a+Math.random()*(b-a);
const TAU=Math.PI*2;
const OUT='#1E2240';

/* ---------- 소리 ---------- */
let AC=null;
function tone(freqs,dur,type='square',vol=0.05){
  if(S.muted) return;
  try{
    if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended') AC.resume();
    const t0=AC.currentTime;
    freqs.forEach((f,i)=>{ const o=AC.createOscillator(), g=AC.createGain();
      o.type=type; o.frequency.setValueAtTime(f,t0+i*dur); g.gain.setValueAtTime(vol,t0+i*dur);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+(i+1)*dur); o.connect(g); g.connect(AC.destination);
      o.start(t0+i*dur); o.stop(t0+(i+1)*dur+0.02); });
  }catch(e){}
}
const SFX={
  bell:  ()=>tone([1568,2093,1568],0.06,'triangle',0.05),
  catch: ()=>tone([784,1047,1319],0.06,'triangle',0.06),
  drop:  ()=>tone([660,440],0.06,'sine',0.07),
  chim:  ()=>tone([784,988,1175,1568],0.08,'triangle',0.07),
  roof:  ()=>tone([523,659],0.08,'triangle',0.06),
  miss:  ()=>tone([300,220],0.08,'sine',0.05),
  hit:   ()=>tone([200,110],0.12,'sawtooth',0.06),
  tap:   ()=>tone([660],0.05,'triangle',0.06),

function drawSnow(c,WW,WH,t,dt){
  c.fillStyle='rgba(255,255,255,.85)';
  FLAKES.forEach(f=>{ f.y+=f.s*dt/WH; f.x-=(10+f.s*0.3)*dt/WW; if(f.y>1){f.y=0;f.x=Math.random();} if(f.x<0) f.x=1;
    ell(c,f.x*WW+Math.sin(t+f.w)*6,f.y*WH,f.r,f.r); c.fill(); });
}
function mix(a,b,k){ const pa=parseInt(a.slice(1),16), pb=parseInt(b.slice(1),16); const ch=(s)=>Math.round(((pa>>s)&255)*(1-k)+((pb>>s)&255)*k); return `rgb(${ch(16)},${ch(8)},${ch(0)})`; }

function shopClick(it){
  if(!S.owned[it.id]){
    const left=starsLeft();
    if(left<it.price){ toast(`별이 ${it.price-left}개 더 필요해요. 달력에서 밤을 성공하면 별을 받아요!`); SFX.miss(); return; }
    S.spent=(S.spent||0)+it.price; S.owned[it.id]=true; SFX.buy(); toast(`${it.name} 완성!`);
    if(it.kind==='toggle') S.eq[it.id]=true;
  } else { SFX.tap(); if(it.kind==='toggle') S.eq[it.id]=!S.eq[it.id]; if(it.kind==='perk') toast('이미 갖고 있어요. 늘 함께 가요!'); }
  if(it.kind==='color') S.eq.color=it.id;
  if(it.kind==='deer') S.eq.deer=it.deer;
  save(); renderShop();
}
function drawShop(dt){

let R=null;
const GRAV=900;
function newRun(d,demo){
  const cfg=cfgFor(d,demo), big=!demo && !!S.owned.sack;
  return {cfg, demo, t:0, scroll:0, y:150, ty:150, vy:0, tilt:0, hearts:cfg.hearts, sack:cfg.sack+(big?2:0), sackMax:big?12:9, steerV:STEER_SPEED[S.eq.deer]||380, snowmen:[], snowT:4, done:0, chim:0, caught:0,
    houses:[], gifts:[], drops:[], coals:[], clouds:[], parts:[], texts:[],
    giftT:1.2, coalT:3, cloudT:5, inv:0, shake:0, over:false, ready:demo, paused:false, dropCd:0, steer:null, ended:false};
}
function startDay(d){
  R=newRun(d,false); show('play');
  $('rdTitle').textContent = d===24 ? '12월 24일 크리스마스 이브!' : `12월 ${d}일 밤`;
  $('rdGoal').textContent = `선물 ${R.cfg.target}개 배달하기`;
  const tips=['떨어지는 선물을 썰매로 받아서 자루를 채워요.','굴뚝 위에 "지금!"이 보이면 선물 쏙!','까만 석탄은 피해요!','먹구름에 부딪히지 않게 조심!'];
  $('rdGoal').textContent += ` (${(DIFF[S.diff]||DIFF.normal).name})`;
  $('rdTip').textContent = d===6 ? '오늘부터 장난꾸러기 눈사람이 나와요! 부딪히면 선물을 하나 훔쳐 가요.' : d===1 ? '왼손으로 화면을 문질러 썰매를 움직이고, 오른손으로 "선물 쏙!"을 눌러요.' : (d===24 ? '오늘 밤은 크리스마스 이브! 모든 아이들이 기다리고 있어요.' : tips[d%tips.length]);
  $('readyOv').hidden=false; $('pauseOv').hidden=true; $('resultOv').hidden=true;
  $('steerHint').style.opacity=1; hudHearts();
}

pc.addEventListener('pointermove',e=>{ if(!R||!R.steer||R.steer.id!==e.pointerId) return; const p=localPoint(e); R.ty=R.steer.ty0+(p.y-R.steer.y0)*(400/pc.clientHeight)*1.25; });

function dropGift(){
  if(!R||R.over||!R.ready||R.paused) return;
  if(R.dropCd>0) return;
  if(R.sack<=0){ if(!R.demo){ toast('자루가 비었어요! 하늘에서 내려오는 선물을 받아요.'); SFX.miss(); } return; }
  R.sack--; R.dropCd=0.28; if(!R.demo) SFX.drop();
  R.drops.push({x:R.x-8, y:R.y+8, vy:40, vx:0, col:GIFT_COLORS[Math.floor(Math.random()*GIFT_COLORS.length)], rot:0});
}
function hit(){
  if(R.inv>0||R.demo) return;
  R.hearts--; R.inv=1.6; R.shake=0.35; SFX.hit(); hudHearts();
  if(navigator.vibrate) try{ navigator.vibrate(80); }catch(e){}
  if(R.hearts<=0) finish(false);
}
function finish(timeUp){
  if(R.over) return; R.over=true;
  const c=R.cfg, ok=R.done>=c.target;
  const stars = !ok ? 0 : R.done>=Math.ceil(c.target*1.6) ? 3 : R.done>=Math.ceil(c.target*1.3) ? 2 : 1;
  R.win=ok;
  S.total+=R.done; if(stars>starsOf(c.d)) S.stars[c.d]=stars; save();
  setTimeout(()=>{
    if(!R) return;
    $('resTitle').textContent = ok ? (c.d===24 ? '메리 크리스마스!' : '배달 성공!') : (timeUp ? '아침이 밝았어요!' : '산타가 지쳤어요');
    $('resStars').innerHTML = '★'.repeat(stars)+'<i>'+'★'.repeat(3-stars)+'</i>';
    $('resDone').textContent=`${R.done}/${c.target}`; $('resChim').textContent=R.chim; $('resCaught').textContent=R.caught;
    $('resMsg').textContent = ok
      ? (c.d===24 ? '모든 아이들이 선물을 받았어요. 산타의 크리스마스 대작전 대성공!' : stars<3 ? `${Math.ceil(c.target*(stars===1?1.3:1.6))}개를 배달하면 별을 더 받아요.` : '별 3개! 최고의 산타예요!')
      : `${c.target-R.done}개만 더 배달하면 성공이에요. 다시 해 봐요!`;
    $('btnNext').textContent = ok ? (c.d<DAYS ? '다음 밤' : '한 번 더') : '다시 하기';
    $('toast').hidden=true; $('resultOv').hidden=false;
    ok ? SFX.win() : SFX.lose();
    if(ok && c.d===24) R.fireworks=true;
  }, 600);
}

function step(cv,dt){
  const {w,h,d}=canvasSize(cv), c=cv.getContext('2d');
  const sc=h/400, WW=w/sc, WH=400, G=372;
  R.x = Math.min(WW*0.3, 220);
  const run = R.ready && !R.paused && !R.over;
  if(run){
    R.t+=dt; R.dropCd=Math.max(0,R.dropCd-dt); R.inv=Math.max(0,R.inv-dt); R.shake=Math.max(0,R.shake-dt);
    const v=R.cfg.speed*dt; R.scroll+=v;
    if(!R.demo && R.t>=R.cfg.len) finish(true);
    // 썰매 움직이기
    if(keys.ArrowUp) R.ty-=300*dt; if(keys.ArrowDown) R.ty+=300*dt;
    if(R.demo){ R.ty=150+Math.sin(R.t*0.8)*30; }
    R.ty=Math.max(102,Math.min(190,R.ty));
    const dy=Math.max(-R.steerV*dt,Math.min(R.steerV*dt,R.ty-R.y)); R.y+=dy; R.tilt += ((dy/dt)/1400 - R.tilt)*Math.min(1,dt*8);
    // 집
    let last=R.houses.length?R.houses[R.houses.length-1]:null;
    while(!last || last.x+last.w < WW+260){ const nx=last? last.x+last.w+rand(36,110) : WW*0.55; last=makeHouse(nx,G); R.houses.push(last); }
    R.houses.forEach(hs=>{ hs.x-=v; hs.thanksT=Math.max(0,hs.thanksT-dt); });
    R.houses=R.houses.filter(hs=>hs.x+hs.w>-40);
    // 하늘에서 내려오는 선물, 석탄, 먹구름
    R.giftT-=dt; if(R.giftT<=0){ R.giftT=R.cfg.giftEvery*rand(0.7,1.3); R.gifts.push({x:rand(WW*0.45,WW+60), y:-20, vy:rand(32,48), col:GIFT_COLORS[Math.floor(Math.random()*GIFT_COLORS.length)], sw:rand(0,TAU)}); }
    if(R.cfg.coal){ R.coalT-=dt; if(R.coalT<=0){ R.coalT=rand(1.5,3.2)/(R.cfg.coal*2.2); R.coals.push({x:rand(WW*0.5,WW+80), y:-20, vy:rand(85,125), rot:0, r:rand(10,13)}); } }
    if(R.cfg.cloud){ R.cloudT-=dt; if(R.cloudT<=0){ R.cloudT=rand(2.5,4.5)/(R.cfg.cloud*2.4); R.clouds.push({x:WW+80, y:rand(80,190), w:rand(80,110), h:rand(40,52)}); } }
    const sx=R.x, sy=R.y;
    R.gifts.forEach(gf=>{ gf.y+=gf.vy*dt; gf.x-=R.cfg.speed*0.45*dt; gf.sw+=dt*2;
      if(!gf.got && Math.hypot(gf.x-(sx-24), gf.y-(sy-30))<44){ gf.got=true;
        if(R.sack<R.sackMax){ R.sack++; R.caught++; if(!R.demo) (S.eq.bell?SFX.bell():SFX.catch()); R.texts.push({x:gf.x,y:gf.y,t:0.9,s:'+1 🎁'}); }
        else R.texts.push({x:gf.x,y:gf.y,t:0.9,s:'자루가 꽉 찼어요'}); } });
    R.gifts=R.gifts.filter(gf=>!gf.got && gf.y<G && gf.x>-40);
    R.coals.forEach(co=>{ co.y+=co.vy*dt; co.x-=R.cfg.speed*0.5*dt; co.rot+=dt*3;
      if(!co.hit && Math.hypot(co.x-(sx-6), co.y-(sy-22))<co.r+24){ co.hit=true; hit(); } });
    R.coals=R.coals.filter(co=>!co.hit && co.y<G+20 && co.x>-40);
    R.clouds.forEach(cl=>{ cl.x-=R.cfg.speed*1.15*dt;
      if(!cl.hit && Math.abs(cl.x-(sx-6))<cl.w*0.42+36 && Math.abs(cl.y-(sy-24))<cl.h*0.4+22){ cl.hit=true; hit(); } });
    R.clouds=R.clouds.filter(cl=>cl.x>-140);
    // 장난꾸러기 눈사람: 부딪히면 선물을 하나 가져가요
    if(R.cfg.snow){ R.snowT-=dt; if(R.snowT<=0){ R.snowT=rand(4,7)/(R.cfg.snow*2.5); R.snowmen.push({x:WW+60, y:rand(95,180), state:'go', t:0}); } }
    R.snowmen.forEach(sm=>{ sm.t+=dt;
      if(sm.state==='go'){ sm.x-=(R.cfg.speed*0.55+50)*dt; sm.y+=Math.max(-35*dt,Math.min(35*dt,(sy-18)-sm.y));
        if(Math.hypot(sm.x-(sx-10), sm.y-(sy-24))<40){ sm.state='flee';
          if(R.sack>0){ R.sack--; R.stolen=(R.stolen||0)+1; sm.gift=GIFT_COLORS[Math.floor(Math.random()*GIFT_COLORS.length)]; R.texts.push({x:sm.x,y:sm.y-52,t:1.4,s:'헤헤! 선물 하나 가져갈게~'}); if(!R.demo) SFX.giggle(); }
          else R.texts.push({x:sm.x,y:sm.y-52,t:1.2,s:'자루가 비었네? 칫!'}); } }
      else { sm.x+=70*dt; sm.y-=160*dt; } });
    R.snowmen=R.snowmen.filter(sm=>sm.x>-60 && sm.y>-90);
    // 떨어뜨린 선물
    R.drops.forEach(p=>{
      p.vy+=GRAV*dt; p.y+=p.vy*dt; p.rot+=dt*2;
      let best=null; R.houses.forEach(hs=>{ if(hs.done) return; const ch=chimney(hs,G); const dx=ch.cx-p.x; if(dx>-50 && dx<70 && ch.top>p.y-10 && (!best||Math.abs(dx)<Math.abs(best.dx))) best={dx}; });
      const tvx = best ? Math.max(-130,Math.min(130,best.dx*3)) : 0; p.vx += (tvx-p.vx)*Math.min(1,dt*6); p.x+=p.vx*dt;
      if(p.land) return;
      for(const hs of R.houses){
        const ch=chimney(hs,G);
        const inChim = Math.abs(p.x-ch.cx)<=17 && p.y>=ch.top-2 && p.y<=ch.top+22;
        const onRoof = p.x>=hs.x-8 && p.x<=hs.x+hs.w+8 && p.y>=roofY(hs,G,p.x)-4;
        if(inChim || onRoof){ p.land=true;
          if(hs.done){ if(!R.demo){ R.texts.push({x:p.x,y:p.y-10,t:1,s:'벌써 받았어요'}); SFX.miss(); } }
          else { hs.done=true; R.done++; hs.thanks=THANKS[Math.floor(Math.random()*THANKS.length)]; hs.thanksT=1.6;
            if(inChim){ R.chim++; if(!R.demo) SFX.chim(); R.texts.push({x:ch.cx,y:ch.top-20,t:1,s:'굴뚝 쏙!'}); for(let i=0;i<14;i++) R.parts.push({x:ch.cx,y:ch.top,vx:rand(-90,90),vy:rand(-180,-60),life:.9,col:['#F5C542','#FFFFFF','#E0413A'][i%3]}); }
            else { if(!R.demo) SFX.roof(); R.texts.push({x:p.x,y:p.y-16,t:1,s:'지붕에 쿵!'}); for(let i=0;i<8;i++) R.parts.push({x:p.x,y:p.y,vx:rand(-60,60),vy:rand(-120,-40),life:.7,col:'#FFFFFF'}); }
          }
          break; }
      }
      if(!p.land && p.y>=G-6){ p.land=true; if(!R.demo) SFX.miss(); R.texts.push({x:p.x,y:G-24,t:0.9,s:'앗, 눈밭에...'}); for(let i=0;i<8;i++) R.parts.push({x:p.x,y:G,vx:rand(-60,60),vy:rand(-90,-30),life:.6,col:'#FFFFFF'}); }
    });
    R.drops=R.drops.filter(p=>!p.land && p.x>-30);
    // 데모: 알아서 배달
    if(R.demo){ R.houses.forEach(hs=>{ if(!hs.done && aimed(hs,G)) dropGift(); }); if(R.sack<2) R.sack=5; }
  }
  R.parts=R.parts.filter(p=>(p.life-=dt)>0); R.texts=R.texts.filter(tx=>(tx.t-=dt)>0);
  // ---- 그리기
  c.setTransform(d*sc,0,0,d*sc,0,0);
  if(R.shake>0) c.translate(rand(-4,4)*R.shake*3, rand(-4,4)*R.shake*3);
  const dawn = R.demo ? 0 : Math.max(0,(R.t/R.cfg.len-0.75)/0.25);
  drawSky(c,WW,WH,G,performance.now()/1000,R.scroll,Math.min(1,dawn),R.demo?0.56:0.86);
  if(R.cfg.d===24 && !R.demo){ drawTree(c,WW*0.5-((R.scroll*0.45)%(WW+400))+WW*0.5+200,G-20,performance.now()/1000); }
  drawGround(c,WW,WH,G,R.scroll);
  const tt=performance.now()/1000;
  R.houses.forEach(hs=>drawHouse(c,hs,G,tt,!R.demo && R.ready && R.sack>0 && aimed(hs,G)));
  R.clouds.forEach(cl=>drawCloud(c,cl.x,cl.y,cl.w,cl.h,tt));
  R.snowmen.forEach(sm=>drawSnowman(c,sm.x,sm.y+Math.sin(sm.t*3)*3,tt,{gift:sm.gift}));
  R.gifts.forEach(gf=>{ const bx=gf.x+Math.sin(gf.sw)*6; c.strokeStyle='#DDE3F3'; c.lineWidth=1.2; c.beginPath(); c.moveTo(bx-9,gf.y-8); c.lineTo(bx-14,gf.y-30); c.moveTo(bx+9,gf.y-8); c.lineTo(bx+14,gf.y-30); c.stroke();
    c.fillStyle=gf.col[0]; c.beginPath(); c.ellipse(bx,gf.y-34,17,10,0,Math.PI,TAU); c.fill(); c.strokeStyle=OUT; c.lineWidth=1.6; c.stroke();
    drawGift(c,bx,gf.y,16,gf.col,Math.sin(gf.sw)*0.15); });
  R.coals.forEach(co=>drawCoal(c,co.x,co.y,co.r,co.rot));
  R.drops.forEach(p=>drawGift(c,p.x,p.y,15,p.col,p.rot));
  const blink = R.inv>0 && Math.floor(R.inv*12)%2===0;
  if(!blink){ c.save(); c.globalAlpha=0.25; c.fillStyle='#8FA3D8'; ell(c,R.x+40,G+6,70,5); c.fill(); c.restore();
    drawSleigh(c,R.x,R.y,tt,{...look(),tilt:R.tilt,sack:R.sack}); }
  R.parts.forEach(p=>{ p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=260*dt; c.globalAlpha=Math.min(1,p.life*2); c.fillStyle=p.col; ell(c,p.x,p.y,3,3); c.fill(); }); c.globalAlpha=1;
  R.texts.forEach(tx=>{ c.globalAlpha=Math.min(1,tx.t*2); c.font='17px Jua, sans-serif'; c.textAlign='center'; c.lineWidth=4; c.strokeStyle='rgba(14,26,69,.8)'; const yy=tx.y-(1-tx.t)*24; c.strokeText(tx.s,tx.x,yy); c.fillStyle='#FFF4CF'; c.fillText(tx.s,tx.x,yy); }); c.globalAlpha=1;
  drawSnow(c,WW,WH,tt,dt);
  if(R.fireworks) drawFireworks(c,WW,dt);
  // HUD
  if(!R.demo){
    $('hSack').textContent=`🎁 ${R.sack}`; $('hDone').textContent=`🏠 ${R.done}/${R.cfg.target}`;
    $('hTime').style.width=`${Math.min(100,R.t/R.cfg.len*100)}%`;
  }
}
function aimed(hs,G){ // 지금 떨어뜨리면 굴뚝에 들어갈까?
  if(hs.done) return false; const ch=chimney(hs,G); const fall=Math.max(0,ch.top-(R.y+8)); const tf=Math.sqrt(2*fall/GRAV);
  const lead=ch.cx - R.cfg.speed*tf - (R.x-8); return lead>-26 && lead<30;
}
function drawTree(c,x,G,t){
  c.save(); c.lineWidth=2; c.strokeStyle=OUT;
  c.fillStyle='#7A4A2E'; c.fillRect(x-10,G-10,20,30);
  for(let i=0;i<4;i++){ const w=110-i*24, y=G-10-i*42; c.fillStyle='#2E8B57'; c.beginPath(); c.moveTo(x-w/2,y); c.lineTo(x,y-70); c.lineTo(x+w/2,y); c.closePath(); c.fill(); c.stroke(); }
  for(let i=0;i<14;i++){ c.fillStyle=['#E0413A','#F5C542','#4A7BE0','#FFFFFF'][i%4]; c.globalAlpha=0.6+0.4*Math.sin(t*4+i); ell(c,x+Math.sin(i*2.3)*(40-i*2),G-30-i*11,4,4); c.fill(); }
  c.globalAlpha=1; c.fillStyle='#F5C542'; c.beginPath(); for(let i=0;i<10;i++){ const a=-Math.PI/2+i*Math.PI/5, r=i%2?7:16; c.lineTo(x+Math.cos(a)*r,G-206+Math.sin(a)*r); } c.closePath(); c.fill(); c.stroke();
  c.restore();
}
let FW=[];
function drawFireworks(c,WW,dt){
  if(Math.random()<dt*2.2){ const x=rand(WW*0.15,WW*0.85), y=rand(60,170), col=['#F5C542','#E0413A','#7FE0FF','#B05CD6','#7CD67C'][Math.floor(Math.random()*5)];
    for(let i=0;i<34;i++){ const a=i/34*TAU, sp=rand(90,150); FW.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1.3,col}); } }
  FW=FW.filter(p=>(p.life-=dt)>0);
  FW.forEach(p=>{ p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=60*dt; p.vx*=0.985; c.globalAlpha=Math.min(1,p.life); c.fillStyle=p.col; ell(c,p.x,p.y,2.4,2.4); c.fill(); });
  c.globalAlpha=1;
}

/* ---------- 처음 화면 데모 ---------- */
let D=null;
function startDemo(){ D=newRun(3,true); D.cfg={...D.cfg, coal:0, cloud:0, len:1e9}; }

/* ---------- 메인 루프 ---------- */
let last=0;
function loop(ts){
  const dt=Math.min(0.033,(ts-last)/1000||0); last=ts;
  try{
    if(screen==='shop') drawShop(dt);
    else if(screen==='title' && D){ const keep=R; R=D; step($('titleCv'),dt); R=keep; }
    else if(screen==='play' && R) step($('playCv'),dt);
  }catch(e){ console.error(e); }
  requestAnimationFrame(loop);
}

/* 앱 아이콘 만들기용 */
window.__santaIcon = size => { const cv=document.createElement('canvas'); cv.width=cv.height=size; const c=cv.getContext('2d');
  const g=c.createLinearGradient(0,0,0,size); g.addColorStop(0,'#0B1640'); g.addColorStop(1,'#2A3E7A'); c.fillStyle=g; c.fillRect(0,0,size,size);
  c.fillStyle='#FFF4CF'; ell(c,size*0.78,size*0.22,size*0.09,size*0.09); c.fill();
  c.fillStyle='#F4F8FF'; c.fillRect(0,size*0.82,size,size);
  c.save(); c.translate(size*0.3,size*0.6); c.scale(size/260,size/260); drawSleigh(c,0,0,0.2,{tilt:-0.1,sack:3}); c.restore();
  return cv.toDataURL('image/png'); };

function boot(){
  startDemo(); show('title'); requestAnimationFrame(loop);
  try{ const o=window.screen&&window.screen.orientation; if(o&&o.lock) o.lock('landscape').catch(()=>{}); }catch(e){}
  try{ if('serviceWorker' in navigator && location.protocol==='https:' && window.self===window.top) navigator.serviceWorker.register('sw.js').catch(()=>{}); }catch(e){}
}
boot();
})();
</script>
