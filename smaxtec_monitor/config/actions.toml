# 알림별 조치 가이드 — 앱(목장별·그룹행동·오늘 할 일)·방문요약·일일 리포트 '조치가이드' 시트에 표시
#
# ⚠ 원칙: 센서 알림은 '의심 신호'이지 진단이 아님. 확인·사양/환경 조치·수의사 연락 기준만 담고
#   약품명·용량은 넣지 않음(진료·처방은 수의사 업무, 휴약기간·잔류 책임 문제).
# 수치 표시: [문헌] = 논문·공식 지침에 근거한 기준 / [관행] = 현장에서 널리 쓰는 경험 기준(목장마다 조정)
# smaXtec 볼루스는 제2위(망위) 안의 체온을 재므로 직장온 문헌 수치와 그대로 비교하지 말고 '추세·상대 비교'로 볼 것 (pH 볼루스는 사용 안 함)
#
# 서버(팀 공용)에서는 관리자 화면 → '조치 가이드 편집'에서 엑셀로 받아 고쳐 올리면 이 파일 대신 그 내용이 쓰임
#
# 항목 형식
#   [[guide]]
#   id    = 고유 이름(영문, 바꾸지 말 것)
#   title = 화면 제목
#   when  = 보여줄 신호. 알림 코드(TEMP_HIGH 등, 72시간 내 1두 이상) 또는
#           그룹행동 판정: LYING(누운 시간 감소·부족), SYNC(함께 눕기 감소), GROUP_RUM(그룹 반추 감소)
#   check = ① 먼저 확인 / act = ② 바로 할 조치(사양·환경) / vet = ③ 수의사 연락 기준 / ref = 근거·출처

[[guide]]
id = "temp_high"
title = "체온 상승"
when = ["TEMP_HIGH"]
check = [
  "직장 체온으로 재확인 — 성우 정상 38.0~39.2℃, 39.5℃ 이상 발열 [관행]. 볼루스(제2위) 체온은 찬물을 마시면 잠시 내려가고 직장온과 차이가 있어 직장온이 기준",
  "측정 시각 — 체온은 오후·더운 시간에 높아짐. 이른 아침(더위 영향 적을 때) 다시 재서 비교 [관행]",
  "smaXtec 알림 단계 — '체온 상승'보다 '고체온(High temperature increase)'이 더 높은 단계. 반추 감소가 같이 오면 질병 가능성이 높음 [문헌: Stangaferro 2016]",
  "분만 0~10일: 자궁(악취 나는 적갈색 묽은 분비물 = 산후 자궁염 [문헌: Sheldon 2006]), 후산정체(분만 후 24시간 넘게 태반이 안 나옴), 유방",
  "분만 10~30일: 유방염, 폐렴, 케토시스·제4위 전위에 따른 2차 문제",
  "비유 중기 이후: 유방염(대장균성은 처음 고열 뒤 체온이 오히려 떨어지며 악화될 수 있음 → 체온 내려도 상태 확인), 폐렴, 발굽 감염(지간 붓기·악취)",
  "호흡기: 안정 시 호흡수(성우 대략 분당 26~50회 [문헌 범위]), 콧물·기침·눈물 / 송아지·육성우는 호흡기 점수표로 [문헌: McGuirk 2008]",
  "최근 백신 접종 여부 — 접종 후 1~2일 일시 발열은 흔함 [관행]",
  "같은 그룹 여러 마리 동시: 더운 시간대에 몰리면 더위(THI), 기침·설사·유산 동반이면 전염성. 여름~가을 갑작스런 고열(40~42℃)·절뚝임·뻣뻣함이 여러 마리면 소유행열 의심",
  "⚠ 발열 + 입·발굽 물집·침 흘림(구제역), 피부 혹(결절)이 온몸에(럼피스킨병) → 법정 가축전염병 의심",
]
act = [
  "아픈 소는 그늘·물·깨끗한 깔짚이 있는 곳으로 분리, 사료 섭취·유량·분변을 하루 2회 관찰",
  "체온은 같은 방법(직장)·비슷한 시각에 하루 2회 재서 기록 → 수의사에게 추세를 그대로 전달",
  "여러 마리 동시 발열 + 호흡기·소화기 증상 → 격리, 외부인·차량 출입 통제와 소독, 최근 입식·이동·백신 이력 정리",
  "고온기면 '고온 스트레스' 가이드의 냉방 조치 함께",
  "해열제·항생제를 임의로 쓰지 않기 — 원인이 가려지고 잔류 위험. 사용은 수의사 처방대로",
  "앱 '조치·결과 기록'에 남기고 7일 뒤 결과(회복·치료·도태) 입력",
]
vet = [
  "직장온 40.0℃ 이상이 24시간 넘게 지속, 41℃ 이상은 바로",
  "사료를 거의 안 먹음, 유량 급감, 탈수, 일어서기 힘듦, 호흡 곤란",
  "산후 자궁염 의심(분만 21일 이내 + 발열 + 악취 분비물), 후산정체 + 발열",
  "구제역·럼피스킨병 등 법정 가축전염병 의심 증상 → 이동 중지, 수의사 연락과 함께 가축전염병 신고(1588-9060)",
]
ref = [
  "Sheldon IM et al. 2006. Defining postpartum uterine disease in cattle. Theriogenology 65:1516",
  "Stangaferro ML et al. 2016. Use of rumination and activity monitoring for the identification of dairy cows with health disorders. J Dairy Sci 99:7395",
  "McGuirk SM. 2008. Disease management of dairy calves and heifers. Vet Clin North Am Food Anim Pract 24:139",
  "농림축산검역본부 가축전염병 신고 안내(1588-9060), 가축전염병예방법",
]

[[guide]]
id = "temp_low"
title = "체온 하강"
when = ["TEMP_LOW"]
check = [
  "분만 예정일 — 분만 12~24시간 전 체온이 0.3~0.5℃ 떨어지는 경우가 많음 [문헌]",
  "분만 직후(특히 3산 이상)면 유열 단계 확인: 1단계 서서 떨림·예민 → 2단계 엎드려 못 일어남·귀 차가움 → 3단계 옆으로 누움·의식 저하",
  "찬물을 많이 마신 직후의 일시 하강인지(1~2시간 뒤 회복) 확인",
]
act = [
  "분만 임박이면 분만방 준비, 관찰 간격 1~2시간으로",
  "분만 직후 고위험우(3산 이상·과비)는 기립 여부를 자주 확인, 미끄럽지 않은 바닥",
  "예방: 건유 후기 사료의 칼슘 대사 관리(DCAD 등)를 영양 담당과 점검",
]
vet = [
  "일어서지 못함(유열 2~3단계) → 즉시. 혈중 칼슘 1.4 mmol/L 미만이면 임상 유열 수준 [문헌: Goff 2008]",
  "체온이 계속 떨어지고 의식이 흐림(쇼크 가능)",
]
ref = [
  "Burfeind O et al. 2011. Validation of vaginal temperature measurement to predict calving in dairy cows. J Dairy Sci",
  "Goff JP. 2008. The monitoring, prevention, and treatment of milk fever and subclinical hypocalcemia. Vet J 176:50",
]

[[guide]]
id = "rumination"
title = "반추 감소 (개체)"
when = ["RUMINATION_DROP"]
check = [
  "평소 대비 감소 폭 — 착유우 하루 반추 약 400~600분 [문헌], 개체 자기 평소보다 크게 줄었는지가 중요",
  "분만 30일 이내면 혈중 케톤(BHB) 간이검사: 1.2 mmol/L 이상 준임상, 3.0 이상 임상 케토시스 [문헌: McArt 2012]",
  "왼쪽 마지막 갈비뼈 부근을 손가락으로 튕기며 청진 → '핑' 소리면 제4위 좌방전위 의심(대부분 분만 후 한 달 안에 발생)",
  "분변(양 감소·묽음·끈적임), 배 모양, 체온, 다른 알림(체온 상승·유방염) 동반 여부",
]
act = [
  "신선한 사료·물 충분히, 사조 자주 밀어주기, 경쟁 적은 곳에서 먹게",
  "여러 마리면 '그룹 반추 감소' 가이드(사료 점검)를 함께 보기",
  "센서 반추 감소는 임상 증상보다 며칠 먼저 나타나는 경우가 많음 → 증상 없어도 하루 두 번 관찰 [문헌: Stangaferro 2016]",
]
vet = [
  "2일 이상 회복이 없음, 케톤 양성, 핑음 확인, 사료를 거의 안 먹음",
  "열이 동반되거나 등이 굽고 아파함(외상성 제2위염 등)",
]
ref = [
  "Stangaferro ML et al. 2016. Use of rumination and activity monitoring for the identification of dairy cows with health disorders. J Dairy Sci 99:7395",
  "McArt JAA et al. 2012. Epidemiology of subclinical ketosis in early lactation dairy cattle. J Dairy Sci 95:5056",
]

[[guide]]
id = "group_rum"
title = "그룹 반추 감소"
when = ["GROUP_RUM", "GROUP_RUMINATION"]
check = [
  "최근 1~2주 배합비·원료·조사료 로트 변경(새 사일리지 개봉, 건초 교체), 원료 수분 변화(비 온 뒤 사일리지)",
  "TMR 입자(펜스테이트 체): 착유우 상단 2~8% · 2단 30~50% · 3단 10~20% · 바닥 30~40% [문헌: Heinrichs 2013]",
  "골라 먹기 — 급여 직후와 잔량의 입자 분포 비교, 잔량이 급여량의 3~5% 정도인지 [관행]",
  "급여 시각·횟수 변경, 사조 비어 있는 시간, 사료 냄새·곰팡이·발열(2차 발효)",
  "더위·과밀·합사 등 환경 변화 → 누운 시간도 같이 줄었는지",
  "산독증(SARA) 가능성: 분변이 묽고 거품·곡물 알갱이, 검정성적 유지방/유단백 1.0 미만 소가 늘었는지(목장 상세 4-3), 농후사료 증량 속도",
  "유효섬유: 8mm 이상 물리적 유효 NDF 가 건물의 약 18.5% 이상이면 반추위 산도 유지에 유리 [문헌: Zebeli 2012]",
]
act = [
  "변경한 원료·배합이 있으면 원인 후보부터 되돌리거나 1~2주에 걸쳐 천천히 바꾸기",
  "하루 2회 이상 급여, 사조 밀어주기 자주(사조가 비지 않게), 골라 먹으면 수분 조정(TMR 수분 45~50% 내외 [관행])·입자 조정",
  "사일리지 표면 관리(열·곰팡이 부분 제거), 개봉면 하루 일정 두께 이상 사용",
  "산독증이 의심되면 농후사료 분할 급여·증량 천천히, 완충제 사용 여부는 영양 담당과 협의",
]
vet = [
  "반추 감소와 함께 체온 상승·설사가 그룹에 퍼질 때(전염성 질병·중독 가능)",
]
ref = [
  "Heinrichs J. 2013. The Penn State Particle Separator. Penn State Extension DSE 2013-186",
  "Zebeli Q et al. 2012. Invited review: Role of physically effective fiber and estimation of dietary fiber adequacy in high-producing dairy cattle. J Dairy Sci 95:1041",
  "Leonardi C, Armentano LE. 2003. Effect of quantity, quality, and length of alfalfa hay on selective consumption by dairy cows. J Dairy Sci 86:557",
]

[[guide]]
id = "drinking"
title = "음수 이상"
when = ["DRINKING_ABNORMAL"]
check = [
  "급수조 — 물 나오는 양·수압(한 번에 여러 마리가 마셔도 수위 유지), 청결(이끼·사료 찌꺼기), 물 온도",
  "필요량: 착유우는 유량 1kg 당 물 약 3~4L 이상, 하루 80~150L [문헌: NASEM 2021 범위]",
  "물 먹다 움찔하거나 망설이면 누전 의심, 서열 낮은 소가 접근 못 하는지",
  "급수 공간: 그룹당 급수조 2곳 이상, 두당 수조 길이 약 10cm [관행]",
]
act = [
  "급수조 청소(주 1회 이상 [관행]), 급수 공간 늘리기, 착유 후 동선에 급수조",
  "누전 의심이면 전기 점검(소가 닿는 지점 전압 측정)",
]
vet = [
  "눈이 꺼지고 피부를 집었다 놓았을 때 바로 펴지지 않는 탈수, 사료도 안 먹을 때",
]
ref = [
  "NASEM. 2021. Nutrient Requirements of Dairy Cattle, 8th rev. ed. (water)",
]

[[guide]]
id = "activity"
title = "활동 감소"
when = ["ACTIVITY_DROP"]
check = [
  "보행 점수(1~5점) — 2점부터 등이 굽기 시작, 3점 이상이면 파행 [문헌: Sprecher 1997]",
  "발굽·지간(지간피부염), 다리 붓기·열감, 관절",
  "통로 바닥 미끄러움·요철, 깔짚 상태, 착유장 대기 시간",
]
act = [
  "파행우는 이동 거리 줄이고 편한 바닥으로, 발굽 손질 일정 앞당기기",
  "그룹 전체 보행 점수를 매겨 파행 비율 확인(파행이 많으면 바닥·발 소독조·삭제 주기 점검)",
]
vet = [
  "체중을 싣지 못하는 파행, 붓기·열감·악취 → 수의사·삭제사",
]
ref = [
  "Sprecher DJ et al. 1997. A lameness scoring system that uses posture and gait to predict dairy cattle reproductive performance. Theriogenology 47:1179",
]

[[guide]]
id = "ketosis"
title = "케토시스 의심"
when = ["KETOSIS"]
check = [
  "혈중 BHB 간이검사: 1.2 mmol/L 이상 준임상, 3.0 이상 임상 [문헌: McArt 2012]",
  "목장 경보 수준: 분만 초기 소를 여러 두(예: 12두) 검사해 10% 이상 양성이면 목장 문제로 봄 [문헌: Oetzel 2004]",
  "분만 시 체형점수(BCS) — 과비(3.75 이상)는 위험 증가, 분만 전후 BCS 감소 폭",
  "건유 후기 사료 섭취, 신선우 그룹 과밀, 분만 후 반추·사료 섭취 회복 속도",
]
act = [
  "사료 섭취 최대한 확보(신선한 사료·물·사조 공간), 신선우 그룹 과밀 줄이기",
  "에너지 보충 방법은 수의사·영양 담당과 협의",
  "전환기 탭에서 케토시스 의심 발생률이 담당 목장 중앙값보다 높은지 확인 → 건유 사양 점검",
]
vet = [
  "케톤 3.0 이상, 사료를 거의 안 먹음, 신경 증상(핥기·비틀거림·공격성)",
]
ref = [
  "McArt JAA et al. 2012. Epidemiology of subclinical ketosis in early lactation dairy cattle. J Dairy Sci 95:5056",
  "Oetzel GR. 2004. Monitoring and testing dairy herds for metabolic disease. Vet Clin Food Anim 20:651",
]

[[guide]]
id = "mastitis"
title = "유방염 의심"
when = ["MASTITIS"]
check = [
  "전착유 후 유즙 확인(덩어리·묽음·색), CMT 검사, 유방 붓기·열감",
  "중증도: 1등급 유즙만 이상 / 2등급 유방 이상 동반 / 3등급 발열·식욕부진 등 전신 증상 [문헌: NMC]",
  "체세포 20만/ml 이상은 준임상 유방염 기준으로 흔히 씀 [문헌] — 검정성적(목장 상세 4-3)과 비교",
  "착유 위생: 전착유·전침지(30초 이상 접촉)·건조, 라이너 교체 주기(약 2,500회 착유 [관행]), 깔짚 청결",
]
act = [
  "이상 분방 구분 착유, 감염우 착유 순서 뒤로, 깔짚 건조·청결 유지",
  "같은 시기 여러 두 발생이면 착유기 점검(진공·맥동)과 착유 절차 재교육",
]
vet = [
  "발열·사료 안 먹음 등 전신 증상(3등급) → 즉시",
  "치료는 수의사 처방대로, 휴약기간 지켜 출하유 관리",
]
ref = [
  "National Mastitis Council (NMC). Laboratory and Field Handbook on Bovine Mastitis",
  "Dohoo IR, Leslie KE. 1991. Evaluation of changes in somatic cell counts as indicators of new intramammary infections. Prev Vet Med 10:225",
]

[[guide]]
id = "milk_fever"
title = "유열 위험"
when = ["MILK_FEVER"]
check = [
  "분만 72시간 이내, 3산 이상·과비 소에서 위험 높음",
  "단계: 서서 떨림·예민(1) → 엎드려 못 일어남·귀 차가움(2) → 옆으로 누움·의식 저하(3)",
  "임상 유열은 혈중 칼슘 약 1.4 mmol/L 미만, 준임상 저칼슘은 약 2.0 mmol/L 미만 [문헌: Goff 2008]",
]
act = [
  "분만 전후 집중 관찰, 넘어져 다치지 않게 바닥 정리",
  "예방: 건유 후기 음이온 사료(DCAD) 사용 시 소변 pH 6.0~7.0 범위 확인 [관행·문헌 범위], 영양 담당과 점검",
]
vet = [
  "일어서지 못함 → 즉시 연락",
]
ref = [
  "Goff JP. 2008. The monitoring, prevention, and treatment of milk fever and subclinical hypocalcemia. Vet J 176:50",
  "Charbonneau E et al. 2006. Meta-analysis of the effect of dietary cation-anion difference on milk fever. J Dairy Sci 89:537",
]

[[guide]]
id = "calving"
title = "분만 임박"
when = ["CALVING"]
check = [
  "분만방·깔짚 준비, 관찰 간격 1~2시간",
  "양막(물주머니)이 보인 시각 기록 → 진행 속도 판단 기준",
]
act = [
  "조용한 환경 유지, 불필요한 개입 자제",
  "초유: 분만 후 1~2시간 안에 4L(홀스타인) 급여, 굴절당도계 Brix 22% 이상이면 양질 [문헌: Bielmann 2010]",
]
vet = [
  "양막이 보이고 약 70분이 지나도 진전이 없으면 도움 필요 [문헌: Schuenemann 2011], 송아지 자세 이상·다리 하나만 보임",
]
ref = [
  "Schuenemann GM et al. 2011. Assessment of calving progress and reference times for obstetric intervention during dystocia in Holstein dairy cows. J Dairy Sci 94:5494",
  "Bielmann V et al. 2010. An evaluation of Brix refractometry instruments for measurement of colostrum quality in dairy cattle. J Dairy Sci 93:3713",
]

[[guide]]
id = "heat_stress"
title = "고온 스트레스 · 그룹 체온 상승"
when = ["HEAT_STRESS", "GROUP_TEMP"]
check = [
  "온습도지수(THI): 고능력 착유우는 THI 68 전후부터 유량 감소 시작 [문헌: Zimbelman 2009]",
  "호흡수: 분당 60회 이상이면 더위 스트레스 신호 [관행], 입 벌리고 숨쉬면 심함",
  "환기팬 작동·풍속, 분무(소 몸을 적시고 → 송풍으로 말리는 반복), 차광, 급수조 수와 물 온도",
]
act = [
  "송풍 + 분무(적시기→말리기) 가동, 착유 대기장 냉방 우선, 그늘 확보",
  "급수 공간 늘리기, 급여는 서늘한 시간대로 옮기고 사조 자주 밀어주기",
  "과밀 줄이기(서 있는 소가 늘면 더 더워짐)",
]
vet = [
  "입 벌리고 숨쉼·침 흘림, 기립 불능, 직장온 41℃ 이상",
]
ref = [
  "Zimbelman RB et al. 2009. A re-evaluation of the impact of temperature humidity index and black globe humidity index on milk production in high producing dairy cows. Proc SW Nutr Conf",
  "Armstrong DV. 1994. Heat stress interaction with shade and cooling. J Dairy Sci 77:2044",
]

[[guide]]
id = "lying"
title = "누운 시간 감소·부족"
when = ["LYING"]
check = [
  "누울 자리 — 수용 두수가 우상 수의 100% 이하인지(신선·건유 후기 그룹은 80~85% 권장) [관행·문헌 범위: Grant 2007]",
  "착유 대기 포함 우사 밖에 있는 시간: 하루 3~3.5시간 이내 [관행]",
  "깔짚 건조·두께, 우상 크기·칸막이·목걸이 높이, 우상에 서 있기만 하는 소가 많은지",
  "해충: 침파리(앞다리를 물어 발 구름·꼬리 치기), 모기·등에. 앞다리 파리 수가 다리당 평균 5마리 이상이면 방제 고려 [관행]",
  "더위(THI)로 서 있는 소가 늘었는지 — 볼루스 기반 누운 시간은 다리센서 문헌(12~14시간)과 직접 비교 말고 목장 간·평소 대비로",
]
act = [
  "과밀 줄이기(그룹 재편), 깔짚 보충·건조 유지",
  "침파리 방제는 번식지 제거가 우선: 유충은 사료 찌꺼기 섞인 젖은 깔짚·분뇨에서 자람 → 사조 아래·송아지 우리 주변·퇴비 더미를 주 1회 이상 치우기",
  "끈끈이 트랩·방충망, 환기팬 풍속 올리기(파리 활동 감소)",
  "살충제는 착유우 사용 가능 제품인지·라벨 용법·휴약기간 확인 후 사용",
]
vet = [
  "파행이 원인으로 보일 때, 해충으로 피부 병변·빈혈(진드기)이 보일 때",
]
ref = [
  "Grant RJ. 2007. Taking advantage of natural behavior improves dairy cow performance. Proc Western Dairy Management Conf",
  "Taylor DB et al. 2012. Economic impact of stable flies on dairy and beef cattle production. J Med Entomol 49:198",
]

[[guide]]
id = "sync"
title = "함께 눕기 감소"
when = ["SYNC"]
check = [
