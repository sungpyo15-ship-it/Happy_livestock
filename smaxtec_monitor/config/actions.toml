# 알림별 조치 가이드 — 앱(목장별·그룹행동)·방문요약·일일 리포트 '조치가이드' 시트에 표시
#
# ⚠ 원칙: 센서 알림은 '의심 신호'이지 진단이 아님. 이 가이드는 확인·사양/환경 조치·수의사 연락 기준만 담고
#   약품명·용량은 넣지 않음(진료·처방은 수의사 업무, 휴약기간·잔류 책임 문제).
#   숫자 기준은 일반 지침 수준의 초안 → 협력 수의사 검토 후 이 파일을 직접 고쳐서 사용.
#
# 항목 형식
#   [[guide]]
#   id    = 고유 이름(영문)
#   title = 화면 제목
#   when  = 이 가이드를 보여줄 신호. 알림 코드(TEMP_HIGH 등, 72시간 내 1두 이상) 또는
#           그룹행동 판정: LYING(누운 시간 감소·부족), SYNC(함께 눕기 감소), GROUP_RUM(그룹 반추 감소)
#   check = ① 먼저 확인할 것 / act = ② 바로 할 조치(사양·환경) / vet = ③ 수의사 연락 기준

[[guide]]
id = "temp_high"
title = "체온 상승"
when = ["TEMP_HIGH"]
check = [
  "분만 후 며칠째인지 — 10일 이내면 자궁(악취 분비물)·유방·폐(호흡) 순서로 확인",
  "사료 먹는지, 유량·분변·호흡수, 직장 체온 재측정(39.5℃ 이상 발열)",
  "같은 그룹에서 여러 마리가 동시에 올랐는지(더위 스트레스·전염성 질환 구분)",
]
act = [
  "그늘·환기·물 확보, 아픈 소는 편히 쉴 수 있는 곳으로 분리",
  "여러 마리 동시면 우사 온도·환기팬·분무 확인(고온 스트레스 가이드 참고)",
]
vet = [
  "40℃ 이상이 24시간 넘게 지속, 사료 안 먹음, 유량 급감, 호흡 곤란",
  "그룹 여러 마리 동시 발열 + 기침·설사 등 다른 증상 동반(전염성 의심 → 격리)",
]

[[guide]]
id = "temp_low"
title = "체온 하강"
when = ["TEMP_LOW"]
check = [
  "분만 예정일 확인 — 분만 12~24시간 전 체온이 떨어지는 경우가 많음",
  "분만 직후라면 귀·다리가 차가운지, 일어서기 힘들어하는지(유열 의심)",
  "사료 먹는지, 기운 없는지",
]
act = [
  "분만 임박이면 분만방 준비·관찰 간격 줄이기",
  "분만 직후 개체는 집중 관찰, 충분한 물·사료 제공",
]
vet = [
  "일어서지 못함, 체온이 계속 떨어짐, 의식 저하 → 즉시 연락",
]

[[guide]]
id = "rumination"
title = "반추 감소 (개체)"
when = ["RUMINATION_DROP"]
check = [
  "사료 먹는 양·분변(양·묽기), 배 모양(왼쪽 배가 꺼지거나 부풀었는지)",
  "분만 후 30일 이내면 케톤 간이검사(혈중 BHB 1.2 이상이면 준임상 케토시스로 봄)",
  "왼쪽 옆구리를 두드리며 들었을 때 '핑' 소리(제4위 전위 의심)",
  "체온 상승·유방염·파행 등 다른 알림이 같이 있는지",
]
act = [
  "신선한 사료·물 충분히, 사조 밀어주기",
  "여러 마리면 '그룹 반추 감소' 가이드(사료 점검) 같이 보기",
]
vet = [
  "2일 이상 회복 없음, 케톤 양성, 핑음 확인, 사료 거의 안 먹음",
]

[[guide]]
id = "group_rum"
title = "그룹 반추 감소"
when = ["GROUP_RUM", "GROUP_RUMINATION"]
check = [
  "최근 배합비·원료·조사료 로트(새 사일리지 개봉 등) 변경 여부",
  "TMR이 고르게 섞였는지·입자 크기(체 분석), 수분, 사조 잔량, 골라 먹기(선별 채식)",
  "급여 시간·횟수 변경, 사료 냄새·곰팡이·열 발생",
  "더위·과밀·합사 등 환경 변화(누운 시간도 같이 줄었는지)",
]
act = [
  "변경된 원료·배합이 있으면 원인 후보부터 되돌리거나 천천히 바꾸기",
  "하루 2회 이상 급여·자주 밀어주기, 골라 먹으면 수분·입자 조정",
]
vet = [
  "반추 감소와 함께 체온 상승·설사가 그룹에 퍼질 때",
]

[[guide]]
id = "ph_low"
title = "pH 저하 (산독증 위험)"
when = ["PH_LOW"]
check = [
  "분변 — 묽음·거품·소화 안 된 곡물 알갱이",
  "농후사료 비율·한 번에 주는 양, 신선우 농후사료 증량 속도",
  "TMR 입자(긴 섬유 부족), 골라 먹기, 사료 섭취 시간 몰림",
]
act = [
  "배합대로 급여되는지 확인, 긴 섬유(조사료) 섭취 확보",
  "농후사료 분할 급여, 증량은 천천히, 골라 먹기 방지(가수·밀어주기)",
  "완충제 사용 여부는 영양 담당과 협의",
]
vet = [
  "사료 거의 안 먹음, 심한 설사·탈수, 파행이 함께 나타날 때",
]

[[guide]]
id = "drinking"
title = "음수 이상"
when = ["DRINKING_ABNORMAL"]
check = [
  "급수조 — 물 나오는 양·수압, 청결(이끼·사료 찌꺼기), 물 온도",
  "물 먹다 움찔하는지(누전 의심), 서열 경쟁으로 접근 못 하는지",
]
act = [
  "급수조 청소, 급수 공간 늘리기(그룹당 급수조 2곳 이상 권장)",
  "누전 의심이면 전기 점검",
]
vet = [
  "눈이 꺼지거나 피부 탄력 저하 등 탈수 증상, 사료도 안 먹을 때",
]

[[guide]]
id = "activity"
title = "활동 감소"
when = ["ACTIVITY_DROP"]
check = [
  "걸음걸이(파행), 발굽·지간 상태, 다리 붓기",
  "통로 바닥 미끄러움·요철, 깔짚 상태",
]
act = [
  "파행우는 이동 거리 줄이고 편한 바닥으로, 발굽 점검 일정 앞당기기",
]
vet = [
  "체중을 싣지 못하는 파행, 붓기·열감 → 수의사·삭제사",
]

[[guide]]
id = "ketosis"
title = "케토시스 의심"
when = ["KETOSIS"]
check = [
  "혈중·소변 케톤 간이검사, 사료 섭취·유량 감소 여부",
  "분만 전 BCS(과비 여부), 건유후기 사료 섭취",
]
act = [
  "사료 섭취 최대한 확보(신선한 사료·물), 신선우 그룹 과밀 줄이기",
  "에너지 보충 방법은 수의사·영양 담당과 협의",
]
vet = [
  "케톤 양성, 사료 거의 안 먹음, 신경 증상(핥기·비틀거림)",
]

[[guide]]
id = "mastitis"
title = "유방염 의심"
when = ["MASTITIS"]
check = [
  "CMT 검사, 유즙 이상(덩어리·묽음·색), 유방 붓기·열감",
  "착유 위생, 라이너 교체 주기, 깔짚 청결",
]
act = [
  "이상 분방 구분 착유, 착유 순서 뒤로, 깔짚 건조·청결 유지",
]
vet = [
  "발열·사료 안 먹음 등 전신 증상(급성) → 즉시",
  "치료는 수의사 처방대로, 휴약기간 지켜 출하유 관리",
]

[[guide]]
id = "milk_fever"
title = "유열 위험"
when = ["MILK_FEVER"]
check = [
  "분만 72시간 이내, 일어서기 힘든지, 귀·다리 차가움, 비틀거림",
]
act = [
  "분만 전후 집중 관찰, 넘어져 다치지 않게 바닥 정리",
  "예방은 건유후기 사료(DCAD 등)를 영양 담당과 점검",
]
vet = [
  "일어서지 못함 → 즉시 연락",
]

[[guide]]
id = "calving"
title = "분만 임박"
when = ["CALVING"]
check = [
  "분만방·깔짚 준비, 관찰 간격 줄이기",
]
act = [
  "조용한 환경 유지, 송아지 초유 급여 준비(분만 후 빠르게)",
]
vet = [
  "양막(물주머니)이 보이고 1~2시간 지나도 진전이 없을 때, 송아지 자세 이상",
]

[[guide]]
id = "heat_stress"
title = "고온 스트레스 · 그룹 체온 상승"
when = ["HEAT_STRESS", "GROUP_TEMP"]
check = [
  "우사 온습도지수(THI) — 착유우는 68 전후부터 스트레스 시작으로 봄",
  "환기팬 작동·풍속, 분무·차광, 급수조 수와 물 온도",
]
act = [
  "송풍+분무 가동, 그늘 확보, 급수 공간 늘리기",
  "급여는 서늘한 시간대로, 사조 사료 자주 밀어주기",
]
vet = [
  "개구 호흡(입 벌리고 숨), 기립 불능, 체온 41℃ 이상",
]

[[guide]]
id = "lying"
title = "누운 시간 감소·부족"
when = ["LYING"]
check = [
  "누울 자리 — 두당 1자리 이상인지(과밀), 깔짚 건조·두께, 우상 크기·칸막이",
  "착유 대기 포함 우사 밖에 있는 시간(하루 3시간 이내 권장), 최근 이동·합사",
  "해충 피해 — 침파리(다리 물어 발 구름·꼬리 치기), 모기·등에. 앞다리 파리 수 세기(다리당 평균 5마리 이상이면 방제 고려, 참고 기준)",
  "더위(THI)로 서 있는 소가 늘었는지",
]
act = [
  "과밀 줄이기(그룹 재편), 깔짚 보충·건조 유지",
  "해충 방제 — 번식지 제거가 우선: 사조 아래 사료 찌꺼기, 젖은 깔짚, 송아지 우리 주변, 퇴비 더미를 주 1회 이상 치우기",
  "끈끈이 트랩·방충망, 환기팬 풍속 올리기(파리 활동 감소)",
  "살충제는 착유우 사용 가능 제품인지·라벨 용법·휴약기간 확인 후 사용",
]
vet = [
  "파행이 원인으로 보일 때, 해충으로 피부 병변·빈혈(진드기)이 보일 때",
]

[[guide]]
id = "sync"
title = "함께 눕기 감소"
when = ["SYNC"]
check = [
  "과밀·최근 합사(서열 다툼), 누울 자리 경쟁",
  "해충 — 침파리가 많으면 소들이 한쪽에 몰려 서 있고(뭉침) 발을 구름",
  "더위·환기 불량 구역, 소음·사람 출입 변화",
]
act = [
  "그룹 재편·과밀 완화, 합사 후 1~2주 관찰",
  "해충 방제(누운 시간 가이드의 방제 항목과 동일), 환기 개선",
]
vet = []

[[guide]]
id = "heat"
title = "발정"
when = ["HEAT"]
check = [
  "smaXtec 수정 적기 시간 확인, 분만 후 일수(자발적 대기기간 지났는지)",
  "발정 간격이 18~24일 범위를 벗어나 반복되면 번식 이상 의심",
]
act = [
  "적기 수정, 수정 기록 입력",
]
vet = [
  "발정 주기 불규칙·반복, 분만 후 60일 넘게 발정 없음 → 번식 검진",
]
