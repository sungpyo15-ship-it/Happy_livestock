# ─────────────────────────────────────────────────────────────
# 화면 선택자 설정  ← 화면 HTML/스크린샷을 받으면 여기를 채움
#  - "TODO" 로 시작하는 값은 아직 미확정. 수집 시 어떤 항목이 비었는지 알려줌
#  - 선택자 문법: Playwright CSS/텍스트 선택자 (예: "input[name=email]", "text=로그인")
#  - URL 의 {farm_id} 는 목장 ID 로 치환됨
# ─────────────────────────────────────────────────────────────

# ※ web 모드(.env SMX_MODE=web)에서만 사용. 기본 api 모드는 이 파일의 [login]~[alert_list] 를 쓰지 않음
[login]
# web.smaxtec.com 첫 화면의 '로그인 하기' 버튼 → sso.smaxtec.com(Keycloak) 로그인 폼 (2026-11 확인)
start_button   = "button:has-text('로그인'), button:has-text('Login'), button:has-text('Log in')"
username_input = "#username"
password_input = "#password"
submit_button  = "#kc-login"
# 로그인 성공 후에만 보이는 요소(메뉴, 로그아웃 버튼 등)
logged_in_indicator = "TODO_logged_in_indicator"
# (선택) 로그인 실패 메시지 요소
error_message = "#input-error, .pf-c-alert__title, .alert-error"

[farm_list]
# 목장 목록 페이지 URL. 비우면 로그인 직후 화면에서 찾음
url = "TODO_farm_list_url"
row = "TODO_farm_row"                       # 목장 한 줄(카드)
name = "TODO_farm_name"                     # row 내부의 목장명 요소. 비우면 row 텍스트 사용
# 목장 ID 추출: row(또는 id_element) 의 속성값에서 정규식으로 추출
id_element = "a"                            # row 내부 요소. 비우면 row 자체
id_attribute = "href"
id_regex = "(\\d+)"                         # 첫 번째 괄호 그룹 = 목장 ID
next_page = ""                              # 페이지 넘김 버튼(없으면 비움)
max_pages = 20

[alert_list]
# 목장별 알림 목록 URL. {farm_id} 치환
url_template = "TODO_alert_list_url/{farm_id}"
row = "TODO_alert_row"
animal_id = "TODO_animal_id"                # row 내부: 개체번호(이표/관리번호)
alert_type = "TODO_alert_type"              # row 내부: 알림 종류
occurred_at = "TODO_occurred_at"            # row 내부: 발생 시각
resolved_at = ""                            # row 내부: 해제 시각(화면에 있으면)
detail = ""                                 # row 내부: 부가설명(수치 등)
# 목록이 비었을 때 표시되는 요소(있으면 '0건'으로 정상 처리)
empty_indicator = ""
next_page = ""
max_pages = 10
# 목록 로딩 완료 대기: row 또는 empty_indicator 가 나타날 때까지(ms)
wait_timeout_ms = 15000

[datetime]
# 발생시각 문자열 형식(위에서부터 시도). Python strptime 문법
formats = [
  "%Y-%m-%d %H:%M",
  "%Y-%m-%d %H:%M:%S",
  "%Y.%m.%d %H:%M",
  "%Y. %m. %d. %H:%M",
  "%d.%m.%Y %H:%M",
  "%d.%m.%Y, %H:%M",
  "%m/%d/%Y %I:%M %p",
  "%m/%d/%Y %H:%M",
  "%m-%d %H:%M",
]
# 상대표기('3시간 전') 사용 시 중복판정 허용오차(분). 절대표기면 0~30 권장
dedup_tolerance_minutes = 30
