# ─────────────────────────────────────────────────────────────
# 이슈 판정 규칙 (현장 경험에 맞춰 조정)
# 집계 기준: 리포트 시각(as_of) 기준 최근 24시간(D0) / 그 이전 24시간(D-1) / 그 이전 7개 24시간 평균
# ─────────────────────────────────────────────────────────────

[report]
# 리포트 표에 나란히 표시할 알림 종류(순서대로)
columns = ["TEMP_HIGH", "RUMINATION_DROP", "DRINKING_ABNORMAL", "TEMP_LOW", "KETOSIS", "MASTITIS", "HEAT", "CALVING"]   # 8개 유지(방문요약 칸 배치)
trend_days = 7
# 7일 추세: 종류별 '두수'(같은 날 같은 개체는 1두). 마지막 행은 건강알림 전체 두수
trend_categories = [
  { label = "체온 상승", types = ["TEMP_HIGH"] },
  { label = "체온 하강", types = ["TEMP_LOW"] },
  { label = "반추 감소", types = ["RUMINATION_DROP"] },
  { label = "음수 이상", types = ["DRINKING_ABNORMAL"] },
  { label = "활동 감소", types = ["ACTIVITY_DROP"] },
  { label = "질병 의심", types = ["KETOSIS", "MASTITIS", "MILK_FEVER"] },
]

[features]
# pH 측정(프리미엄 볼루스) 사용 여부. false = pH 저하 알림을 집계·점수·화면에서 모두 뺌 (다시 쓰면 true 로)
ph = false

[surge]
# 급증 판정(두수 기준 — 같은 개체 반복은 1두): 건강알림 두수(D0) ≥ min_count 이고
#   (D0 ≥ D-1 × ratio_vs_prev_day 이고 D0 − D-1 ≥ min_increase)  또는
#   (D0 ≥ 7일평균 × ratio_vs_7d_avg 이고 D0 − 7일평균 ≥ min_increase)
min_count = 3
min_increase = 2
ratio_vs_prev_day = 2.0
ratio_vs_7d_avg = 2.0

[cluster]
# 단시간 다두수 알림: window_hours 안에 서로 다른 개체 min_animals 두 이상
window_hours = 12
min_animals = 4
# 평소(직전 7일) 같은 길이 창의 평균 알림 건수 × 이 배수 이상일 때만 인정 (큰 목장 오탐 방지)
min_ratio_vs_baseline = 2.0
# 사육두수(config/farms.toml)를 알면 비율 조건도 함께 적용(이상). 모르면 두수 조건만.
min_herd_pct = 4.0
types = ["TEMP_HIGH", "RUMINATION_DROP"]
# pH 저하가 같은 창에서 이 개수 이상이면 '산독증(SARA) 의심' 문구 부여
ph_low_for_sara = 1

[behaviour]
# smaXtec 그룹 행동 KPI (반추·누운 시간·서 있기·이동·함께 눕기). 그룹 평균값, 일 단위
enabled = true
refresh_hours = 6          # 일 지표라 하루 몇 번만 조회
backfill_days = 14         # 처음 조회 시 과거 일수
min_group_size = 3         # 이보다 작은 그룹은 제외(평균값 변동 큼)
# 그룹 반추 감소: (반추 서서+누워) 7일평균 대비 아래 두 조건 모두
rum_drop_min = 30          # 분/일 이상 감소
rum_drop_pct = 7.0         # % 이상 감소
# 누운 시간: 7일평균 대비 급감, 착유우 그룹 최소 기준
lying_drop_min = 60        # 분/일 이상 감소
lying_min_hours_lactating = 9.0    # 착유 그룹 누운 시간 < 9h → 우사 환경(누울 자리 부족·과밀·고온) 점검
# (2026-11-18 담당 71개 목장 착유그룹 67개 실측: 중앙값 10.4h, <10h 34%, <9h 9% → 9h 채택.
#  볼루스 기반 누운 시간 판정이라 다리센서 문헌기준(11~14h)과 직접 비교하지 말고 목장 간 상대비교로 사용)
min_day_minutes = 1380             # 이동+서 있기+누운 시간 합이 이보다 작으면 데이터 불완전 → 판정 제외
lactating_keywords = ["착유", "lact", "milk", "신선", "fresh"]
# 함께 눕는 비율: 7일평균 대비 %p 감소 → 누울 자리 경쟁·과밀·환경 스트레스 의심
lying_sync_drop_pp = 10.0

[transition]
# 전환기(분만 전후) 성적 — 담당 목장 간 상대비교용
enabled = true
pre_days = 21              # 분만 전 관찰 기간
post_days = 21             # 분만 후 관찰 기간(이 기간이 지난 '완료' 분만우만 발생률 계산)
window_days = 90           # 성적 집계 기간(완료 분만우의 분만일 기준)
long_days = 365            # 장기 성적·월별 추이 기간 (수집이력 SMX_API_HISTORY_DAYS 365 이상 필요)
recent_days = 30           # 최근 추이 확인용
min_calvings = 8           # 이보다 분만 적으면 '참고용'(판정·순위 제외)
calving_merge_days = 14    # 분만확인·분만감지가 이 기간 안이면 같은 분만
upcoming_days = 14         # 분만 예정 목록 범위
healthy_gap_pp = 15        # 무사통과율이 담당목장 중앙값보다 이만큼(%p) 낮으면 표시
rate_gap_pp = 10           # 케토시스·유열·유방염·반추감소 발생률이 중앙값보다 이만큼 높으면 표시

[long_active]
# 이 시간 이상 해제되지 않은 건강알림 = 장기 미해제
hours = 48

[priority]
# 방문 우선순위 점수 = Σ(가중치 × 값)
w_health_alert = 1.0        # 건강알림 1두당
w_ph_low = 2.0              # pH 저하 1두당 추가 가중(사료·배합과 직결)
w_surge = 15.0              # 급증 목장
w_cluster = 30.0            # 집단 신호
w_long_active = 3.0         # 장기 미해제 1건당
w_calving = 0.5             # 분만 임박 1두당(방문 필요성 낮게)
w_group_alarm = 15.0        # smaXtec 자체 그룹경보(그룹 체온상승/그룹 반추감소) 있으면
w_ketosis = 2.0             # 케토시스 의심 1두당(전환기 사양과 직결)
w_behaviour_rum = 12.0      # 그룹 반추 감소(그룹당, 최대 2그룹)
w_transition = 8.0          # 전환기 성적 부진(위 판정에 걸리면 1회)
w_behaviour_other = 4.0     # 누운 시간 급감·부족, 함께 눕는 비율 저하(건당, 최대 3건)
# 점수 구간 → 등급
urgent = 40
high = 20
watch = 8

[freshness]
# 마지막 정상 수집이 이 시간보다 오래되면 '데이터 지연' 표시
stale_hours = 6

[economics]
# 원유 단가(원/kg) — 검정성적 유량 손실 → 금액 환산용. 기본가격·인센티브가 목장마다 달라 확인 후 조정 (기본값은 추정치)
milk_price = 1100
