<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>낙농 현장점검 CCCS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#16324a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: 모바일 우선 단일 컬럼 + 하단 탭바. 현장(장갑·햇빛)에서 큰 터치 타깃, 높은 대비 */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --ink:#16232e; --muted:#5d6b75; --line:#d9e0e3;
  --accent:#16324a; --accent-2:#2f6f8f; --accent-ink:#ffffff;
  --good:#2e7d4f; --good-bg:#e3f2e8; --warn:#a86a00; --warn-bg:#fbf0d9; --bad:#b3352b; --bad-bg:#f8e2df; --na:#8a959c;
  --font:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f161b; --surface:#172129; --ink:#e6edf0; --muted:#9aa8b0; --line:#2a3842;
  --accent:#8cc3e0; --accent-2:#6fb0d0; --accent-ink:#0b1a24;
  --good:#6fcf97; --good-bg:#16301f; --warn:#f0b54a; --warn-bg:#352a12; --bad:#ff8a7d; --bad-bg:#3a1c19; --na:#7b878e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f161b; --surface:#172129; --ink:#e6edf0; --muted:#9aa8b0; --line:#2a3842;
  --accent:#8cc3e0; --accent-2:#6fb0d0; --accent-ink:#0b1a24;
  --good:#6fcf97; --good-bg:#16301f; --warn:#f0b54a; --warn-bg:#352a12; --bad:#ff8a7d; --bad-bg:#3a1c19; --na:#7b878e; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font:15px/1.5 var(--font);-webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(84px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--accent)}
.wrap{max-width:760px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--accent);color:var(--accent-ink);
  margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));
  padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
header.top .wrap{display:flex;align-items:center;gap:12px}
header.top h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.01em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top .score{font:600 15px var(--mono);font-variant-numeric:tabular-nums;padding:3px 10px;border-radius:99px;background:rgba(255,255,255,.14)}
:root[data-theme="dark"] header.top .score{background:rgba(0,0,0,.12)}
h2{font-size:19px;margin:22px 0 8px;text-wrap:balance}
h3{font-size:15px;margin:0;font-weight:600}
.muted{color:var(--muted)} .small{font-size:13px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;min-height:44px;width:100%}
textarea{min-height:64px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);min-height:44px;padding:8px 14px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.ghost{background:transparent}
button.danger{color:var(--bad);border-color:var(--bad)}
.banner{border:1px dashed var(--warn);background:var(--warn-bg);color:var(--ink);border-radius:var(--r);padding:10px 12px;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
.banner b{color:var(--warn)}
/* 탭바 */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
nav.tabs button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:12px;color:var(--muted);min-height:52px}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
nav.tabs button[aria-selected="true"]{color:var(--accent);font-weight:700}
/* CCCS 항목 */
.sec{margin-top:14px}
.sec-head{display:flex;align-items:center;gap:10px;padding:10px 0;cursor:pointer;border:0;background:none;width:100%;text-align:left;min-height:auto}
.sec-head .code{font:600 13px var(--mono);color:var(--accent-2);width:22px}
.sec-head h3{flex:1}
.meter{height:6px;border-radius:99px;background:var(--line);overflow:hidden;width:72px}
.meter i{display:block;height:100%;background:var(--good)}
.pct{font:600 13px var(--mono);font-variant-numeric:tabular-nums;width:44px;text-align:right}
.item{border-top:1px solid var(--line);padding:12px 0;display:flex;flex-direction:column;gap:8px}
.item:first-child{border-top:0}
.item .q{font-weight:500}
.item .std{font-size:12.5px;color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg button{min-height:44px;padding:6px 4px;font-size:14px}
.seg button[data-v="2"][aria-pressed="true"]{background:var(--good-bg);border-color:var(--good);color:var(--good);font-weight:700}
.seg button[data-v="1"][aria-pressed="true"]{background:var(--warn-bg);border-color:var(--warn);color:var(--warn);font-weight:700}
.seg button[data-v="0"][aria-pressed="true"]{background:var(--bad-bg);border-color:var(--bad);color:var(--bad);font-weight:700}
.seg button[data-v="-1"][aria-pressed="true"]{background:var(--line);color:var(--ink);font-weight:700}
.memo{font-size:14px;min-height:40px;padding:8px}
/* 카우시그널 */
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips button{white-space:nowrap;border-radius:99px;min-height:40px;padding:6px 14px;font-size:14px}
.chips button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.ind-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.tally{display:grid;gap:6px;margin-top:10px}
.tally button{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 2px;min-height:62px;position:relative}
.tally button .lb{font-size:13px;color:var(--muted)}
.tally button .ct{font:600 20px var(--mono);font-variant-numeric:tabular-nums}
.tally button.isbad{border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.tally button.isbad .lb{color:var(--bad)}
.tally button.flash{background:var(--good-bg)}
.minus-on .tally button{border-style:dashed}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:2px 10px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.na{background:var(--line);color:var(--muted)}
.toolbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 50px);z-index:4;background:var(--bg);padding:8px 0;display:flex;flex-direction:column;gap:8px}
.switch{display:flex;align-items:center;gap:8px;font-size:14px}
.switch input{width:22px;height:22px;min-height:auto}
.num-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--line)}
.kv:first-child{border-top:0}
/* 리포트 */
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.summary .stat{min-width:0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.stat .v{font:600 24px var(--mono);font-variant-numeric:tabular-nums}
.stat .k{font-size:12.5px;color:var(--muted)}
.finding{display:grid;grid-template-columns:6px 1fr;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.finding:first-child{border-top:0}
.finding .bar{border-radius:3px}
.finding.p1 .bar{background:var(--bad)} .finding.p2 .bar{background:var(--warn)} .finding.p3 .bar{background:var(--accent-2)}
.finding .t{font-weight:600}
.finding .a{font-size:13.5px;color:var(--muted)}
table.t{border-collapse:collapse;width:100%;font-size:13.5px}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;white-space:nowrap}
table.t td.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;z-index:20;max-width:90vw}
pre.copy{white-space:pre-wrap;font-size:12.5px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;max-height:260px;overflow:auto}
.confirm{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.src{font-size:11px;font-weight:600;border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:1px;white-space:nowrap}
.src.k{background:color-mix(in srgb,var(--accent-2) 16%,transparent);color:var(--accent-2)}
.src.l{background:var(--line);color:var(--muted)}
.valrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.valrow input{width:130px;flex:0 0 auto}
.valrow input.txt{flex:1 1 200px;width:auto}
.valrow .u{font-size:13px;color:var(--muted)}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts button{min-height:40px;padding:6px 10px;font-size:13.5px}
.opts button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.opts button .p{font-family:var(--mono);opacity:.75;margin-left:4px}
.signs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
@media (max-width:380px){.signs{grid-template-columns:1fr}}
.signs button{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;min-height:52px;padding:6px 10px;font-size:13px;line-height:1.3}
.signs button .ct{font:600 18px var(--mono);min-width:22px;text-align:right}
.signs button.on{border-color:var(--warn);background:var(--warn-bg)}
.calc{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:4px}
.calc .stat .v{font-size:19px}
nav.tabs .wrap{grid-template-columns:repeat(6,1fr)}
nav.tabs button{font-size:11.5px}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <h1 id="hdrTitle">낙농 현장점검</h1>
  <span class="score" id="hdrScore" title="목장점검(CCCS) 종합점수">—</span>
</div></header>

<main class="wrap" id="main"></main>

<nav class="tabs" aria-label="화면 전환"><div class="wrap" role="tablist">
  <button role="tab" data-tab="farm"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9H3z"/><path d="M9 20v-6h6v6"/></svg>농장</button>
  <button role="tab" data-tab="cccs"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8l2 2 4-4M8 15h8"/></svg>목장점검</button>
  <button role="tab" data-tab="sig"><svg viewBox="0 0 24 24"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg>카우시그널</button>
  <button role="tab" data-tab="calf"><svg viewBox="0 0 24 24"><circle cx="12" cy="10" r="5"/><path d="M7 7L4 5M17 7l3-2M9 20h6M12 15v5"/></svg>송아지</button>
  <button role="tab" data-tab="report"><svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>리포트</button>
  <button role="tab" data-tab="hist"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>기록</button>
</div></nav>

<input type="file" id="fileIn" accept="application/json,.json" hidden>

<script>
/* ============================================================
   점검 기준 설정
   src 없음 = 퓨리나 CCCS 교육자료(2025.04) 「퓨리나 목장점검 리포트」·Cow Signal 점검표
   s:"문헌" = 교재에 없어 일반 문헌·현장 권장치로 보완한 항목
   u: 입력 단위("txt"=글 입력), j:[양호최소,양호최대,주의최소,주의최대] 자동판정, w: 배점 가중치(기본 2)
   ============================================================ */
const INF=1e9;
const CCCS = [
 {code:"E",name:"환경·환기",items:[
  {id:"e1",q:"환기팬 설치",u:"txt",std:"팬 간격 = 팬 지름×10, 하향 각도 15°, 승가·축분 제거 장비에 닿지 않는 높이",act:"팬 간격·각도 재조정, 설치 높이 확인"},
  {id:"e2",q:"소 위치 풍속",u:"m/s",j:[3,INF,1.5,3],std:"휴식구역 3 m/s 이상 (환기팬 1.5~3 m/s)",act:"팬 청소·벨트 점검, 팬 추가 또는 각도 조정"},
  {id:"e3",q:"팬 가동 시작 온도",u:"℃",j:[0,25,25,27],std:"22~25℃부터 팬 가동, 습도 50% 이상이면 25℃부터 고온스트레스",act:"온도 센서 연동 자동 가동, 가동 기준 22~25℃로 낮추기"},
  {id:"e4",q:"열스트레스 (THI)",auto:"thi",std:"농장 탭 온·습도로 자동 계산. THI 68 미만 양호, 68~72 주의, 72 이상 불량",act:"송풍·소킹 가동, 대기장 냉방, 음수 공간 확대, 고에너지 밀도·완충제 검토"},
  {id:"e5",q:"암모니아 농도",u:"ppm",j:[0,1,1,10],std:"1 ppm 이하 (교재 리포트 기준)",act:"측창 개방, 배기 용량 점검, 분뇨 제거 주기 단축"},
  {id:"e6",q:"조도",u:"Lux",j:[200,INF,50,200],std:"200 Lux 이상 권장, 최소 50 Lux",act:"조명 추가·교체, 사료조·휴식구역 조도 측정"},
  {id:"e7",q:"점등 관리 (광주기)",std:"착유우 16~18시간 점등/6~8시간 소등 → 유량 약 2~2.5 kg/일 증가 (적용 4주 후, 9~4월 효과적) · 건유우는 6~8시간 점등",act:"타이머 설치, 건유우 단일광 적용"},
  {id:"e8",q:"그늘막",u:"㎡/두",j:[1.5,INF,1.0,1.5],std:"두당 1.5 ㎡, 높이 4.5 m 이상, 남북 방향",act:"그늘막 면적·높이 확보"},
  {id:"e9",q:"냉방 설비",std:"스프링클러, 흙 운동장, 착유우 브러시",act:"소킹 스프링클러·브러시 설치"}]},
 {code:"R",name:"휴식공간·우상",items:[
  {id:"r1",q:"두당 휴식공간",u:"㎡",j:[8,INF,6.5,8],std:"8 ㎡ 이상",act:"사육두수 조정 또는 휴식공간 확장"},
  {id:"r2",q:"깔짚 두께",u:"cm",j:[15,INF,10,15],std:"15 cm 이상",act:"깔짚 보충 주기 단축"},
  {id:"r3",q:"운동장 축분 깊이",u:"cm",j:[0,2.5,2.5,7.5],std:"2.5 cm 이하 (완전 건조 > 2.5 > 7.5 cm)",act:"축분 제거·교반 주기 단축"},
  {id:"r4",q:"스탄천(헤드록) 개수",u:"개",info:"stanchion",std:"교재 기준 130%. 스탄천 상태·개수 파악이 매우 중요",act:"헤드록 증설 또는 두수 조정"},
  {id:"r5",q:"깔짚 건조 (무릎 테스트)",s:"문헌",std:"10초 무릎 꿇었을 때 젖지 않음",act:"습한 뒷부분 매일 제거, 깔짚 교체"},
  {id:"r6",q:"우상 수 대비 사육밀도",u:"%",j:[0,100,100,120],s:"문헌",std:"착유우 100% 이하, 분만전후군 80~85%",act:"분만전후군부터 밀도 해소"},
  {id:"r7",q:"프리스톨 길이",u:"m",j:[2.4,3.05,2.2,2.4],s:"문헌",std:"홀스타인 앞 개방형 2.4~2.7 m, 앞이 막힌 경우 2.9~3.05 m",act:"앞쪽 막힘 제거 또는 우상 길이 연장"},
  {id:"r8",q:"프리스톨 폭",u:"m",j:[1.15,1.3,1.1,1.35],s:"문헌",std:"1.15~1.27 m (성우)",act:"칸막이 간격 조정"},

}

function cccsScore(sec){
  const items=sec?sec.items:ALL_ITEMS;
  let got=0,max=0,done=0,n=0,bad=0,warn=0;
  items.forEach(it=>{n++;const v=status(it);if(v==null)return;done++;if(v<0)return;const w=it.w||2;got+=w*v/2;max+=w;if(v===0)bad++;if(v===1)warn++});

function sigStat(g,ind){
  const c=(S.signals[g]||{})[ind.id]; if(!c)return null;
  const n=c.reduce((a,b)=>a+b,0); if(!n)return null;
  let b=0,sum=0; c.forEach((k,i)=>{sum+=k*ind.opts[i].v; if(ind.bad&&ind.bad(ind.opts[i].v,g))b+=k});
  const mean=sum/n, pct=Math.round(b/n*100);
  if(ind.mode==="mean"){const t=ind.tgtBy[g], d=Math.abs(mean-t); return {n,mean,pct:null,tgt:t,status:d<=0.25?"good":d<=0.5?"warn":"bad"}}
  return {n,bad:b,pct,mean,status:pct<=ind.limit?"good":pct<=ind.limit*1.5?"warn":"bad"};
}

  const inStall=L+St+P;
  return {lieP:inStall?Math.round(L/inStall*100):null, standP:inStall?Math.round((St+P)/inStall*100):null,
    perch:inStall?Math.round(P/inStall*100):null, rumi:L?Math.round(R/L*100):null, total:L+St+P+A+F+D};
}
function herd(){

  const r={total:["milking","sick","dry","heifer"].reduce((a,k)=>a+(num(f[k])||0),0)};

      out.push({p:st.status==="bad"?1:2,src:`카우시그널 · ${g.name}`,t,a:ind.act})});
    const c=comfortStat(g.id);
    if(c&&c.lieP!=null&&c.lieP<90) out.push({p:c.lieP<80?1:2,src:`카우시그널 · ${g.name}`,t:`우상에 누운 소 ${c.lieP}% — 목표 90% 이상`,a:"우상 편안함 부족: 깔짚·우상 규격·사육밀도 점검 (R 섹션)"});
    if(c&&c.rumi!=null&&c.rumi<80) out.push({p:c.rumi<60?1:2,src:`카우시그널 · ${g.name}`,t:`누운 소 중 반추 ${c.rumi}% — 목표 80% 이상`,a:"물리적 섬유 부족·선별채식·휴식 방해 가능성: TMR 입자도 확인"});
    const x=S.sx[g.id]||{};
    if(num(x.resp)!=null&&num(x.resp)>30) out.push({p:num(x.resp)>60?1:2,src:`카우시그널 · ${g.name}`,t:`호흡수 ${x.resp}회/분 — 기준 18~30회`,a:"열스트레스 또는 호흡기 질환: 냉방·환기 점검, 개체 체온 확인"});
    if(num(x.chew)!=null&&num(x.chew)<55) out.push({p:2,src:`카우시그널 · ${g.name}`,t:`반추 저작 ${x.chew}회/덩이 — 기준 60회 이상`,a:"섬유 부족 또는 입자도 과소: 조사료 길이·R-NDF 점검"});
    if(num(x.urin)!=null&&num(x.urin)<5) out.push({p:2,src:`카우시그널 · ${g.name}`,t:`평균 배뇨 시간 ${x.urin}초 — 기준 5초 이상`,a:"음수량 부족 가능성: 급수조 수·유량·청결 점검"});
    if(x.ids) out.push({p:1,src:`카우시그널 · ${g.name}`,t:`개체 조치: ${x.ids}`,a:"외상·분비물 개체 개별 확인 및 수의사 진료"});
    const n=groupN(g.id);
    SIGNS.forEach(([id,name,cause])=>{const k=(S.signs[g.id]||{})[id]; if(!k)return; const pc=n?Math.round(k/n*100):null;
      out.push({p:pc!=null&&pc>=15?1:2,src:`체크포인트 · ${g.name}`,t:`${name} ${k}두${pc!=null?` (${pc}%)`:""}`,a:`원인 추정: ${cause}`})});
  });
  const t=thi(), tl=thiLevel(t); if(tl&&tl[0]!=="good"&&status(ITEM.e4)==null) out.push({p:t>=72?1:2,src:"환경",t:`THI ${t} — ${tl[1]}`,a:"송풍·소킹 가동, 대기장 냉방"});
  milkFlags().forEach(m=>out.push({...m,src:"검정·생산성"}));
  const h=herd(), dry=num(S.farm.dry), hf=num(S.farm.heifer);
  if(h.dryNeed!=null&&dry!=null&&Math.abs(dry-h.dryNeed)>Math.max(2,h.dryNeed*0.25)) out.push({p:2,src:"사육현황",t:`건유우 ${dry}두 — 분만간격 기준 적정 ${h.dryNeed}두`,a:"건유 시기·분만간격 점검"});
  if(h.heiferNeed!=null&&hf!=null&&hf<h.heiferNeed*0.9) out.push({p:2,src:"사육현황",t:`육성우 ${hf}두 — 요구 ${h.heiferNeed}두`,a:"갱신 계획 대비 육성우 부족: 후보우 확보·초산월령 단축"});
  return out.sort((a,b)=>a.p-b.p);
}
function calfPts(it){
  const v=S.calf[it.id];
  if(it.base!=null){ if(v==null)return null; if(v.zero)return 0; return Math.max(0,it.base-it.ded.reduce((a,d,i)=>a+(v.d&&v.d[i]?d[1]:0),0)) }
  if(v==null)return null; return it.opts[v][1];
}
const calfMax=it=>it.base!=null?it.base:Math.max(...it.opts.map(x=>x[1]));
function calfScore(sec){
  const items=sec?sec.items:CALF_ITEMS; let got=0,max=0,done=0;
  items.forEach(it=>{const p=calfPts(it);max+=calfMax(it);if(p!=null){got+=p;done++}});
  return {got,max,done,n:items.length};
}

  let h=`${exampleBanner()}<h2>한우송아지 체크리스트</h2>

  <div class="card" style="margin-top:10px"><div class="mono" style="font-size:26px;font-weight:600">${t.got}<span style="font-size:15px"> / 200점</span> <span class="pill ${t.done?(t.got/2>=85?"good":t.got/2>=70?"warn":"bad"):"na"}">${t.done?Math.round(t.got/2)+"%":"미입력"}</span></div>
  <div class="small muted">입력 ${t.done}/${t.n} · 입력한 항목 만점 대비 ${(()=>{let m=0;CALF_ITEMS.forEach(it=>{if(calfPts(it)!=null)m+=calfMax(it)});return m?Math.round(t.got/m*100)+"%":"—"})()}</div></div>`;
  CALF.forEach((sec,si)=>{
    const s=calfScore(sec);
    h+=`<div class="card sec"><div class="row" style="justify-content:space-between"><h3>${sec.name}</h3><span class="mono small">${s.got} / ${s.max}</span></div><div>`;
    sec.items.forEach(it=>{
      const v=S.calf[it.id];
      if(it.base!=null){
        const d=(v&&v.d)||[], z=v&&v.zero;
        h+=`<div class="item"><div class="q">${esc(it.q)} <span class="mono small muted">${calfPts(it)??"—"}/${it.base}</span></div><div class="opts">
          <button data-calfok="${it.id}" aria-pressed="${!!v&&!z&&!d.some(Boolean)}">감점 없음</button>
          ${it.zero?`<button data-calfzero="${it.id}" aria-pressed="${!!z}">${it.zero} <span class="p">0</span></button>`:""}
          ${it.ded.map((x,i)=>`<button data-calfded="${it.id}" data-i="${i}" aria-pressed="${!!d[i]&&!z}">${x[0]} <span class="p">−${x[1]}</span></button>`).join("")}</div></div>`;
      } else {
        h+=`<div class="item"><div class="q">${esc(it.q)}</div><div class="opts">${it.opts.map((x,i)=>`<button data-calf="${it.id}" data-i="${i}" aria-pressed="${v===i}">${x[0]} <span class="p">${x[1]}</span></button>`).join("")}</div></div>`;
      }
    });
    h+=`</div></div>`;
  });
  return h+`<div class="row" style="margin-top:14px"><button class="primary" data-go="report">리포트 보기</button></div>`;
}

function vReport(){
  const sc=cccsScore(), F=findings(), t=thi(), cs=calfScore();
  const p1=F.filter(x=>x.p===1).length;
  return `${exampleBanner()}<h2>점검 리포트</h2>
  <div class="small muted">${esc(S.farm.name||"목장명 미입력")} · ${esc(S.farm.date)}${S.farm.inspector?` · 점검자 ${esc(S.farm.inspector)}`:""}</div>
  <div class="summary" style="margin-top:10px">
    <div class="stat"><div class="v">${sc.pct??"—"}</div><div class="k">목장점검 · 등급 ${grade(sc.pct)}</div></div>
    <div class="stat"><div class="v" style="color:var(--bad)">${p1}</div><div class="k">우선 개선 항목</div></div>
    <div class="stat"><div class="v">${cs.done?cs.got:t??"—"}</div><div class="k">${cs.done?"송아지 /200":"THI"}</div></div>
  </div>
  <h2>섹션별 점수</h2><div class="card">${CCCS.map(sec=>{const s=cccsScore(sec);return `<div class="kv"><span><span class="mono muted">${sec.code}</span> ${sec.name}</span><span class="row"><span class="meter"><i style="width:${s.pct??0}%;background:${barCol(s.pct)}"></i></span><span class="pct">${s.pct??"—"}</span></span></div>`}).join("")}</div>
  <h2>개선 우선순위</h2>
  <div class="card">${F.length?F.map(x=>`<div class="finding p${x.p}"><span class="bar"></span><div style="min-width:0"><div class="small muted">${x.p===1?"우선":"개선"} · ${esc(x.src)}</div><div class="t">${esc(x.t)}</div><div class="a">→ ${esc(x.a)}</div></div></div>`).join(""):'<span class="muted">입력된 문제 항목이 없습니다.</span>'}</div>
  <h2>카우시그널 요약</h2>${sigTable()}
  ${cs.done?`<h2>송아지 체크리스트</h2><div class="card">${CALF.map(sec=>{const s=calfScore(sec);return `<div class="kv"><span>${sec.name}</span><span class="mono">${s.done?s.got:"—"} / ${s.max}</span></div>`}).join("")}</div>`:""}
  <h2>내보내기</h2>
  <div class="card stack">
    <div class="row"><button class="primary" data-act="saveVisit">점검 기록 저장</button><button data-act="copyText">카톡용 요약 복사</button><button data-act="csv">CSV 저장</button></div>
    <div class="small muted">CSV는 엑셀에서 바로 열 수 있습니다. 파일 저장이 막힌 화면에서는 내용이 클립보드로 복사됩니다.</div>
    <pre class="copy" id="sumText">${esc(summaryText())}</pre>
  </div>`;
}
function sigTable(){
  const rows=[], pl=s=>`<span class="pill ${s}">${s==="good"?"양호":s==="warn"?"주의":"불량"}</span>`;
  GROUPS.forEach(g=>{indFor(g.id).forEach(ind=>{const st=sigStat(g.id,ind); if(st) rows.push(`<tr><td>${g.name}</td><td>${ind.name}</td><td class="n">${st.n}</td><td class="n">${st.mean.toFixed(2)}</td><td class="n">${st.pct==null?"목표 "+st.tgt:st.pct+"%"}</td><td>${pl(st.status)}</td></tr>`)});
    const c=comfortStat(g.id); if(c&&c.total){ if(c.lieP!=null)rows.push(`<tr><td>${g.name}</td><td>우상 누운 소</td><td class="n">${c.total}</td><td class="n">—</td><td class="n">${c.lieP}%</td><td>${pl(c.lieP>=90?"good":c.lieP>=80?"warn":"bad")}</td></tr>`);
      if(c.rumi!=null)rows.push(`<tr><td>${g.name}</td><td>반추 비율</td><td class="n">${S.comfort[g.id].lying}</td><td class="n">—</td><td class="n">${c.rumi}%</td><td>${pl(c.rumi>=80?"good":c.rumi>=60?"warn":"bad")}</td></tr>`);}});
  if(!rows.length)return '<div class="card muted">카우시그널 입력이 없습니다.</div>';
  return `<div class="card scroll"><table class="t"><thead><tr><th>우군</th><th>지표</th><th>두수</th><th>평균</th><th>문제 비율</th><th>판정</th></tr></thead><tbody>${rows.join("")}</tbody></table></div>`;
}
function summaryText(){
  const sc=cccsScore(), F=findings(), t=thi(), h=herd(), cs=calfScore(), f=S.farm;
  let s=`[목장점검] ${f.name||""} ${f.date}\n`;
  if(f.milking)s+=`착유 ${f.milking}두`+(h.perHead?` / 두당 ${h.perHead}L`:"")+(f.scc?` / 체세포 ${f.scc}만`:"")+"\n";
  s+=`목장점검 ${sc.pct??"-"}점 (등급 ${grade(sc.pct)}) · 불량 ${sc.bad} · 주의 ${sc.warn}\n`;
  if(cs.done)s+=`송아지 체크리스트 ${cs.got}/200점\n`;
  if(t!=null)s+=`THI ${t} (${thiLevel(t)[1]})\n`;
  const p1=F.filter(x=>x.p===1); s+=`\n■ 우선 개선\n`+(p1.length?p1.map((x,i)=>`${i+1}. ${x.t}\n   → ${x.a.split(" (기준:")[0]}`).join("\n"):"없음");
  const p2=F.filter(x=>x.p===2); if(p2.length) s+=`\n\n■ 개선 권장\n`+p2.map((x,i)=>`${i+1}. ${x.t}`).join("\n");
  return s;
}
function csv(){
  const L=[["구분","섹션/우군","항목/지표","값","판정","메모·기준"]], f=S.farm, h=herd();
  L.push(["농장",f.name,f.date,"","",f.notes]);
  [["착유두수",f.milking],["환축우",f.sick],["건유우",f.dry],["육성우",f.heifer],["평균산차",f.parity],["분만간격",f.ci],["초산분만월령",f.afc],["납유량",f.ship],["체세포(만)",f.scc],["유지방",f.fat],["유단백",f.prot],["MUN",f.mun],["적정 건유우",h.dryNeed],["갱신두수",h.replace],["육성우 요구",h.heiferNeed],["THI",thi()]]
    .forEach(([k,v])=>L.push(["사육·생산","",k,v??"","",""]));
  ALL_ITEMS.forEach(it=>{const v=status(it);L.push(["목장점검",it.sec.code+" "+it.sec.name,it.q,S.val[it.id]||"",v==null?"":STL[v],(S.memo[it.id]?S.memo[it.id]+" / ":"")+it.std])});
  GROUPS.forEach(g=>{indFor(g.id).forEach(ind=>{const c=(S.signals[g.id]||{})[ind.id];const st=sigStat(g.id,ind);if(!st)return;
    L.push(["카우시그널",g.name,ind.name,ind.mode==="mean"?st.mean.toFixed(2):st.pct+"%",st.status,ind.opts.map((op,i)=>`${op.l}:${c[i]}`).join(" ")])});
    const x=S.sx[g.id]||{}; if(x.resp||x.urin||x.chew||x.ids)L.push(["외관",g.name,"호흡/배뇨/저작/개체",`${x.resp||""} / ${x.urin||""} / ${x.chew||""}`,"",x.ids||""]);
    SIGNS.forEach(([id,name,cause])=>{const k=(S.signs[g.id]||{})[id];if(k)L.push(["체크포인트",g.name,name,k,"",cause])});
    const c=comfortStat(g.id);if(c&&c.total)L.push(["두수카운팅",g.name,"누운소/서있는소/반추",`${c.lieP}% / ${c.standP}% / ${c.rumi}%`,"",""]);});
  CALF.forEach(sec=>sec.items.forEach(it=>{const p=calfPts(it);if(p!=null)L.push(["송아지",sec.name,it.q,p,"/"+calfMax(it),""])}));
  return "﻿"+L.map(r=>r.map(x=>`"${String(x??"").replace(/"/g,'""')}"`).join(",")).join("\r\n");
}

function vHist(){
  const V=store.get(KEY_VISITS,[]);
  let h=`<h2>점검 기록</h2><div class="small muted">기록은 이 기기의 브라우저에 저장됩니다. 기기를 바꾸거나 브라우저 데이터를 지우기 전에 백업 파일을 받아 두세요.</div>
  <div class="row" style="margin-top:10px"><button class="primary" data-act="new">새 점검 시작</button><button data-act="backup">백업 파일 저장</button><button data-act="restore">백업 불러오기</button></div>
  <div class="stack" style="margin-top:12px">`;
  if(!V.length)h+=`<div class="card muted">저장된 점검이 없습니다. 리포트 화면에서 <b>점검 기록 저장</b>을 누르면 여기에 쌓입니다.</div>`;
  V.slice().sort((a,b)=>(b.farm.date||"").localeCompare(a.farm.date||"")).forEach(v=>{
    const keep=S; S=migrate(v); const sc=cccsScore(), F=findings(); S=keep;
    h+=`<div class="card"><div class="row" style="justify-content:space-between"><div style="min-width:0"><h3>${esc(v.farm.name||"목장명 없음")}</h3><div class="small muted">${esc(v.farm.date)} · 목장점검 ${sc.pct??"—"}점 ${grade(sc.pct)} · 우선개선 ${F.filter(x=>x.p===1).length}건</div></div>
      <div class="row" id="hv_${v.id}"><button data-load="${v.id}">열기</button><button class="ghost danger" data-del="${v.id}">삭제</button></div></div></div>`;
  });
  return h+`</div>`;
}

function render(){
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===tab));
  const views={farm:vFarm,cccs:vCCCS,sig:vSig,calf:vCalf,report:vReport,hist:vHist};
  $("#main").innerHTML=(views[tab]||vFarm)();
  if(tab==="farm")$("#herdOut").innerHTML=herdHtml();
  updateHeader();
}
function rerenderKeep(sel){const el=document.querySelector(sel);const y=el?el.getBoundingClientRect().top:0;render();const n=document.querySelector(sel);if(n&&el)window.scrollBy(0,n.getBoundingClientRect().top-y);return n}
function go(t){tab=t;try{history.replaceState(null,"","#"+t)}catch(e){}render();window.scrollTo(0,0)}
function toast(m){const d=document.createElement("div");d.className="toast";d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
async function copy(text){try{await navigator.clipboard.writeText(text);toast("복사했습니다");return true}catch(e){const p=$("#sumText");if(p){const r=document.createRange();r.selectNodeContents(p);const s=getSelection();s.removeAllRanges();s.addRange(r)}toast("복사가 막혀 있어 텍스트를 선택해 두었습니다");return false}}
function download(name,text,type){
  let framed=true;try{framed=window.top!==window.self}catch(_){}
  if(framed){copy(text);return}
  try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);toast("파일을 저장했습니다");}
  catch(e){copy(text)}
}
const fname=ext=>`점검_${(S.farm.name||"목장").replace(/[\\/:*?"<>|\s]+/g,"_")}_${S.farm.date}.${ext}`;
const vib=()=>{try{navigator.vibrate&&navigator.vibrate(15)}catch(_){}};

/* ---------- 이벤트 ---------- */
document.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b)return;
  const d=b.dataset;
  if(d.tab)return go(d.tab);
  if(d.go)return go(d.go);
  if(d.sec){openSec[d.sec]=!openSec[d.sec];return render()}
  if(d.item){const v=+d.v, it=ITEM[d.item];
    const cur=status(it); S.chk[d.item]=(cur===v&&S.chk[d.item]!=null)?null:v; save();
    rerenderKeep(`[data-item="${d.item}"][data-v="${d.v}"]`);return}
  if(d.grp){grp=d.grp;return render()}
  if(d.tally){
    const ind=SIGNALS.find(x=>x.id===d.tally),i=+d.i;
    S.signals[grp]=S.signals[grp]||{}; const c=S.signals[grp][ind.id]=S.signals[grp][ind.id]||ind.opts.map(()=>0);
    c[i]=Math.max(0,c[i]+(minus?-1:1)); save(); vib();
    const nb=rerenderKeep(`[data-tally="${ind.id}"][data-i="${i}"]`); if(nb){nb.classList.add("flash");setTimeout(()=>nb.classList.remove("flash"),180)}
    return;
  }
  if(d.sign){S.signs[grp]=S.signs[grp]||{};S.signs[grp][d.sign]=Math.max(0,(S.signs[grp][d.sign]||0)+(minus?-1:1));save();vib();rerenderKeep(`[data-sign="${d.sign}"]`);return}
  if(d.calf){const i=+d.i;S.calf[d.calf]=S.calf[d.calf]===i?null:i;save();rerenderKeep(`[data-calf="${d.calf}"][data-i="${i}"]`);return}
  if(d.calfok){S.calf[d.calfok]={d:[]};save();rerenderKeep(`[data-calfok="${d.calfok}"]`);return}
  if(d.calfzero){const v=S.calf[d.calfzero];S.calf[d.calfzero]=v&&v.zero?null:{zero:true,d:[]};save();rerenderKeep(`[data-calfzero="${d.calfzero}"]`);return}
  if(d.calfded){const id=d.calfded,i=+d.i;const v=S.calf[id]&&!S.calf[id].zero?S.calf[id]:{d:[]};v.d=v.d||[];v.d[i]=!v.d[i];S.calf[id]=v;save();rerenderKeep(`[data-calfded="${id}"][data-i="${i}"]`);return}
  if(d.load){const v=store.get(KEY_VISITS,[]).find(x=>x.id===d.load);if(v){S=migrate(JSON.parse(JSON.stringify(v)));save();toast("점검을 불러왔습니다");go("report")}return}
  if(d.del){$("#hv_"+d.del).innerHTML=`<span class="confirm"><span class="small">삭제할까요?</span><button class="danger" data-delok="${d.del}">삭제</button><button data-act="cancelDel">취소</button></span>`;return}
  if(d.delok){store.set(KEY_VISITS,store.get(KEY_VISITS,[]).filter(x=>x.id!==d.delok));toast("삭제했습니다");return render()}
  const a=d.act;
  if(a==="cancelDel")return render();
  if(a==="expandAll"){const any=Object.values(openSec).some(Boolean);CCCS.forEach(s=>openSec[s.code]=!any);return render()}
  if(a==="new"){
    const dirty=!S.example&&(Object.keys(S.chk).length||Object.keys(S.val).length||Object.keys(S.signals).length||Object.keys(S.calf).length);
    if(dirty&&!d.sure){d.sure="1";b.textContent="현재 내용 지우고 시작";toast("저장하지 않은 내용은 사라집니다. 한 번 더 누르세요");return}
    S=blank();save();openSec={E:true};toast("새 점검을 시작합니다");return go("farm");
  }
  if(a==="saveVisit"){const V=store.get(KEY_VISITS,[]);const i=V.findIndex(x=>x.id===S.id);const c=JSON.parse(JSON.stringify(S));if(i>=0)V[i]=c;else V.push(c);toast(store.set(KEY_VISITS,V)?"점검 기록을 저장했습니다":"이 브라우저에서는 저장할 수 없습니다. 백업 파일을 사용하세요");return}
  if(a==="copyText")return copy(summaryText());
  if(a==="csv")return download(fname("csv"),csv(),"text/csv;charset=utf-8");
  if(a==="backup")return download(`점검기록_백업_${today()}.json`,JSON.stringify({visits:store.get(KEY_VISITS,[]),draft:S},null,1),"application/json");
  if(a==="restore")return $("#fileIn").click();
});
document.addEventListener("input",e=>{
  const t=e.target, d=t.dataset;
  if(d.farm){S.farm[d.farm]=t.value;save();
    if(["temp","rh"].includes(d.farm)){const th=thi();$("#thiOut").innerHTML=thiHtml(th,thiLevel(th))}
    else if(d.farm!=="notes"&&$("#herdOut"))$("#herdOut").innerHTML=herdHtml();}
  if(d.val){S.val[d.val]=t.value;save();const it=ITEM[d.val];const a=$("#a_"+d.val);if(a)a.innerHTML=autoHtml(it);
    if(S.chk[d.val]==null){const av=autoStatus(it);t.closest(".item").querySelectorAll(".seg button").forEach(x=>x.setAttribute("aria-pressed",+x.dataset.v===av))}}
  if(d.memo){S.memo[d.memo]=t.value;save()}
  if(d.sx){S.sx[grp]=S.sx[grp]||{};S.sx[grp][d.sx]=t.value;save()}
  if(d.comfort){S.comfort[grp]=S.comfort[grp]||{};S.comfort[grp][d.comfort]=t.value.replace(/[^0-9]/g,"");save();$("#comfortOut").innerHTML=comfortHtml(comfortStat(grp))}
});
document.addEventListener("change",e=>{
  if(e.target.id==="minus"){minus=e.target.checked;render()}
  if(e.target.id==="fileIn"){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const dd=JSON.parse(r.result);const V=store.get(KEY_VISITS,[]);(dd.visits||[]).forEach(v=>{if(!V.some(x=>x.id===v.id))V.push(v)});store.set(KEY_VISITS,V);toast(`${(dd.visits||[]).length}건을 불러왔습니다`);render()}catch(err){toast("백업 파일 형식이 아닙니다")}};r.readAsText(f);e.target.value=""}
});
window.addEventListener("hashchange",()=>{const t=location.hash.slice(1);if(t&&t!==tab){tab=t;render()}});

if(S.example) openSec={E:true,R:true};
render();

try{ if("serviceWorker" in navigator && location.protocol==="https:" && !/claude(usercontent)?\.(ai|com)$/.test(location.hostname)) navigator.serviceWorker.register("sw.js").catch(()=>{}) }catch(e){}
</script>
