<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>낙농 현장점검 CCCS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#16324a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: 모바일 우선 단일 컬럼 + 하단 탭바. 현장(장갑·햇빛)에서 큰 터치 타깃, 높은 대비 */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --ink:#16232e; --muted:#5d6b75; --line:#d9e0e3;
  --accent:#16324a; --accent-2:#2f6f8f; --accent-ink:#ffffff;
  --good:#2e7d4f; --good-bg:#e3f2e8; --warn:#a86a00; --warn-bg:#fbf0d9; --bad:#b3352b; --bad-bg:#f8e2df; --na:#8a959c;
  --font:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f161b; --surface:#172129; --ink:#e6edf0; --muted:#9aa8b0; --line:#2a3842;
  --accent:#8cc3e0; --accent-2:#6fb0d0; --accent-ink:#0b1a24;
  --good:#6fcf97; --good-bg:#16301f; --warn:#f0b54a; --warn-bg:#352a12; --bad:#ff8a7d; --bad-bg:#3a1c19; --na:#7b878e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f161b; --surface:#172129; --ink:#e6edf0; --muted:#9aa8b0; --line:#2a3842;
  --accent:#8cc3e0; --accent-2:#6fb0d0; --accent-ink:#0b1a24;
  --good:#6fcf97; --good-bg:#16301f; --warn:#f0b54a; --warn-bg:#352a12; --bad:#ff8a7d; --bad-bg:#3a1c19; --na:#7b878e; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font:15px/1.5 var(--font);-webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(84px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--accent)}
.wrap{max-width:760px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--accent);color:var(--accent-ink);
  margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));
  padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
header.top .wrap{display:flex;align-items:center;gap:12px}
header.top h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.01em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top .score{font:600 15px var(--mono);font-variant-numeric:tabular-nums;padding:3px 10px;border-radius:99px;background:rgba(255,255,255,.14)}
:root[data-theme="dark"] header.top .score{background:rgba(0,0,0,.12)}
h2{font-size:19px;margin:22px 0 8px;text-wrap:balance}
h3{font-size:15px;margin:0;font-weight:600}
.muted{color:var(--muted)} .small{font-size:13px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;min-height:44px;width:100%}
textarea{min-height:64px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);min-height:44px;padding:8px 14px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.ghost{background:transparent}
button.danger{color:var(--bad);border-color:var(--bad)}
.banner{border:1px dashed var(--warn);background:var(--warn-bg);color:var(--ink);border-radius:var(--r);padding:10px 12px;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
.banner b{color:var(--warn)}
/* 탭바 */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
nav.tabs button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:12px;color:var(--muted);min-height:52px}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
nav.tabs button[aria-selected="true"]{color:var(--accent);font-weight:700}
/* CCCS 항목 */
.sec{margin-top:14px}
.sec-head{display:flex;align-items:center;gap:10px;padding:10px 0;cursor:pointer;border:0;background:none;width:100%;text-align:left;min-height:auto}
.sec-head .code{font:600 13px var(--mono);color:var(--accent-2);width:22px}
.sec-head h3{flex:1}
.meter{height:6px;border-radius:99px;background:var(--line);overflow:hidden;width:72px}
.meter i{display:block;height:100%;background:var(--good)}
.pct{font:600 13px var(--mono);font-variant-numeric:tabular-nums;width:44px;text-align:right}
.item{border-top:1px solid var(--line);padding:12px 0;display:flex;flex-direction:column;gap:8px}
.item:first-child{border-top:0}
.item .q{font-weight:500}
.item .std{font-size:12.5px;color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg button{min-height:44px;padding:6px 4px;font-size:14px}
.seg button[data-v="2"][aria-pressed="true"]{background:var(--good-bg);border-color:var(--good);color:var(--good);font-weight:700}
.seg button[data-v="1"][aria-pressed="true"]{background:var(--warn-bg);border-color:var(--warn);color:var(--warn);font-weight:700}
.seg button[data-v="0"][aria-pressed="true"]{background:var(--bad-bg);border-color:var(--bad);color:var(--bad);font-weight:700}
.seg button[data-v="-1"][aria-pressed="true"]{background:var(--line);color:var(--ink);font-weight:700}
.memo{font-size:14px;min-height:40px;padding:8px}
/* 카우시그널 */
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips button{white-space:nowrap;border-radius:99px;min-height:40px;padding:6px 14px;font-size:14px}
.chips button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.ind-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.tally{display:grid;gap:6px;margin-top:10px}
.tally button{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 2px;min-height:62px;position:relative}
.tally button .lb{font-size:13px;color:var(--muted)}
.tally button .ct{font:600 20px var(--mono);font-variant-numeric:tabular-nums}
.tally button.isbad{border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.tally button.isbad .lb{color:var(--bad)}
.tally button.flash{background:var(--good-bg)}
.minus-on .tally button{border-style:dashed}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:2px 10px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.na{background:var(--line);color:var(--muted)}
.toolbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 50px);z-index:4;background:var(--bg);padding:8px 0;display:flex;flex-direction:column;gap:8px}
.switch{display:flex;align-items:center;gap:8px;font-size:14px}
.switch input{width:22px;height:22px;min-height:auto}
.num-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--line)}
.kv:first-child{border-top:0}
/* 리포트 */
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.summary .stat{min-width:0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.stat .v{font:600 24px var(--mono);font-variant-numeric:tabular-nums}
.stat .k{font-size:12.5px;color:var(--muted)}
.finding{display:grid;grid-template-columns:6px 1fr;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.finding:first-child{border-top:0}
.finding .bar{border-radius:3px}
.finding.p1 .bar{background:var(--bad)} .finding.p2 .bar{background:var(--warn)} .finding.p3 .bar{background:var(--accent-2)}
.finding .t{font-weight:600}
.finding .a{font-size:13.5px;color:var(--muted)}
table.t{border-collapse:collapse;width:100%;font-size:13.5px}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;white-space:nowrap}
table.t td.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;z-index:20;max-width:90vw}
pre.copy{white-space:pre-wrap;font-size:12.5px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;max-height:260px;overflow:auto}
.confirm{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <h1 id="hdrTitle">낙농 현장점검</h1>
  <span class="score" id="hdrScore" title="CCCS 종합점수">—</span>
</div></header>

<main class="wrap" id="main"></main>

<nav class="tabs" aria-label="화면 전환"><div class="wrap" role="tablist">
  <button role="tab" data-tab="farm"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9H3z"/><path d="M9 20v-6h6v6"/></svg>농장</button>
  <button role="tab" data-tab="cccs"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8l2 2 4-4M8 15h8"/></svg>CCCS</button>
  <button role="tab" data-tab="sig"><svg viewBox="0 0 24 24"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg>카우시그널</button>
  <button role="tab" data-tab="report"><svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>리포트</button>
  <button role="tab" data-tab="hist"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>기록</button>
</div></nav>

<input type="file" id="fileIn" accept="application/json,.json" hidden>

<script>
/* ============================================================
   점검 기준 설정 (현장 양식에 맞게 이 부분만 수정하면 됩니다)
   - CCCS: 섹션/항목/기준/개선조치
   - SIGNALS: 카우시그널 지표, 우군별 '문제' 판정 기준과 허용 비율(limit, %)
   ============================================================ */
const CCCS = [
 {code:"A",name:"사료·사료조",items:[
  {id:"a1",q:"사료조 폭 충분",std:"두당 60cm 이상, 분만전후군 75cm 이상 / 헤드록 1두 1칸",act:"사육밀도 조정 또는 사료조 확장, 분만전후군 과밀 우선 해소"},
  {id:"a2",q:"사료 상시 접근 (빈 사료조 없음)",std:"하루 종일 사료조가 비지 않음, 밀어주기 하루 5회 이상",act:"밀어주기 횟수·시간표 고정, 급여량 상향(잔량 3~5% 기준)"},
  {id:"a3",q:"잔량 3~5% 유지",std:"착유우 기준 잔량 3~5%, 매일 계량 기록",act:"잔량 계량 후 급여량 조정, 기록표 비치"},
  {id:"a4",q:"TMR 균일·선별채식 없음",std:"PSPS 19mm 2~8%, 8mm 30~50%, 4mm 10~20%, 바닥 30~40% / 급여 직후와 잔량 차이 작음",act:"혼합시간·투입순서 점검, 건초 절단길이 조정, 수분 45~50% 맞추기"},
  {id:"a5",q:"사료 신선도·사료조 청결",std:"발열·곰팡이·변질 사료 없음, 잔량 매일 제거",act:"잔량 매일 청소, 여름철 1일 2회 급여 검토"},
  {id:"a6",q:"사일리지 절단면 관리",std:"절단면 매끈, 하루 굴진 15~30cm 이상, 2차발효 흔적 없음",act:"절단면 면적 축소, 쉐이버 사용, 필요시 보존제 검토"}]},
 {code:"B",name:"음수",items:[
  {id:"b1",q:"음수 공간 충분",std:"두당 수조 길이 10cm 이상, 군당 2개소 이상",act:"수조 증설, 군당 최소 2개소 확보"},
  {id:"b2",q:"수조 청결",std:"이끼·사료 찌꺼기 없음, 주 2회 이상 세척",act:"세척 일정표 운영, 배수 쉬운 수조로 교체 검토"},
  {id:"b3",q:"급수 속도 충분",std:"수위가 빠르게 회복 (분당 10~20L 이상)",act:"배관 구경·수압 점검, 플로트 밸브 교체"},
  {id:"b4",q:"착유 후 동선 음수 가능",std:"착유장 퇴장 직후 물을 마실 수 있음",act:"착유장 출구 측 수조 설치"}]},
 {code:"C",name:"우상·휴식",items:[
  {id:"c1",q:"사육밀도 적정",std:"착유우 우상 대비 100% 이하, 분만전후군 80~85% 이하",act:"분만전후군부터 밀도 해소, 도태·군 재편성 검토"},
  {id:"c2",q:"깔짚 충분·건조",std:"무릎 테스트(10초 꿇었을 때 젖지 않음) 통과, 깔짚 두께 유지",act:"깔짚 보충 주기 단축, 습한 뒷부분 매일 제거"},
  {id:"c3",q:"우상 규격 적정",std:"홀스타인 기준 폭 1.15~1.25m, 길이 2.4~2.7m, 넥레일 높이 1.2~1.3m",act:"넥레일 위치 조정, 칸막이 개조"},
  {id:"c4",q:"기립·착와 동작 자연스러움",std:"앞발만 올린 소(퍼칭) 적음, 기립 시 머리 부딪힘 없음",act:"브리스킷 로케이터·넥레일 전진 공간 확보"},
  {id:"c5",q:"분만방·환축방 확보",std:"깔짚 방 두당 9~11㎡, 분만 예정 두수 대비 충분",act:"분만방 면적 확보, 깔짚 교체 주기 설정"}]},
 {code:"D",name:"환기·열스트레스",items:[
  {id:"d1",q:"THI 기준 냉방 운영",std:"THI 68 이상이면 송풍·미스트 가동 (농장 탭에서 THI 자동 계산)",act:"온습도계 설치, THI 68 기준 자동 가동 설정"},
  {id:"d2",q:"휴식구역 송풍 충분",std:"소 몸 높이에서 풍속 2m/s 이상, 팬 정상 작동",act:"팬 청소·벨트 점검, 팬 간격·각도 조정"},
  {id:"d3",q:"착유대기장 냉방",std:"대기장에 팬+미스트(소킹) 설치, 대기 60분 이내",act:"대기장 소킹 설비 우선 설치, 착유 그룹 크기 조정"},
  {id:"d4",q:"공기질 양호",std:"암모니아 냄새·결로·거미줄 과다 없음",act:"측창 개방, 배기 용량 점검"},
  {id:"d5",q:"호흡수 정상",std:"휴식 중 호흡수 분당 60회 이하 (여름철 10두 이상 측정)",act:"냉방 강화, 급여시간 서늘한 시간대로 이동"}]},
 {code:"E",name:"바닥·보행·발굽",items:[
  {id:"e1",q:"바닥 미끄럼 없음",std:"통로 그루빙 상태 양호, 소가 조심스럽게 걷지 않음",act:"그루빙 재시공, 고무매트 검토"},
  {id:"e2",q:"분뇨 제거 적정",std:"하루 2회 이상 제거, 발굽 위로 분뇨가 차지 않음",act:"스크래퍼 주기 증가, 배수 경사 점검"},
  {id:"e3",q:"정기 삭제·족욕",std:"연 2회 이상 정기 삭제, 족욕 주 2~3회 운영",act:"삭제 일정표 작성, 족욕 약제 농도·교체 주기 관리"},
  {id:"e4",q:"파행우 조기 처치",std:"파행 발견 후 48시간 내 처치, 기록 유지",act:"보행점수 월 1회 실시, 처치 기록장 운영"}]},
 {code:"F",name:"착유·유방건강",items:[

/* ---------- 계산 ---------- */
function cccsScore(sec){
  const items=sec?sec.items:CCCS.flatMap(s=>s.items);
  let got=0,max=0,done=0,n=0,bad=0,warn=0;
  items.forEach(it=>{const v=S.cccs[it.id];n++;if(v===undefined||v===null)return;done++;if(v<0)return;got+=v;max+=2;if(v===0)bad++;if(v===1)warn++});
  return {pct:max?Math.round(got/max*100):null,done,n,bad,warn};
}
function grade(p){return p==null?"—":p>=85?"A":p>=70?"B":p>=55?"C":"D"}
function indFor(g){return SIGNALS.filter(x=>!x.groups||x.groups.includes(g))}
function sigStat(g,ind){
  const c=(S.signals[g]||{})[ind.id]; if(!c)return null;
  const n=c.reduce((a,b)=>a+b,0); if(!n)return null;
  let b=0,sum=0; c.forEach((k,i)=>{sum+=k*ind.opts[i].v; if(ind.bad(ind.opts[i].v,g))b+=k});
  const pct=Math.round(b/n*100);
  return {n,bad:b,pct,mean:sum/n,status:pct<ind.limit?"good":pct<ind.limit*1.5?"warn":"bad"};
}
function comfortStat(g){
  const c=S.comfort[g]; if(!c)return null;
  const L=+c.lying||0,St=+c.stand||0,P=+c.perch||0,A=+c.alley||0,F=+c.feed||0,R=+c.rumi||0;
  const inStall=L+St+P, notFeed=L+St+P+A;
  return {
    cci: inStall? Math.round(L/inStall*100):null,
    perch: inStall? Math.round(P/inStall*100):null,
    sui: notFeed? Math.round(L/notFeed*100):null,
    rumi: L? Math.round(R/L*100):null,
    total:L+St+P+A+F
  };
}
function thi(){
  const T=parseFloat(S.farm.temp), RH=parseFloat(S.farm.rh);
  if(isNaN(T)||isNaN(RH))return null;
  return Math.round(((1.8*T+32)-(0.55-0.0055*RH)*(1.8*T-26))*10)/10;
}
function thiLevel(t){ if(t==null)return null; return t<68?["good","정상"]:t<72?["warn","경미한 스트레스"]:t<80?["bad","중등도 스트레스"]:["bad","심한 스트레스"] }
function milkFlags(){
  const f=S.farm, out=[], fat=parseFloat(f.fat), pr=parseFloat(f.prot), mun=parseFloat(f.mun), scc=parseFloat(f.scc);
  if(fat&&pr){const r=fat/pr; if(r<1.0)out.push({p:1,t:`유지율/유단백 비 ${r.toFixed(2)} — 1.0 미만`,a:"아급성 반추위산증(SARA) 의심: 물리적 섬유(peNDF)·전분 수준·선별채식 점검"});
    else if(r>1.4)out.push({p:2,t:`유지율/유단백 비 ${r.toFixed(2)} — 1.4 초과`,a:"에너지 부족·체지방 동원(케토시스) 의심: 비유초기 채식량, BHB 검사"});}
  if(mun){ if(mun>18)out.push({p:2,t:`MUN ${mun} mg/dL — 높음`,a:"단백질 과잉 또는 에너지 부족: RDP/에너지 균형 점검 (참고 범위 10~16)"});
           else if(mun<10)out.push({p:2,t:`MUN ${mun} mg/dL — 낮음`,a:"반추위 분해단백질 부족 가능성: 단백질 수준 점검"});}
  if(scc&&scc>20)out.push({p:scc>40?1:2,t:`체세포수 ${scc}만/mL`,a:"착유 위생·고체세포우 관리 (F 섹션)"});
  return out;
}
function findings(){
  const out=[];
  CCCS.forEach(sec=>sec.items.forEach(it=>{const v=S.cccs[it.id]; if(v===0||v===1) out.push({p:v===0?1:2,src:`CCCS ${sec.code}`,t:it.q+(S.memo[it.id]?` — ${S.memo[it.id]}`:""),a:it.act})}));
  GROUPS.forEach(g=>indFor(g.id).forEach(ind=>{const st=sigStat(g.id,ind); if(st&&st.status!=="good") out.push({p:st.status==="bad"?1:2,src:`카우시그널 · ${g.name}`,t:`${ind.name} 문제 개체 ${st.pct}% (${st.bad}/${st.n}두, 기준 ${ind.limit}% 미만)`,a:ind.act})}));
  GROUPS.forEach(g=>{const c=comfortStat(g.id); if(!c)return;
    if(c.cci!=null&&c.cci<85) out.push({p:c.cci<75?1:2,src:`카우시그널 · ${g.name}`,t:`카우컴포트지수(CCI) ${c.cci}% — 목표 85% 이상`,a:"우상 편안함 부족: 깔짚·규격·사육밀도 점검 (착유 1~2시간 전 측정 기준)"});
    if(c.rumi!=null&&c.rumi<50) out.push({p:c.rumi<40?1:2,src:`카우시그널 · ${g.name}`,t:`누운 소 중 반추 비율 ${c.rumi}% — 목표 50% 이상`,a:"물리적 섬유 부족·선별채식·휴식 방해 가능성: TMR 입자도와 사료조 관찰"});});
  const t=thi(), tl=thiLevel(t); if(tl&&tl[0]!=="good") out.push({p:t>=72?1:2,src:"환경",t:`THI ${t} — ${tl[1]}`,a:"송풍·소킹 가동, 대기장 냉방, 음수 공간 확대, 고에너지 밀도·완충제 검토"});
  milkFlags().forEach(m=>out.push({...m,src:"검정성적"}));
  return out.sort((a,b)=>a.p-b.p);
}

function comfortHtml(cs){
  if(!cs||!cs.total)return '<span class="muted small">숫자를 넣으면 지수가 계산됩니다.</span>';
  const row=(k,v,t,good)=>`<div class="kv"><span>${k}<br><span class="small muted">${t}</span></span><span class="row"><span class="mono">${v==null?"—":v+"%"}</span>${v==null?"":`<span class="pill ${good(v)}">${good(v)==="good"?"양호":good(v)==="warn"?"주의":"불량"}</span>`}</span></div>`;
  return row("카우컴포트지수 CCI",cs.cci,"우상 접촉 소 중 누운 소 · 목표 85% 이상",v=>v>=85?"good":v>=75?"warn":"bad")
   +row("퍼칭 비율",cs.perch,"우상 접촉 소 중 앞발만 올린 소 · 참고 10% 미만",v=>v<10?"good":v<20?"warn":"bad")
   +row("반추 비율",cs.rumi,"누운 소 중 반추 중 · 목표 50% 이상",v=>v>=50?"good":v>=40?"warn":"bad")
   +`<div class="kv"><span>우상 이용 지수 SUI<br><span class="small muted">채식 중 아닌 소 중 누운 소 · 참고 지표</span></span><span class="mono">${cs.sui==null?"—":cs.sui+"%"}</span></div>`;
}

    <pre class="copy" id="sumText">${esc(summaryText())}</pre>

function sigTable(){
  const rows=[];
  GROUPS.forEach(g=>indFor(g.id).forEach(ind=>{const st=sigStat(g.id,ind); if(st) rows.push(`<tr><td>${g.name}</td><td>${ind.name}</td><td class="n">${st.n}</td><td class="n">${st.mean.toFixed(2)}</td><td class="n">${st.pct}%</td><td><span class="pill ${st.status}">${st.status==="good"?"양호":st.status==="warn"?"주의":"불량"}</span></td></tr>`)}));
  GROUPS.forEach(g=>{const c=comfortStat(g.id); if(c&&c.total){ if(c.cci!=null)rows.push(`<tr><td>${g.name}</td><td>CCI</td><td class="n">${c.total}</td><td class="n">—</td><td class="n">${c.cci}%</td><td><span class="pill ${c.cci>=85?"good":c.cci>=75?"warn":"bad"}">${c.cci>=85?"양호":c.cci>=75?"주의":"불량"}</span></td></tr>`);
    if(c.rumi!=null)rows.push(`<tr><td>${g.name}</td><td>반추 비율</td><td class="n">${S.comfort[g.id].lying}</td><td class="n">—</td><td class="n">${c.rumi}%</td><td><span class="pill ${c.rumi>=50?"good":c.rumi>=40?"warn":"bad"}">${c.rumi>=50?"양호":c.rumi>=40?"주의":"불량"}</span></td></tr>`);}});
  if(!rows.length)return '<div class="card muted">카우시그널 입력이 없습니다.</div>';
  return `<div class="card scroll"><table class="t"><thead><tr><th>우군</th><th>지표</th><th>두수</th><th>평균</th><th>문제·지수</th><th>판정</th></tr></thead><tbody>${rows.join("")}</tbody></table></div>`;
}
function summaryText(){
  const sc=cccsScore(), F=findings(), t=thi();
  let s=`[낙농 현장점검] ${S.farm.name||""} ${S.farm.date}\n`;
  if(S.farm.milking)s+=`착유 ${S.farm.milking}두`+(S.farm.milk?` / 두당 ${S.farm.milk}kg`:"")+"\n";
  s+=`CCCS ${sc.pct??"-"}점 (등급 ${grade(sc.pct)}) · 불량 ${sc.bad} · 주의 ${sc.warn}\n`;
  if(t!=null)s+=`THI ${t} (${thiLevel(t)[1]})\n`;
  s+=`\n■ 우선 개선\n`; const p1=F.filter(x=>x.p===1); s+=p1.length?p1.map((x,i)=>`${i+1}. ${x.t}\n   → ${x.a}`).join("\n"):"없음";
  const p2=F.filter(x=>x.p===2); if(p2.length) s+=`\n\n■ 개선 권장\n`+p2.map((x,i)=>`${i+1}. ${x.t}`).join("\n");
  return s;
}
function csv(){
  const L=[["구분","섹션/우군","항목/지표","값","판정","메모·기준"]];
  L.push(["농장",S.farm.name,S.farm.date,S.farm.milking,"",S.farm.notes]);
  CCCS.forEach(sec=>sec.items.forEach(it=>{const v=S.cccs[it.id];L.push(["CCCS",sec.code+" "+sec.name,it.q,v==null?"":v<0?"해당없음":v,v===2?"양호":v===1?"주의":v===0?"불량":"",S.memo[it.id]||it.std])}));
  GROUPS.forEach(g=>indFor(g.id).forEach(ind=>{const c=(S.signals[g.id]||{})[ind.id];const st=sigStat(g.id,ind);if(!st)return;
    L.push(["카우시그널",g.name,ind.name,st.pct+"%",st.status,ind.opts.map((o,i)=>`${o.l}:${c[i]}`).join(" ")])}));
  GROUPS.forEach(g=>{const c=comfortStat(g.id);if(c&&c.total)L.push(["행동관찰",g.name,"CCI/반추/퍼칭",`${c.cci}% / ${c.rumi}% / ${c.perch}%`,"",""])});
  return "﻿"+L.map(r=>r.map(x=>`"${String(x??"").replace(/"/g,'""')}"`).join(",")).join("\r\n");
}

function render(){
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===tab));
  const views={farm:vFarm,cccs:vCCCS,sig:vSig,report:vReport,hist:vHist};
  $("#main").innerHTML=(views[tab]||vFarm)();
  if(tab==="farm")$("#milkOut").innerHTML=milkOutHtml();

function go(t){tab=t;try{history.replaceState(null,"","#"+t)}catch(e){}render();window.scrollTo(0,0)}
function toast(m){const d=document.createElement("div");d.className="toast";d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
async function copy(text){try{await navigator.clipboard.writeText(text);toast("복사했습니다");return true}catch(e){const p=$("#sumText");if(p){const r=document.createRange();r.selectNodeContents(p);const s=getSelection();s.removeAllRanges();s.addRange(r)}toast("복사가 막혀 있어 텍스트를 선택해 두었습니다");return false}}
function download(name,text,type){
  try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);toast("파일을 저장했습니다");}
  catch(e){copy(text)}
}
const fname=ext=>`점검_${(S.farm.name||"농장").replace(/[\\/:*?"<>|\s]+/g,"_")}_${S.farm.date}.${ext}`;

/* ---------- 이벤트 ---------- */
document.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b)return;
  if(b.dataset.tab)return go(b.dataset.tab);
  if(b.dataset.go)return go(b.dataset.go);
  if(b.dataset.sec){openSec[b.dataset.sec]=!openSec[b.dataset.sec];return render()}
  if(b.dataset.item){const v=+b.dataset.v;S.cccs[b.dataset.item]=S.cccs[b.dataset.item]===v?null:v;save();
    const y=b.getBoundingClientRect().top;render();const nb=document.querySelector(`[data-item="${b.dataset.item}"][data-v="${b.dataset.v}"]`);if(nb)window.scrollBy(0,nb.getBoundingClientRect().top-y);return}
  if(b.dataset.grp){grp=b.dataset.grp;return render()}
  if(b.dataset.tally){
    const ind=SIGNALS.find(x=>x.id===b.dataset.tally),i=+b.dataset.i;
    S.signals[grp]=S.signals[grp]||{}; const c=S.signals[grp][ind.id]=S.signals[grp][ind.id]||ind.opts.map(()=>0);
    c[i]=Math.max(0,c[i]+(minus?-1:1)); save();
    try{navigator.vibrate&&navigator.vibrate(15)}catch(_){}
    const y=b.getBoundingClientRect().top;render();
    const nb=document.querySelector(`[data-tally="${ind.id}"][data-i="${i}"]`); if(nb){window.scrollBy(0,nb.getBoundingClientRect().top-y);nb.classList.add("flash");setTimeout(()=>nb.classList.remove("flash"),180)}
    return;
  }
  if(b.dataset.load){const v=store.get(KEY_VISITS,[]).find(x=>x.id===b.dataset.load);if(v){S=JSON.parse(JSON.stringify(v));save();toast("점검을 불러왔습니다");go("report")}return}
  if(b.dataset.del){const box=$("#hv_"+b.dataset.del);box.innerHTML=`<span class="confirm"><span class="small">삭제할까요?</span><button class="danger" data-delok="${b.dataset.del}">삭제</button><button data-act="cancelDel">취소</button></span>`;return}
  if(b.dataset.delok){store.set(KEY_VISITS,store.get(KEY_VISITS,[]).filter(x=>x.id!==b.dataset.delok));toast("삭제했습니다");return render()}
  const a=b.dataset.act;
  if(a==="cancelDel")return render();
  if(a==="expandAll"){const any=Object.values(openSec).some(Boolean);CCCS.forEach(s=>openSec[s.code]=!any);return render()}
  if(a==="new"){
    if(!S.example && !b.dataset.sure && (Object.keys(S.cccs).length||Object.keys(S.signals).length)){b.dataset.sure="1";b.textContent="현재 내용 지우고 시작";toast("저장하지 않은 내용은 사라집니다. 한 번 더 누르세요");return}
    S=blank(); save(); openSec={A:true}; toast("새 점검을 시작합니다"); return go("farm");
  }
  if(a==="saveVisit"){const V=store.get(KEY_VISITS,[]);const i=V.findIndex(x=>x.id===S.id);const copyS=JSON.parse(JSON.stringify(S));if(i>=0)V[i]=copyS;else V.push(copyS);toast(store.set(KEY_VISITS,V)?"점검 기록을 저장했습니다":"이 브라우저에서는 저장할 수 없습니다. 백업 파일을 사용하세요");return}
  if(a==="copyText")return copy(summaryText());
  if(a==="csv")return download(fname("csv"),csv(),"text/csv;charset=utf-8");
  if(a==="backup")return download(`점검기록_백업_${today()}.json`,JSON.stringify({visits:store.get(KEY_VISITS,[]),draft:S},null,1),"application/json");
  if(a==="restore")return $("#fileIn").click();
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.farm){S.farm[t.dataset.farm]=t.value;save();
    if(["temp","rh"].includes(t.dataset.farm)){const th=thi(),tl=thiLevel(th);$("#thiOut").innerHTML=th==null?'<span class="muted small">온도와 습도를 넣으면 THI가 계산됩니다.</span>':`<span class="mono" style="font-size:22px;font-weight:600">THI ${th}</span><span class="pill ${tl[0]}">${tl[1]}</span>`}
    if(["fat","prot","mun","scc"].includes(t.dataset.farm))$("#milkOut").innerHTML=milkOutHtml();}
  if(t.dataset.memo){S.memo[t.dataset.memo]=t.value;save()}
  if(t.dataset.comfort){S.comfort[grp]=S.comfort[grp]||{};S.comfort[grp][t.dataset.comfort]=t.value.replace(/[^0-9]/g,"");save();$("#comfortOut").innerHTML=comfortHtml(comfortStat(grp))}
});
document.addEventListener("change",e=>{
  if(e.target.id==="minus"){minus=e.target.checked;render()}
  if(e.target.id==="fileIn"){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);const V=store.get(KEY_VISITS,[]);(d.visits||[]).forEach(v=>{if(!V.some(x=>x.id===v.id))V.push(v)});store.set(KEY_VISITS,V);toast(`${(d.visits||[]).length}건을 불러왔습니다`);render()}catch(err){toast("백업 파일 형식이 아닙니다")}};r.readAsText(f);e.target.value=""}
});
window.addEventListener("hashchange",()=>{const t=location.hash.slice(1);if(t&&t!==tab){tab=t;render()}});

if(!S.example && !Object.keys(S.cccs).length) openSec={A:true}; else openSec={A:true,C:true};
render();

/* 오프라인 사용(PWA): 독립 배포 시에만 동작 */
try{ if("serviceWorker" in navigator && location.protocol==="https:" && !location.hostname.endsWith("claude.ai") && !location.hostname.endsWith("claudeusercontent.com")) navigator.serviceWorker.register("sw.js").catch(()=>{}) }catch(e){}
</script>
</body>
</html>
