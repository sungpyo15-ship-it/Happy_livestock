<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>축우 현장점검</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#16324a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: 모바일 우선 단일 컬럼 + 하단 탭바. 현장(장갑·햇빛)에서 큰 터치 타깃, 높은 대비 */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --ink:#16232e; --muted:#5d6b75; --line:#d9e0e3;
  --accent:#16324a; --accent-2:#2f6f8f; --accent-ink:#ffffff;
  --good:#2e7d4f; --good-bg:#e3f2e8; --warn:#a86a00; --warn-bg:#fbf0d9; --bad:#b3352b; --bad-bg:#f8e2df; --na:#8a959c;
  --font:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f161b; --surface:#172129; --ink:#e6edf0; --muted:#9aa8b0; --line:#2a3842;
  --accent:#8cc3e0; --accent-2:#6fb0d0; --accent-ink:#0b1a24;
  --good:#6fcf97; --good-bg:#16301f; --warn:#f0b54a; --warn-bg:#352a12; --bad:#ff8a7d; --bad-bg:#3a1c19; --na:#7b878e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f161b; --surface:#172129; --ink:#e6edf0; --muted:#9aa8b0; --line:#2a3842;
  --accent:#8cc3e0; --accent-2:#6fb0d0; --accent-ink:#0b1a24;
  --good:#6fcf97; --good-bg:#16301f; --warn:#f0b54a; --warn-bg:#352a12; --bad:#ff8a7d; --bad-bg:#3a1c19; --na:#7b878e; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font:15px/1.5 var(--font);-webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(84px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--accent)}
.wrap{max-width:760px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--accent);color:var(--accent-ink);
  margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));
  padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
header.top .wrap{display:flex;align-items:center;gap:12px}
header.top h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.01em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top .score{font:600 15px var(--mono);font-variant-numeric:tabular-nums;padding:3px 10px;border-radius:99px;background:rgba(255,255,255,.14)}
:root[data-theme="dark"] header.top .score{background:rgba(0,0,0,.12)}
h2{font-size:19px;margin:22px 0 8px;text-wrap:balance}
h3{font-size:15px;margin:0;font-weight:600}
.muted{color:var(--muted)} .small{font-size:13px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;min-height:44px;width:100%}
textarea{min-height:64px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);min-height:44px;padding:8px 14px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.ghost{background:transparent}
button.danger{color:var(--bad);border-color:var(--bad)}
.banner{border:1px dashed var(--warn);background:var(--warn-bg);color:var(--ink);border-radius:var(--r);padding:10px 12px;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
.banner b{color:var(--warn)}
/* 탭바 */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
nav.tabs button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:12px;color:var(--muted);min-height:52px}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
nav.tabs button[aria-selected="true"]{color:var(--accent);font-weight:700}
/* CCCS 항목 */
.sec{margin-top:14px}
.sec-head{display:flex;align-items:center;gap:10px;padding:10px 0;cursor:pointer;border:0;background:none;width:100%;text-align:left;min-height:auto}
.sec-head .code{font:600 13px var(--mono);color:var(--accent-2);width:22px}
.sec-head h3{flex:1}
.meter{height:6px;border-radius:99px;background:var(--line);overflow:hidden;width:72px}
.meter i{display:block;height:100%;background:var(--good)}
.pct{font:600 13px var(--mono);font-variant-numeric:tabular-nums;width:44px;text-align:right}
.item{border-top:1px solid var(--line);padding:12px 0;display:flex;flex-direction:column;gap:8px}
.item:first-child{border-top:0}
.item .q{font-weight:500}
.item .std{font-size:12.5px;color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg button{min-height:44px;padding:6px 4px;font-size:14px}
.seg button[data-v="2"][aria-pressed="true"]{background:var(--good-bg);border-color:var(--good);color:var(--good);font-weight:700}
.seg button[data-v="1"][aria-pressed="true"]{background:var(--warn-bg);border-color:var(--warn);color:var(--warn);font-weight:700}
.seg button[data-v="0"][aria-pressed="true"]{background:var(--bad-bg);border-color:var(--bad);color:var(--bad);font-weight:700}
.seg button[data-v="-1"][aria-pressed="true"]{background:var(--line);color:var(--ink);font-weight:700}
.memo{font-size:14px;min-height:40px;padding:8px}
/* 카우시그널 */
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips button{white-space:nowrap;border-radius:99px;min-height:40px;padding:6px 14px;font-size:14px}
.chips button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.ind-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.tally{display:grid;gap:6px;margin-top:10px}
.tally button{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 2px;min-height:62px;position:relative}
.tally button .lb{font-size:13px;color:var(--muted)}
.tally button .ct{font:600 20px var(--mono);font-variant-numeric:tabular-nums}
.tally button.isbad{border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.tally button.isbad .lb{color:var(--bad)}
.tally button.flash{background:var(--good-bg)}
.minus-on .tally button{border-style:dashed}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:2px 10px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.na{background:var(--line);color:var(--muted)}
.toolbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 50px);z-index:4;background:var(--bg);padding:8px 0;display:flex;flex-direction:column;gap:8px}
.switch{display:flex;align-items:center;gap:8px;font-size:14px}
.switch input{width:22px;height:22px;min-height:auto}
.num-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--line)}
.kv:first-child{border-top:0}
/* 리포트 */
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.summary .stat{min-width:0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.stat .v{font:600 24px var(--mono);font-variant-numeric:tabular-nums}
.stat .k{font-size:12.5px;color:var(--muted)}
.finding{display:grid;grid-template-columns:6px 1fr;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.finding:first-child{border-top:0}
.finding .bar{border-radius:3px}
.finding.p1 .bar{background:var(--bad)} .finding.p2 .bar{background:var(--warn)} .finding.p3 .bar{background:var(--accent-2)}
.finding .t{font-weight:600}
.finding .a{font-size:13.5px;color:var(--muted)}
table.t{border-collapse:collapse;width:100%;font-size:13.5px}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;white-space:nowrap}
table.t td.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;z-index:20;max-width:90vw}
pre.copy{white-space:pre-wrap;font-size:12.5px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;max-height:260px;overflow:auto}
.confirm{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.src{font-size:11px;font-weight:600;border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:1px;white-space:nowrap}
.src.k{background:color-mix(in srgb,var(--accent-2) 16%,transparent);color:var(--accent-2)}
.src.l{background:var(--line);color:var(--muted)}
.valrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.valrow input{width:130px;flex:0 0 auto}
.valrow input.txt{flex:1 1 200px;width:auto}
.valrow .u{font-size:13px;color:var(--muted)}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts button{min-height:40px;padding:6px 10px;font-size:13.5px}
.opts button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.opts button .p{font-family:var(--mono);opacity:.75;margin-left:4px}
.signs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
@media (max-width:380px){.signs{grid-template-columns:1fr}}
.signs button{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;min-height:52px;padding:6px 10px;font-size:13px;line-height:1.3}
.signs button .ct{font:600 18px var(--mono);min-width:22px;text-align:right}
.signs button.on{border-color:var(--warn);background:var(--warn-bg)}
.calc{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:4px}
.calc .stat .v{font-size:19px}
nav.tabs .wrap{grid-template-columns:repeat(5,1fr)}
nav.tabs button{font-size:11.5px}
details.why{font-size:13px;color:var(--muted);border-left:3px solid color-mix(in srgb,var(--accent-2) 40%,var(--line));padding:2px 0 2px 10px}
details.why summary{cursor:pointer;color:var(--accent-2);font-weight:600;list-style:none;min-height:28px;display:flex;align-items:center}
details.why summary::-webkit-details-marker{display:none}
details.why summary::before{content:"＋";margin-right:6px;font-weight:700}
details.why[open] summary::before{content:"－"}
details.why div{color:var(--ink);line-height:1.6;padding:2px 0 4px}
.hbtn{min-height:36px;min-width:36px;padding:0 10px;border-radius:99px;border:1px solid rgba(255,255,255,.35);background:transparent;color:var(--accent-ink);font-weight:700}
.help h2{margin-top:26px}
.help h3{margin:16px 0 6px}
.help p,.help li{line-height:1.7;max-width:68ch}
.help ol,.help ul{padding-left:20px;margin:6px 0}
.help table.t td,.help table.t th{white-space:normal}
.toc{display:flex;flex-wrap:wrap;gap:6px}
.toc a{font-size:13px;padding:6px 10px;border:1px solid var(--line);border-radius:99px;color:var(--ink);text-decoration:none;background:var(--surface)}
.why-item{padding:10px 0;border-top:1px solid var(--line)}
.why-item:first-child{border-top:0}
.why-item .q{font-weight:600}
.why-item .std{font-size:12.5px;color:var(--muted)}
.why-item .w{font-size:13.5px;line-height:1.65;margin-top:4px}
body.gated nav.tabs, body.gated .hbtn{display:none}
.gate{text-align:center;padding:48px 8px 24px;max-width:520px;margin:0 auto}
.gate p{color:var(--muted);line-height:1.7}
.gate-icon{width:56px;height:56px;border-radius:99px;margin:0 auto 8px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px}
header.top .score:empty{display:none}
.badge{position:absolute;top:2px;right:calc(50% - 22px);background:var(--bad);color:#fff;border-radius:99px;font-size:10px;min-width:16px;height:16px;line-height:16px;padding:0 4px;font-weight:700}
nav.tabs button{position:relative}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <h1 id="hdrTitle">축우 현장점검</h1>
  <span class="score" id="hdrScore" title="현재 점검 분야 점수">—</span>
  <button class="hbtn" data-tab="help" aria-label="사용 설명서와 기준 해설">?</button>
</div></header>

<main class="wrap" id="main"></main>

<nav class="tabs" aria-label="화면 전환"><div class="wrap" role="tablist">
  <button role="tab" data-tab="farm"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9H3z"/><path d="M9 20v-6h6v6"/></svg>농장</button>
  <button role="tab" data-tab="chk"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8l2 2 4-4M8 15h8"/></svg>점검표</button>
  <button role="tab" data-tab="sig"><svg viewBox="0 0 24 24"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg>개체관찰</button>
  <button role="tab" data-tab="report"><svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>리포트</button>
  <button role="tab" data-tab="hist"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>기록</button>
</div></nav>

<input type="file" id="fileIn" accept="application/json,.json" hidden>

<script>
/* ============================================================
   점검 기준 설정
   출처 표시: 표시 없음 = CCCS·한우 점검표 교육자료(2025.04)
             s:"문헌"  = 교재에 없어 국내 법규·일반 문헌으로 보완 (확인 권장)
   ============================================================ */
const INF=1e9;
/* ---------- 단독 배포판 설정 (Claude 없이 링크로 쓰는 버전) ----------
   Cloudflare Access 뒤에 배포하면 로그인 계정을 자동으로 읽고 팀 코드는 묻지 않음 (권장)
   codeHash: Access 없이 배포할 때만 쓰는 팀 코드의 SHA-256 값 (빈 문자열이면 잠금 없음). 기본 팀 코드: HAPPY2026
   adminEmail: 팀원이 기록을 보낼 관리자 이메일 (비워 두면 앱의 기록 탭에서 각자 입력) */
const TEAM_CFG={codeHash:"757e770313e939245daf4bbbe66561f963b1a5550258253f5c474ca19199f199",adminEmail:"",adminLabel:"관리자"};

/* ---------- 2~4. 한우 (배점형) ----------
   opts: [[라벨,점수]...] / scale: 0~max 점수 버튼 / base+ded: 감점식 / obs: 점수 없는 관찰(첫 보기만 정상)
   f: 기록 칸 [[키,라벨,단위]] */
const YN=(p)=>[["예",p],["아니오",0]];
const P=(id,q,x,hint,more)=>Object.assign({id,q,hint},Array.isArray(x)?{opts:x}:{scale:x},more||{});
const BEEF = [
 {code:"A",name:"마무리기 사양",items:[
  P("b1","배합사료 섭취량",5,"7~10 kg 섭취 유도 (10 kg 이상 과도한 급여 금지). 권장 섭취량 적용 시 5점",{f:[["b1k","섭취량","kg/일/두"]]}),
  P("b2","섭취 기록",YN(3),"기록이 없어서는 안 됨"),
  P("b3","볏짚 섭취량",3,"상태 양호한 볏짚, 프로그램 정량 (교재 프로그램 25~30개월 1.0 kg)",{f:[["b3k","볏짚","kg/일/두"]]}),
  P("b4","소금 급여",YN(2),"적용"),
  P("b5","스탄치온 설치",YN(1),"적용"),
  P("b6","요결석 징후",[["양호",1],["관찰됨",0]],"징후 관찰 시 음수량 체크")]},
 {code:"B",name:"사육환경",items:[
  P("b7","두당 사육면적",5,"비육우 7 ㎡, 송아지 2.5 ㎡ 이상 (축산법 적정사육기준과 같음)",{f:[["b7k","두당","㎡"]],auto:"beefArea"}),
  P("b8","바닥 상태",5,"불량일 경우 바닥재 교체"),
  P("b9","체모 상태",5,"체모가 더러울 경우 바닥재 교체"),
  P("b10","물통 상태",5,"더러울 경우 반드시 청소"),
  P("b11","물통 보온",YN(5),"겨울철 보온이 안 되면 물통 교체 권장"),
  P("b12","환기 상태",5,"불량일 때 구조 변경 권장")]},
 {code:"C",name:"사료·위생 관리",items:[
  P("b13","사조 및 급이기 청소 주기",[["매일",5],["주 2회",4],["주 1회",3],["생각나면",1],["안 함",0]],""),
  P("b14","구충",[["구충함",4],["안 함",0]],"2차 구충 실시 권장"),

const W_DENS="밀사는 사료·물·휴식 공간 경쟁을 만들어 서열 낮은 소의 섭취와 휴식이 줄고, 질병이 빨리 퍼지며 개체 간 편차가 커집니다. 비육우 두당 7㎡는 축산법 적정사육기준과 같습니다.";
const W_RESP="호흡기 질환은 비육·육성 초기 증체를 크게 떨어뜨리고, 한 번 손상된 폐는 회복이 어려워 출하까지 성적에 영향을 줍니다. 백신과 조기 발견·치료가 손실을 줄이는 가장 싼 방법입니다.";
const W_DIARR="설사는 탈수와 영양 손실로 성장을 멈추게 하고, 늦게 대응하면 폐사로 이어집니다. 조기 발견과 수분·전해질 보충이 핵심입니다.";
const W_WORM="기생충은 사료 영양을 빼앗고 면역을 떨어뜨려 사료효율과 증체를 낮춥니다. 연 2회 정기 구충이 일반적인 권장입니다.";
const W_ACID="고농후사료를 급하게 먹으면 반추위 pH가 떨어지는 과산증(산독증)이 생겨 섭취량 감소, 연변, 제엽염(발굽 질환), 간농양으로 이어집니다.";
const W_STONE="요결석은 거세 비육우에서 흔한 대사 질병으로, 요도가 막히면 폐사에 이릅니다. 충분한 음수, 칼슘·인 균형, 소금 급여가 예방의 핵심입니다.";
const W_HAY="육성기에 양질 건초를 충분히 먹여야 반추위 용적과 골격이 커져, 비육 후기까지 섭취량과 증체가 유지됩니다. 절단해 주면 골라 먹기가 줄고 섭취가 고릅니다.";

const W_WEIGH="체중을 재야 프로그램 대비 성장이 맞는지 알고 급여량을 조정할 수 있습니다. 전라도 우수농장에서도 평균 점수가 가장 낮은 항목(2.6점)이라 차별화 여지가 큽니다.";
const W_REC="기록이 있어야 섭취량·질병·번식의 변화를 일찍 알아채고, 개선 효과를 숫자로 확인할 수 있습니다.";

const W_VAC="백신은 질병이 생긴 뒤 치료하는 것보다 훨씬 적은 비용으로 폐사와 성장 손실을 막습니다. 수의사 처방과 기록이 있어야 일정이 지켜집니다.";
const W_BCSCOW="번식우가 마르면 분만 후 발정 재귀가 늦어 분만간격이 길어지고, 너무 살찌면 난산과 허약 송아지가 늘어납니다.";
const W_CALFWATER="송아지도 물이 있어야 인공유를 먹고 반추위가 발달합니다. 물이 없으면 인공유 섭취가 크게 줄어듭니다.";

const WHY={
 /* 파리 (흡혈·일반) */
 fl9:"집파리는 피를 빨지 않아 생산성 손실을 직접 잰 연구가 드물고, 미국에서도 경제적 피해 기준이 정해져 있지 않습니다. 대신 소를 귀찮게 하는 수준의 밀도는 결막염·유방염 발생과 관련이 깊습니다(Texas A&M). 흰 카드에 찍힌 파리똥 점을 주 1회 세는 스폿카드는 집파리 밀도를 꾸준히 비교하는 표준 방법이며, 카드당 주 100점 초과가 방제를 강화할 수준입니다(코넬대). 대형 목장은 소 근처 그늘진 휴식 장소에 12장 정도를 붙이면 믿을 만한 값이 나옵니다(Gerry 등 2011, J Econ Entomol).",
 fl10:"집파리는 착유실·병우칸·송아지방을 오가며 균을 옮깁니다. 뉴욕 목장에서 잡은 집파리 101마리에서 유방염 원인균 26종(황색포도상구균, 마이코플라스마 포함)과 대장균·살모넬라 같은 식중독균, 우유 변패균이 나왔고, 74%는 파리 몸속에 있었습니다(JDS Communications 2022). 그리스 착유우 시험에서는 델타메트린 기피제로 소에 앉는 파리를 줄이자 황색포도상구균·CNS·대장균 유방 감염과 체세포가 줄었습니다(Arsenopoulos 등 2018).",
 fl11:"얼굴파리는 눈물과 콧물을 먹으며 눈을 자극하고, 전염성 결막염(핑크아이) 원인균 Moraxella bovis를 옮길 수 있습니다. 미국 방제 기준은 얼굴당 10~15마리입니다(미주리대, 코넬대).",
 bf5:"집파리는 피를 빨지 않지만 사조·급수조·얼굴 주변에 몰려 균을 옮깁니다. 목장에서 잡은 집파리에서 유방염 원인균과 대장균·살모넬라가 나왔습니다(JDS Communications 2022). 미국에서도 집파리 피해 기준은 정해져 있지 않아 '소가 귀찮아할 정도'를 관찰 기준으로 씁니다(Texas A&M).",
 cf4:"그리스 연구에서 포유 송아지에 앉는 파리는 모두 집파리였고, 델타메트린으로 파리를 줄이자 고온기 사료 섭취량과 스트레스·피로 지표가 좋아졌습니다(Arsenopoulos 등, Animals). 송아지 허치에서 잡힌 파리에서 대장균·살모넬라 같은 설사 원인균이 나왔습니다(JDS Communications 2022).",
 fl1:"침파리는 주로 앞다리를 물어 피를 빨고, 소는 이를 피하느라 먹고 쉬는 시간을 잃습니다. 캘리포니아 착유우 연구에서 다리당 침파리가 1마리 늘 때마다 하루 유량이 두당 약 0.6 kg 줄었고(ElAshmawy 등 2025, Vet Sci), 미국 착유우의 연간 손실은 중앙값 두당 139 kg으로 추정됩니다(Taylor 등 2012, J Med Entomol). 다리당 1마리를 넘으면 몰림이 시작되고(Meyer 등 2019), 5마리는 오래 쓰여 온 경제적 피해 기준입니다. 국내에서는 럼피스킨병을 옮기는 매개 곤충이며, 2023년 첫 발생 때 11월 7일까지만 5,480두가 살처분됐습니다(농림축산식품부).",
 fl2:"소 다리에 앉은 파리 수는 시간대마다 크게 달라지지만, 트랩은 일주일 동안의 발생량을 보여줘 추세를 보기 좋습니다. 캘리포니아 20개 농장 연구에서 우방 가까운 트랩의 주간 50마리 초과는 그 우방의 몰림을, 농장 평균 주간 150마리 이상은 농장 전체 몰림을 예측했습니다(Meyer 등 2019, PLoS ONE). 경남 하동 축사 조사에서는 파란색 끈끈이 트랩이 가장 잘 잡혔습니다(경상국립대).",
 fl3:"꼬리치기·다리 구르기·머리 흔들기·피부 떨기는 파리를 쫓는 회피 행동입니다. 착유우 연구에서 혈중 코르티솔(스트레스 호르몬)은 파리 수와 회피 행동 빈도에 따라 올라갔고, 두 요인이 코르티솔 변화의 약 81%를 설명했습니다(Vitela-Mendoza 등 2016, J Dairy Sci). 파리를 세기 어려울 때 빠르게 쓰는 기준입니다(UC ANR: 분당 10회).",
 fl4:"몰림(뭉침)은 소가 침파리를 피하려고 머리를 안쪽으로 모으는 행동이지만, 몰림 자체가 생산성 손실을 만듭니다. ① 유량: 몰림이 있던 날 그 우방 소는 두당 하루 0.45 kg 유량이 줄었습니다(ElAshmawy 등 2025). ② 섭취·반추: 서 있는 시간이 늘고 채식·휴식 시간이 줄어 건물섭취량과 반추 시간, 유지방이 떨어집니다(UC 연구진). ③ 열스트레스: 무리 가운데는 체열이 빠지지 않습니다. 영국 실내 사육 우군에서도 기온 20℃를 넘으면 몰림이 늘었습니다(Chopra 등 2024, J Dairy Sci). ④ 스트레스·부상: 코르티솔이 오르고(Vitela-Mendoza 등 2016), 밀치기로 외상 위험이 커집니다(ElAshmawy 등 2025). 우방 펜스 아래 분뇨를 치운 농장은 몰림이 적었습니다(Meyer 등 2019).",
 fl5:"뿔파리는 하루 20~30회 피를 빠는 작은 파리로 방목·운동장 소의 등과 옆구리에 붙어 삽니다. 방목우 증체가 약 14% 줄고 송아지 이유체중이 5~9 kg 줄었다는 보고가 있습니다(UF/IFAS IN952). 방제 기준은 착유우 두당 100마리, 육우 200마리입니다(UF/IFAS, 네브래스카대 G1180).",
 fl6:"파리는 육성우 유두 끝을 물어 딱지를 만들고, 황색포도상구균을 몸에 묻혀 최대 4일 동안 옮길 수 있습니다. 감염된 뿔파리가 문 처녀우에서 같은 균주의 유방염이 생겼고, 파리 방제를 하는 농장의 처녀우는 황색포도상구균 유방염이 적었습니다(LSU 연구). 저지종 육성우 시험에서도 푸어온과 귀표를 함께 쓴 방제로 유두 딱지와 새 감염이 크게 줄었습니다.",
 fl7:"침파리와 집파리 유충은 모두 분뇨가 섞인 사료 잔재, 젖은 깔짚, 퇴비에서 자랍니다. 알에서 성충까지 침파리는 약 3주, 여름 집파리는 7~10일이면 됩니다. 7일 간격으로 발생원을 치우면 다음 세대를 끊을 수 있습니다. 살충제는 성충만 잡기 때문에 발생원 관리가 가장 기본이 되는 방제입니다. 농식품부 럼피스킨 방제 지침도 서식지 정리를 함께 권합니다.",
 fl8:"[럼피스킨으로 이어지는 손실] 침파리는 럼피스킨 바이러스를 묻혀 다른 소에게 옮깁니다. 벨기에 실험에서 감염소를 문 침파리가 건강한 소 14두 중 4두에 전신 발병을 일으켰고(Sohier 등 2019, Sci Rep), 증상이 없는 감염소에서도 5두 중 2두로 옮겨졌습니다(Viruses 2023). 요르단 착유 농장 41곳 조사에서 발병률 26%, 폐사율 1.9%, 발병우 치명률 7.5%였고, 발병우 유량은 평균 51.5% 줄었습니다(Transbound Emerg Dis 2015). 태국 착유 농장의 럼피스킨 손실은 폐사가 가장 컸고, 유량 감소와 항생제 휴약 기간 폐기 우유가 뒤를 이었습니다(Front Vet Sci 2025). 국내에서는 2023년 10월 20일 충남 서산 한우 농장에서 처음 발생해 그해 107건이 발생했고, 11월 7일까지만 5,480두가 살처분됐습니다(농림축산식품부). 2026년 10월 1일부터 제2종 가축전염병으로 바뀌었지만, 젖을 짜는 소의 양성 개체는 여전히 살처분 대상입니다(농림축산식품부). [시즌 초 방제] 피해는 파리가 많아진 뒤 시작하면 회복이 늦습니다. 방목 육성우 연구에서 침파리로 줄어든 증체는 비육장에서도 회복되지 않았고(Campbell 등 2001, J Econ Entomol), 캘리포니아 연구도 시즌 초기 방제를 권했습니다(ElAshmawy 등 2025). 같은 계열 살충제만 쓰면 저항성이 생기므로 계열을 바꿔 써야 하고, 착유우는 우유 잔류 때문에 쓸 수 있는 제품이 제한됩니다. 사료 첨가형 유충 억제제는 처리된 분변에서만 효과가 있어, 사료 잔재·깔짚에서도 번식하는 침파리에는 효과가 제한적입니다.",
 bf1:"비육우 시험에서 침파리가 다리당 2.5~5마리 수준일 때 일당증체와 사료효율이 유의하게 떨어졌고, 마리당 손실로 환산한 경제적 기준은 2마리 미만이라는 분석도 있습니다(Campbell 등 1987·1989). 송아지 시험에서는 사료효율이 10.9~12.9% 나빠졌습니다(Campbell 등 1977). 사료는 그대로 먹는데 증체가 덜 나오는, 곧 사료비 손실입니다. 침파리는 럼피스킨병 매개 곤충이기도 하며, 국내 첫 발생은 2023년 10월 충남 서산의 한우 농장이었습니다(농림축산식품부).",
 bf2:"몰림과 회피 행동이 늘면 채식·휴식 시간이 줄고, 무리 가운데 체열이 쌓여 섭취량이 떨어집니다(UC 연구진, Penn State).",
 kf2:"방목·운동장 번식우의 뿔파리 방제 기준은 두당 200마리입니다(UF/IFAS, 네브래스카대). 어미소가 시달리면 포유 송아지 이유체중이 5~9 kg 줄었다는 보고가 있습니다(UF/IFAS).",
 /* CCCS */
 s1:"상처와 종창은 우상·바닥·사조 구조가 소에게 맞지 않는다는 직접 증거이고, 코 분비물은 호흡기 질환이나 환기 불량의 신호입니다. 통증과 질병은 섭취량과 유량을 떨어뜨립니다.",
 s2:"유방과 다리의 오염은 바닥·깔짚 관리 수준을 보여주며 환경성 유방염과 체세포 증가로 직결됩니다. 청결지수가 1단계 나빠지면 체세포가 약 5만 늘어난다는 자료가 있습니다(교재, 미네소타대).",
 s3:"파행우는 눕고 일어나기와 채식 횟수가 줄어 섭취량과 유량이 떨어지고, 발정 표현도 약해집니다. 보행지수 2 이상이 늘면 공태기간 16배, 수태당 종부횟수 9배, 도태율 8배가 증가한다는 자료가 있어(교재) 배점이 가장 큽니다.",
 s4:"소는 하루 12시간 이상 누워 쉬어야 합니다. 누우면 유방 혈류가 늘고 반추가 활발해지며, 1시간 더 쉬면 유량이 약 1 kg 늘어난다는 자료가 있습니다(팀 자료). 휴식 중인 소의 90% 미만이 누워 있다면 휴식 공간이 불편하다는 뜻입니다.",
 s5:"직사광선 아래에서는 체열 부하가 커져 섭취량·유량·수태율이 떨어집니다. 남북 방향이면 그늘이 하루 동안 움직여 바닥이 마르고, 4.5 m 이상 높이여야 그늘 아래 통풍이 됩니다.",
 s6:"면적이 부족하면 서열 낮은 소(초산우)가 쉬지 못하고, 깔짚이 빨리 더러워지며 경쟁 스트레스가 커집니다. 두당 8㎡가 교재 기준입니다.",
 s7:"콘크리트는 딱딱하고 차가워 무릎·비절 손상을 일으키고 소가 눕기를 꺼리게 만듭니다. 깔짚 15 cm가 쿠션과 건조를 유지하는 기준입니다.",
 s8:W_VENT, s9:W_FAN, s10:W_LIGHT,
 s11:"사조가 좁으면 서열 낮은 소가 밀려 섭취량이 줄고, 한 번에 몰아 먹거나 골라 먹어 과산증 위험이 커집니다. 두당 60 cm, 대두식은 75 cm가 기준입니다.",
 s12:W_BUNKCLEAN,
 s13:"소는 신선한 사료가 들어오거나 밀어줄 때 먹으러 옵니다. 자주 밀어줘야 하루 종일 섭취가 이어지고, 한꺼번에 과식해 반추위 pH가 떨어지는 일이 줄어듭니다.",
 s14:"사조 바닥이 통로보다 높아야 소가 풀을 뜯는 자연스러운 자세로 먹어 섭취량과 침 분비가 늘어납니다. 목 레일이 낮으면 목에 혹이 생기고 사료에 닿기 어렵습니다.",
 s15:W_WATER+" 두당 10 cm 이상의 수조 길이와 15초 이내 재충전이 기준입니다.",
 s16:"더러운 물은 음수량을 줄이고, 급수조가 사조에서 멀면 채식 직후 물을 마시지 못해 섭취량이 줄어듭니다.",
 s20:"대기장은 우사에서 가장 붐비고 더운 곳입니다. 오래 서 있으면 휴식 시간이 줄고 발굽 부담과 열스트레스가 커집니다. 두당 1.6㎡, 1시간 이내가 기준입니다.",
 s21:"착유실이 시끄럽거나 미끄러우면 소가 긴장해 옥시토신 분비가 방해받고 젖 내림이 나빠집니다.",
 s22:"발굽소독조는 전염성 발굽병 확산을 막고, 홈이 없는 이동로는 미끄러짐과 다리 부상의 원인입니다.",
 s23:W_VENT, s24:W_FAN,
 s25:"미끄러운 바닥에서는 소가 보폭을 줄이고 조심스럽게 걸으며, 발정 때 승가를 피해 발정 발견이 어려워집니다. 2방향 홈이 가장 안전합니다.",
 s26:W_FLOOR, s27:"분뇨가 쌓이면 소가 더러워지고 암모니아와 파리가 늘어납니다. 축분 2.5 cm 이하가 관리 목표입니다.",
 /* 사양·환경 */
 e2:"공기가 움직여야 피부의 열이 빨리 빠집니다. 소 높이에서 3 m/s 이상이면 체감 온도가 크게 내려가 더위 피해가 줄어듭니다.",
 e3:"젖소는 20℃대 초반부터 더위 부담이 시작됩니다. 더워진 뒤 팬을 켜면 이미 섭취량이 떨어진 뒤이므로 22~25℃에서 미리 가동합니다.",
 e4:"THI는 온도와 습도를 함께 본 더위 지수입니다. 68부터 유량이 줄기 시작하고(Zimbelman 2009), 72 이상이면 섭취량과 수태율이 뚜렷하게 떨어집니다.",
 e5:"암모니아는 호흡기 점막을 자극해 폐렴 위험을 높이고 일하는 사람에게도 해롭습니다. 냄새로 느껴질 정도면 이미 높은 수준입니다.",
 e6:W_LIGHT,
 e7:"착유우는 긴 낮이 유량을 높이고, 건유우는 짧은 낮이 면역력과 다음 비유기 유량을 높입니다(교재). 점등 시간을 우군별로 다르게 관리하는 이유입니다.",
 w2:"소는 사료를 먹은 직후 물을 가장 많이 마십니다. 급수조가 사조에서 15 m 넘게 떨어지면 음수량이 줄고 섭취도 함께 줄어듭니다.",
 w3:"너무 높거나 낮으면 자연스러운 자세로 마시기 어렵고, 낮으면 분변에 오염됩니다.",
 w4:"깊은 수조는 물이 오래 고여 썩고 청소가 어렵습니다. 얕고 물이 빨리 바뀌는 수조가 신선한 물을 유지합니다.",
 w5:"소는 입을 수면에 몇 cm 담그고 빨아 마십니다. 수위가 너무 낮으면 마시기 불편하고, 너무 높으면 넘쳐 바닥이 젖습니다.",
 w9:"우두머리 소가 급수조를 차지하면 약한 소가 마시지 못합니다. 20두당 1개 이상을 여러 곳에 나눠 설치해야 합니다(CowSignals).",
 w10:"소는 짧은 시간에 많은 물을 마시므로 물이 느리게 차면 기다리다 떠납니다. 분당 20 L 이상이 기준입니다(CowSignals).",
 w7:"여름에는 독점, 겨울에는 찬물과 동파가 음수량을 줄입니다. 찬물은 체온 유지에 에너지를 쓰게 하고, 비유초기 소의 연변 원인이 되기도 합니다(파워북).",
 f4:"잔량이 거의 없으면 늦게 먹는 소가 굶고, 너무 많으면 사료 낭비와 변질이 생깁니다. 3~5%가 섭취 극대화와 낭비 사이의 균형점입니다.",
 f5:"소는 무리 지어 함께 먹는 동물입니다. 동시에 먹을 공간이 없으면 서열 낮은 소가 기다리다 섭취량이 줄어듭니다.",
 t1:"긴 입자(상단)는 반추와 침 분비를 자극해 반추위 pH를 지킵니다. 너무 많으면 소가 골라 먹어 실제 먹는 배합이 달라집니다.",
 t2:"중간 입자는 반추위에 머물며 섬유 소화를 돕습니다. 부족하면 반추 시간이 줄어듭니다.",
 t3:"고운 입자(하단)가 많으면 반추위에서 빨리 발효되어 과산증 위험이 커지고 유지방이 떨어집니다.",
 t4:"소가 곡류만 골라 먹으면 설계 배합과 실제 섭취가 달라져 과산증과 유지방 저하가 생깁니다. 이상 발효된 TMR은 기호성이 떨어집니다.",
 t5:"농후사료 비율이 높으면 반추위 pH가 떨어져 과산증, 유지방 저하, 제엽염 위험이 커집니다.",
 t6:"조사료의 섬유(R-NDF)가 반추와 침 분비의 원천입니다. 부족하면 반추위 산도를 스스로 조절하지 못합니다.",
 t7:"설계한 배합비와 실제 투입·섭취량이 다른 경우가 많습니다. 실제 섭취량을 계산해야 원인을 정확히 찾고, 배합비는 반추위 미생물이 적응하도록 한 번에 10% 이내로 바꿔야 합니다(Farm Analysis).",
 t8:"조사료 품질이 섭취량과 섬유 소화율을 좌우합니다. 갈잎, 종실 탈락, 거친 대공은 영양가 저하의 신호입니다.",
 t9:"원료 허실 5~15%는 그대로 사료비 손실이고(Walkthrough), 곰팡이 원료는 독소 위험이 있습니다.",
 d1:"건유기에 조사료를 충분히 먹여 반추위 용적을 키워야 분만 후 섭취량이 빨리 오릅니다. 건유기 조사료 관리만으로 평균 유량이 크게 오른 사례가 있습니다(파워북 이레목장).",
 d2:"분만 전 3주는 영양 요구와 대사가 급변하는 시기라 전용 사료와 첨가제가 필요합니다. 건유 전기와 섞어 키우면 맞춤 관리가 어렵습니다.",
 d3:"건유우는 짧은 낮(6~8시간 점등)이 면역력을 높이고 분만 후 유량을 늘립니다(교재).",
 d4:"건유·전환기에 BCS가 크게 빠지면 지방이 간에 쌓여 지방간·케토시스가 생깁니다. 건유~분만 21일 BCS 변화 0.5 이하가 목표입니다(Walkthrough).",
 d5:"전환기 질환은 유열→후산정체→자궁염→케토시스처럼 연쇄적으로 생겨 그 비유기 전체 성적을 좌우합니다.",
 m6:"자극 후 1분 이내에 부착해야 옥시토신 작용 시간에 맞춰 젖이 빨리 나오고, 빈 유두를 짜는 과착유와 유두 손상이 줄어듭니다.",
 m7:"진공압과 맥동 이상은 유두 끝 손상과 유방염의 주요 원인입니다. 소가 아니라 기계가 원인인 체세포 문제를 걸러냅니다.",
 m8:"착유가 오래 걸리면 대기 시간이 늘어 휴식이 줄고 인건비가 늘어납니다.",
 h1:"기록이 있어야 반복되는 질병과 치료 효과를 판단하고, 원유 폐기 같은 손실을 줄일 수 있습니다.",
 h2:"발굽은 계속 자라므로 정기 삭제로 체중이 고르게 실리게 해야 하고, 발굽소독조는 전염성 발굽병을 막습니다.",
 h3:"낙농은 번식 사업입니다(파워북). 분만간격이 길어지면 유량이 적은 비유후기 소가 늘어 평균 유량과 수익이 떨어집니다.",
 h4:"초산 분만 24개월과 충분한 체격이 평생 생산성과 갱신 비용을 결정합니다. 육성기 건초 급여는 반추위 용적을 키웁니다.",
 h5:"초유와 송아지방 환경이 폐사율과 이후 성장을 좌우합니다. 오늘의 송아지가 2년 뒤의 착유우입니다.",
 q1:"특정 구역이 비어 있다면 그곳에 바람, 물, 미끄럼, 어두움 같은 불편 요인이 있다는 신호입니다(CowSignals).",
 q2:"서 있는 소는 무언가를 기다리는 소입니다(CowSignals). 누울 자리, 사료, 물 중 무엇을 기다리는지 찾아야 합니다.",
 q3:"우사 공기가 바깥보다 탁하면 환기가 부족해 열, 암모니아, 병원균이 쌓이고 있다는 뜻입니다.",
 q4:"자신 있게 걷지 못하면 바닥이 미끄럽거나 발굽에 통증이 있다는 뜻입니다.",
 q5:"사료·물·휴식 공간이 가까울수록 이동 에너지와 경쟁이 줄어듭니다(CowSignals 15 m 기준).",
 /* 문제진단 */
 x1:"비유일령이 길어지면 유량이 줄고 섭취량도 줄어듭니다. 우군 평균 180일 이하가 목표이며, 길어진다면 번식 문제를 먼저 확인합니다.",
 x2:"어린 소는 반추위 용적이 작아 많이 먹지 못합니다. 1~2산 비율이 높으면 같은 배합으로도 섭취량이 낮게 나옵니다.",
 x3:"드레싱(추가 농후사료)이 늘면 TMR을 덜 먹어 섬유 섭취가 줄어듭니다.", x4:W_WATER+" 오줌 누는 시간이 짧으면 음수 부족을 의심합니다.",
 x5:"입자가 너무 길면 반추위에 오래 머물러 다음 섭취가 늦어집니다.", x6:"새 원료나 변질 원료는 기호성을 떨어뜨립니다. 원료를 바꾼 시점과 섭취 감소 시점을 비교합니다.",
 x7:"TMR이 사조에서 열이 나면 영양 손실과 기호성 저하가 생깁니다.", x8:"질병은 섭취량을 먼저 떨어뜨리므로 배합비를 바꾸기 전에 질병부터 확인합니다.",
 y1:"분변은 소화의 거울입니다. 비유단계에 비해 묽다면 사료 균형이나 질병 문제를 의심합니다.", y2:"바이러스성 설사는 사료 문제가 아니므로 검사로 먼저 구분해야 잘못된 배합 변경을 피합니다.",
 y3:"찬물은 반추위 온도를 떨어뜨려 미생물 활동을 방해하고 연변을 부릅니다.", y4:"차가운 바닥에 배를 대고 누우면 반추위 온도가 떨어져 미생물 활동이 멈출 수 있습니다.",
 y5:"곰팡이 독소는 소화기와 면역을 해쳐 연변, 섭취 감소, 번식 장애를 일으킵니다.", y6:"사조·물통·배합기의 오염은 변질 사료와 세균의 통로가 됩니다.",

function strengths(){

    m.secs.forEach(sec=>{if(sec.items.every(i=>i.obs))return; const sc=m.kind==="judge"?dScore(sec):pScore(m,sec);

  visGroups().forEach(g=>indFor(g.id).forEach(ind=>{const st=sigStat(g.id,ind);if(st&&st.status==="good"&&st.n>=10)out.push({pct:90,t:`${g.name} ${ind.name}`})}));
  const c=[]; visGroups().forEach(g=>{const x=comfortStat(g.id);if(x&&x.lieP!=null&&x.lieP>=90)c.push(`${g.name} 휴식(누운 소 ${x.lieP}%)`)});

function pItemHtml(it){
  const v=S.pts[it.id], p=ptsOf(it), mx=maxOf(it), na=v&&v.na;
  let body="";
  const naBtn=it.na?`<button data-pna="${it.id}" aria-pressed="${!!na}">해당없음</button>`:"";
  if(it.rule&&!it.obs){
    const auto=it.rule(S.pv), ov=v&&v.n!=null&&v.n!=="";
    body=`<div class="valrow"><span id="pr_${it.id}">${auto==null?'<span class="small muted">측정값을 넣으면 점수가 계산됩니다</span>':`<span class="pill ${barCls(Math.max(0,auto)/mx)}">자동 ${Math.max(0,Math.min(mx,auto))}점</span>`}</span>
      <label class="small muted" style="display:flex;align-items:center;gap:6px">직접 점수<input id="pn_${it.id}" data-pn="${it.id}" inputmode="numeric" style="width:70px;min-height:40px" value="${ov?esc(v.n):""}"></label>${naBtn}</div>`;
  } else if(it.base!=null){
    const d=(v&&v.d)||[], z=v&&v.zero;
    body=`<div class="opts"><button data-pok="${it.id}" aria-pressed="${!!v&&!na&&!z&&!d.some(Boolean)}">감점 없음</button>
      ${it.zero?`<button data-pzero="${it.id}" aria-pressed="${!!z}">${it.zero} <span class="p">0</span></button>`:""}
      ${it.ded.map((x,i)=>`<button data-pded="${it.id}" data-i="${i}" aria-pressed="${!!d[i]&&!z&&!na}">${x[0]} <span class="p">−${x[1]}</span></button>`).join("")}${naBtn}</div>`;
  } else {
    const sel=it.obs?obsIdx(it):v, showPts=!it.obs&&!it.scale, autoSel=it.obs&&v==null&&sel!=null;
    body=`<div class="opts">${it.opts.map((x,i)=>`<button data-pt="${it.id}" data-i="${i}" aria-pressed="${sel===i&&!na}">${x[0]}${showPts?` <span class="p">${x[1]}</span>`:""}</button>`).join("")}${naBtn}</div>${autoSel?'<div class="small muted">측정값으로 자동 선택됨</div>':""}`;
  }
  const fields=it.f?`<div class="valrow">${it.f.map(([k,l,u])=>`<label class="f" style="flex:1 1 140px">${l}${u?` (${u})`:""}<input id="pv_${k}" data-pv="${k}" ${u&&u!=="℃"?'inputmode="decimal"':""} value="${esc(S.pv[k])}"></label>`).join("")}</div><div id="pa_${it.id}" class="small">${pAutoHtml(it)}</div>`:"";
  const tag=it.obs?(obsIdx(it)>0?'<span class="pill warn">원인 후보</span>':""):`<span class="mono small muted">${na?"해당없음":`${p??"—"}/${mx}`}</span>`;
  return `<div class="item"><div class="q">${esc(it.q)} ${tag}${it.bench!=null?` <span class="src l">우수농장 ${it.bench}</span>`:""}${it.s?`<span class="src l">${it.s}</span>`:""}</div>
    ${it.hint?`<div class="std">${esc(it.hint)}</div>`:""}${whyHtml(WHY[it.id])}${fields}${body}</div>`;
}

function roomsHtml(){

function roomOut(c){

  return `<span class="muted">${c.s.stage}기 · 기말체중 ${c.s.wt} kg · 일당증체 ${c.s.adg} kg · 배합 ${c.s.conc} kg · ${c.s.rname} ${c.s.rough} kg · 사료비 ${c.s.cost.toLocaleString()}원/두/일</span>
    ${p(c.wtDev,c.wtDev>=-5,`체중 ${c.wtDev>0?"+":""}${c.wtDev}%`)}${p(c.concPct,c.concPct>=90&&c.concPct<=110,`배합 ${c.concPct}%`)}${p(c.roughPct,c.roughPct>=80,`조사료 ${c.roughPct}%`)}${c.cost!=null?`<span class="pill ${c.cost<=c.s.cost*1.15?"good":"warn"}">사료비 ${c.cost.toLocaleString()}원</span>`:""}`;
}

    h+=`<h2>${m.title}</h2>

      h+=`<div class="card sec"><button class="sec-head" data-sec="${m.id+sec.code}" aria-expanded="${!!open}"><span class="code">${sec.code}</span><h3>${sec.name}</h3><span class="small muted mono">${s.done}/${s.n}</span>
        <span class="meter"><i style="width:${s.pct??0}%;background:${barCol(s.pct)}"></i></span><span class="pct">${s.pct??"—"}</span></button>${open?`<div>${sec.items.map(dItemHtml).join("")}</div>`:""}</div>`});
  } else {
    const sc=modScore(m.id);
    h+=`<h2>${m.title}</h2><div class="small muted">${m.gradeNote}</div>
    <div class="card" style="margin-top:10px"><div class="row" style="justify-content:space-between"><div>
      ${m.diag?`<div class="mono" style="font-size:26px;font-weight:600">${sc.flag}<span style="font-size:15px"> 건 원인 후보</span></div><div class="small muted">답한 항목 ${sc.done}/${sc.n}</div></div>`:
      `<div class="mono" style="font-size:26px;font-weight:600">${sc.got}<span style="font-size:15px"> / ${sc.full}점</span> <span class="pill ${sc.pct==null?"na":sc.pct>=m.grade[0]?"good":sc.pct>=m.grade[1]?"warn":"bad"}">${grade(sc.pct,m)}</span></div>
      <div class="small muted">입력 ${sc.done}/${sc.n}${sc.done<sc.n?` · 입력한 항목 기준 ${sc.pct??"—"}%`:""}</div></div>`}
      <button class="ghost" data-act="expandAll">${m.secs.some(s=>openSec[m.id+s.code])?"모두 접기":"모두 펼치기"}</button></div></div>`;
    m.secs.forEach(sec=>{const s=pScore(m,sec), open=openSec[m.id+sec.code], obs=sec.items.every(i=>i.obs);
      h+=`<div class="card sec"><button class="sec-head" data-sec="${m.id+sec.code}" aria-expanded="${!!open}"><span class="code">${sec.code}</span><h3>${sec.name}</h3>
        ${obs?`<span class="mono small">${s.flag?`원인 ${s.flag}`:`${s.done}/${s.n}`}</span>`:`<span class="mono small">${s.done?s.got:"—"}/${s.full}</span><span class="meter"><i style="width:${s.pct??0}%;background:${barCol(s.pct)}"></i></span>`}</button>

function comfortHtml(cs){
  if(!cs||!cs.total)return '<span class="muted small">숫자를 넣으면 지수가 계산됩니다.</span>';

  return row("휴식 중 누운 소",cs.lieP,"누운 소 ÷ (누운 소+서 있는 소) · 목표 90% 이상",v=>v>=90?"good":v>=80?"warn":"bad")
   +row("서 있는 소",cs.standP,"목표 10% 이하",v=>v<=10?"good":v<=20?"warn":"bad")
   +row("반추 비율",cs.rumi,"누운 소 중 · CowSignals 70% 이상 (교재 80%)",v=>v>=70?"good":v>=60?"warn":"bad")
   +`<div class="kv"><span>관찰 두수</span><span class="mono">${cs.total}두</span></div>`;
}

function sigTable(){

function csv(){
  const L=[["구분","섹션/우군","항목/지표","값","판정·점수","메모·기준"]], f=S.farm;
  L.push(["농장",f.name,f.date,activeMods().map(id=>MOD[id].title).join("/"),"",f.notes]);
  Object.entries(f).forEach(([k,v])=>{if(v&&!["name","date","notes","owner","inspector"].includes(k))L.push(["농장","",k,v,"",""])});
  if(activeMods().includes("dfeed"))DITEMS.forEach(it=>{const v=status(it);L.push(["낙농",it.sec.code+" "+it.sec.name,it.q,S.val[it.id]||"",v==null?"":STL[v],(S.memo[it.id]?S.memo[it.id]+" / ":"")+it.std])});
  MODS.filter(m=>m.kind==="pts"&&activeMods().includes(m.id)).forEach(m=>m.secs.forEach(sec=>sec.items.forEach(it=>{const p=ptsOf(it);
    L.push([m.name,sec.name,it.q,(it.f||[]).map(([k,l,u])=>S.pv[k]?`${l} ${S.pv[k]}${u}`:"").filter(Boolean).join(" / "),it.obs?(obsIdx(it)==null?"":it.opts[obsIdx(it)][0]):p==null?"":`${p}/${maxOf(it)}`,it.hint||""])})));
  S.rooms.forEach(r=>{const c=roomCalc(r);L.push(["우방별 급여량",r.name,`${r.m}개월 ${r.n}두`,`체중 ${r.wt} / 배합 ${r.conc} / 조사료 ${r.rough}`,c?`체중 ${c.wtDev}% / 배합 ${c.concPct}%`:"",c?`표준 ${c.s.wt}kg, ${c.s.conc}kg`:""])});
  Object.entries(S.rec).forEach(([k,o])=>Object.entries(o).forEach(([kk,v])=>v&&L.push(["성적",k,kk,v,"",""])));
  visGroups().forEach(g=>{indFor(g.id).forEach(ind=>{const c=(S.signals[g.id]||{})[ind.id];const st=sigStat(g.id,ind);if(!st)return;
    L.push(["개체관찰",g.name,ind.name,ind.mode==="mean"?st.mean.toFixed(2):st.pct+"%",st.status,ind.opts.map((op,i)=>`${op.l}:${c[i]}`).join(" ")])});
    SIGNS.forEach(([id,name,cause])=>{const k=(S.signs[g.id]||{})[id];if(k)L.push(["체크포인트",g.name,name,k,"",cause])});
    const c=comfortStat(g.id);if(c&&c.total)L.push(["두수카운팅",g.name,"누운 소/서 있는 소/반추",`${c.lieP}% / ${c.standP}% / ${c.rumi}%`,"",""]);});
  return "﻿"+L.map(r=>r.map(x=>`"${String(x??"").replace(/"/g,'""')}"`).join(",")).join("\r\n");
}

  <h3>점검표</h3>
  <ul><li>위쪽 버튼으로 점검표를 바꿉니다. 섹션 제목을 누르면 항목이 펼쳐집니다.</li>
   <li><b>배점형</b> (CCCS, 고급육, 우군별 상태, 번식우, 송아지): 점수 버튼을 누릅니다. 측정값 칸이 있는 항목은 숫자를 넣으면 원본 감점 규칙대로 <b>자동 점수</b>가 나오고, "직접 점수"를 넣으면 그 값이 우선합니다.</li>
   <li><b>해당없음</b>: 그늘막, 환기처럼 해당 시설이 없는 항목은 해당없음을 누르면 만점으로 처리되어 총점이 유지됩니다.</li>
   <li><b>판정형</b> (사양·환경): 측정값을 넣으면 양호·주의·불량이 자동으로 정해지고, 버튼을 누르면 직접 판정이 우선합니다. 메모 칸에 위치나 수치를 적어 두면 리포트에 함께 나옵니다.</li>
   <li><b>문제진단</b>: 유량·섭취량·분변에 문제가 있을 때 질문에 답하면 '예'로 답한 항목이 원인 후보로 리포트에 올라갑니다.</li>
   <li>항목마다 <b>"왜 중요한가"</b>를 누르면 기준의 이유를 볼 수 있습니다. 목장주에게 설명할 때 그대로 쓰면 됩니다.</li></ul>
  <h3>개체관찰</h3>
  <ul><li>우군을 고르고 소를 한 마리씩 보면서 해당 점수를 누릅니다. 누를 때마다 1두씩 늘어나고, 잘못 눌렀으면 "빼기 모드"를 켜고 다시 누릅니다.</li>
   <li>우군당 최소 10두, 가능하면 20두 이상 보고, 전체 관찰은 30분 이상 하는 것이 좋습니다(교재).</li>
   <li>빨간 테두리 점수는 문제 점수입니다. 문제 개체 비율이 기준을 넘으면 리포트에 올라갑니다. 분변지수는 우군 평균을 목표값과 비교합니다.</li>
   <li><b>체크포인트</b>: 목 혹, 비절 부종처럼 CowSignals 포스터의 이상 신호를 발견할 때마다 누르면 원인과 함께 리포트에 나옵니다.</li>
   <li><b>두수 카운팅</b>: 급여 직후가 아닌 시간(착유 1~2시간 전)에 우방 전체를 한 번에 세어 휴식 중 누운 소 비율과 반추 비율을 구합니다. 이 값은 CCCS의 "누워 있는 개체" 점수에 자동 반영됩니다.</li></ul>
  <h3>리포트</h3>
  <ul><li><b>점검 결과</b>와 <b>핵심 권고 3개</b>가 자동으로 정리됩니다. 서로 다른 분야에서 가장 시급한 것을 고릅니다.</li>
   <li><b>목표와 다음 방문</b>을 적으면 농가 피드백에 자동 반영됩니다.</li>
   <li><b>농가 피드백</b>은 점검 결과로 자동 작성되고, 고치면 고친 내용이 유지됩니다. "자동 내용으로 다시 쓰기"로 되돌릴 수 있습니다. 아래 <b>평가자 소견</b>에는 개인 의견을 적습니다.</li>
   <li><b>상세 분석(점검자용)</b>에는 섹션별 점수, 개선 항목 전체, 개체관찰 표, CSV가 접혀 있습니다.</li></ul>
  <h3>기록</h3>
  <ul><li>리포트의 "점검 기록 저장"을 눌러야 기록 탭에 쌓입니다. 이전 점검을 열어 비교하거나 다시 보낼 수 있습니다.</li>
   <li>기록은 이 기기의 브라우저에만 저장됩니다. 기기를 바꾸거나 브라우저 데이터를 지우기 전에 <b>백업 파일 저장</b>을 해 두세요.</li></ul>
  <h2 id="h-score">4. 점수와 판정 읽는 법</h2>
  <ul><li>총점은 점검표마다 다릅니다(CCCS 200, 고급육 150, 우군별 상태·번식우 100, 송아지 200점). 등급은 입력한 항목 만점 대비 비율로 정합니다.</li>
   <li>입력하지 않은 항목은 점수 계산에서 빠집니다. 점검표 위의 "입력 N/M"으로 빠진 항목을 확인하세요.</li>
   <li>개선 항목은 <b>우선</b>(빨강: 0점이거나 기준을 크게 벗어남)과 <b>개선</b>(노랑)으로 나뉩니다.</li>
   <li><b>비유 단계 구분</b>(파워북): 비유초기 분만~100일, 비유중기 101~229일, 비유후기(말기) 230일 이상~건유. 파워북은 초기(~100일)와 후기(230일 이상)를 정의하고, 중기는 그 사이 기간입니다.</li>
   <li>앱의 기준 가운데 <span class="src k">교재</span>는 CCCS 교육자료, 그 밖에 파워북·Walkthrough·CowSignals·팀 자료 등 출처를 표시했고, <span class="src l">문헌</span>은 일반 문헌 값이라 농장 상황에 맞게 판단이 필요합니다.</li></ul>
  <h2 id="h-send">5. 보고서 보내기</h2>
  <ul><li><b>Gmail로 보내기 / 초안 만들기</b> (claude.ai에서 열었을 때): 받는 사람, 제목, 인사말을 넣고 누릅니다. 처음 한 번 Gmail 연결 허용을 묻습니다. 보내기 전에 받는 사람을 한 번 더 확인합니다.</li>
   <li>기본 메일은 점수, 농가 피드백, 평가자 소견만 담은 짧은 메일입니다. 필요하면 "본문에 상세 분석 포함"이나 "상세 보고서 파일·CSV 첨부"를 켭니다.</li>
   <li><b>카톡용 요약 복사</b>: 복사 후 카카오톡에 붙여넣습니다.</li>
   <li><b>보고서 파일 저장</b>: .html 파일은 휴대폰·PC 어디서나 열리고, 인쇄하면 PDF로 만들 수 있습니다.</li></ul>
  <h2 id="h-tips">6. 현장 컨설팅 원칙</h2>
  <ul><li>생산성을 제한하는 요인의 약 75%는 영양 외적인 관리 요인입니다(교재). 권고도 관리 75%, 배합비 25% 비중으로 생각합니다.</li>
   <li>한 번에 권고는 3개 이하로 합니다. 나머지는 다음 방문에 이어 가며 매번 지난 권고의 실천 여부를 확인합니다(Farm Analysis).</li>
   <li>배합비는 한 번에 10% 이내로 바꿉니다.</li>
   <li>목장주의 말과 목표를 권고에 연결하면 실천률이 높아집니다(Presentation).</li>
   <li>방역: 깨끗한 장화와 소독제를 챙기고, 어린 소에서 큰 소 순서로 이동합니다.</li></ul>
  <h3>팀으로 사용하기</h3>
  <ol><li><b>관리자(앱 소유자)</b>가 claude.ai 화면의 공유 메뉴에서 팀원을 <b>참여자(Contributor)</b> 권한으로 초대합니다. 편집자 권한은 앱 자체를 고칠 수 있으니 주지 않습니다.</li>
   <li>팀원이 링크를 열면 "관리자 승인이 필요합니다" 화면이 나옵니다. 이름·소속·연락처를 적어 <b>사용 요청</b>을 보냅니다.</li>
   <li>관리자의 <b>기록</b> 탭에 빨간 숫자와 함께 요청이 뜹니다. <b>팀 관리</b>에서 승인 또는 거절합니다. 승인하면 팀원 화면이 바로 열립니다.</li>
   <li>관리자는 언제든 팀원을 <b>중지</b>, <b>다시 허용</b>, <b>삭제</b>할 수 있습니다. 중지하면 팀원 화면이 즉시 잠깁니다.</li>
   <li>승인된 팀원이 "점검 기록 저장"을 누르면 기록이 관리자와 공유되고, 관리자는 팀 관리의 <b>점검 기록</b>에서 열어 볼 수 있습니다. 팀원끼리는 서로의 기록을 볼 수 없습니다.</li></ol>
  <p class="small muted">관리자가 팀원 기록을 열면 관리자 화면의 현재 점검 내용이 그 기록으로 바뀝니다. 작성 중인 점검은 먼저 저장하세요.</p>
  <h3>아이디로 쓰는 배포판 (Claude 계정 없이)</h3>
  <ol><li>관리자가 알려준 앱 주소를 휴대폰 브라우저로 열고 <b>가입 신청</b>을 누릅니다. 아이디(영문 소문자·숫자), 비밀번호(6자 이상), 이름, 비밀번호 찾기용 이메일, 소속·연락처를 넣습니다.</li>
   <li>"승인 대기 중" 화면이 나옵니다. 관리자가 승인하면 그 화면이 자동으로 열립니다.</li>
   <li>관리자는 <b>기록 탭 → 팀 관리</b>에서 가입 신청을 <b>승인·거절</b>하고, 팀원을 <b>중지·다시 허용</b>합니다. 중지하면 그 팀원은 바로 쓸 수 없습니다.</li>
   <li>팀원이 리포트에서 <b>점검 기록 저장</b>을 누르면 관리자에게 자동 공유됩니다. 관리자는 팀원별 <b>점검 기록</b>에서 열어 봅니다.</li>
   <li>휴대폰 브라우저 메뉴의 <b>홈 화면에 추가</b>를 누르면 앱처럼 쓸 수 있습니다.</li></ol>
  <p class="small muted"><b>비밀번호를 잊었을 때</b>: 로그인 화면의 "비밀번호를 잊으셨나요?"에 아이디를 넣으면 가입 때 등록한 이메일로 재설정 링크가 갑니다(스팸함도 확인). 이메일을 등록하지 않은 예전 계정은 로그인한 뒤 <b>기록 탭 → 내 정보</b>에서 이메일을 등록해 두세요. 비밀번호 변경도 같은 곳에서 합니다. 이메일도 없이 비밀번호를 잊었다면 관리자가 Firebase 콘솔의 Authentication에서 그 계정을 삭제한 뒤 다시 가입하게 합니다. 점검 기준과 해설은 암호화되어 있어 승인된 사람만 볼 수 있습니다.</p>
  <h2 id="h-faq">7. 자주 묻는 질문</h2>
  <ul><li><b>화면이 하얗게 나와요</b>: 페이지를 새로고침하세요. 계속되면 다른 브라우저에서 열어 보세요.</li>
   <li><b>예시 데이터를 지우고 싶어요</b>: "새 점검 시작"을 누르면 빈 점검으로 시작합니다.</li>
   <li><b>다른 사람도 쓸 수 있나요</b>: 아래 "팀으로 사용하기"를 보세요. 메일은 각자의 Gmail로 나갑니다.</li>
   <li><b>자료 보안</b>: 점검표 배점과 기준에는 회사 교육자료(대외비 포함)가 들어 있으니 외부 공유에 주의하세요.</li></ul>`;
}
function helpItems(){

  MODS.forEach(m=>m.secs.forEach(sec=>sec.items.forEach(it=>{const w=WHY[it.id];if(!w)return;out.push({mod:m.id,mname:(m.grp==="dairy"?"낙농 ":"")+m.name,sec:sec.name,q:it.q,std:it.std||it.hint||"",w})})));
  SIGNALS.forEach(ind=>out.push({mod:"sig",mname:"개체관찰",sec:"지표",q:ind.name,std:ind.target||Object.values(ind.targetBy||{})[0]||"",w:SIGWHY[ind.id]||""}));
  return out;
}
function helpListHtml(){
  const q=helpQ.trim().toLowerCase();
  const items=helpItems().filter(x=>(helpMod==="all"||x.mod===helpMod)&&(!q||(x.q+x.std+x.w+x.sec).toLowerCase().includes(q)));
  if(!items.length)return '<div class="muted small">찾는 항목이 없습니다.</div>';
  let cur="";
  return items.map(x=>{const head=x.mname+" · "+x.sec;const h=head!==cur?`<div class="small muted" style="margin-top:14px;font-weight:600">${esc(head)}</div>`:"";cur=head;
    return h+`<div class="why-item"><div class="q">${esc(x.q)}</div>${x.std?`<div class="std">기준: ${esc(x.std)}</div>`:""}<div class="w">${esc(x.w)}</div></div>`}).join("");
}

async function sha256(t){try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}catch(e){return null}}
/* Cloudflare Access 뒤에서 열리면 로그인한 이메일을 받아 팀 코드 없이 사용 */
async function accessIdentity(){
  if(!/^https?:$/.test(location.protocol))return null;
  try{const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),4000);
    const r=await fetch("/cdn-cgi/access/get-identity",{credentials:"include",signal:ctl.signal});clearTimeout(t);
    if(!r.ok)return null;const j=await r.json();return j&&j.email?{email:String(j.email),name:String(j.name||"")}:null}catch(e){return null}
}

  if(!framed||!(window.claude&&window.claude.use)){
    const L=teamLocal();
    if(L.access&&L.name){team.mode="none";accessIdentity().then(id=>{if(id&&id.email!==L.access){store.set(KEY_TEAM,{...teamLocal(),access:id.email,name:id.name||""});team.mode="name";render()}});return}
    if(TEAM_CFG.codeHash&&L.ok===TEAM_CFG.codeHash){team.mode="none";return}
    team.mode="pending";render();
    const id=await accessIdentity();
    if(id){store.set(KEY_TEAM,{...teamLocal(),access:id.email,name:teamLocal().name||id.name||""});team.mode=teamLocal().name?"none":"name";render();return}
    team.mode=TEAM_CFG.codeHash?"code":"none";render();
    return}
  team.mode="pending"; render();
  team.timer=setTimeout(()=>{if(team.mode==="pending"){team.status="slow";render()}},10000);
  const [user,db]=await Promise.all([getCap("user"),getCap("db")]);
  team.user=user; team.db=db;
  let owner=false; try{owner=user?!!(await user.isOwner()):false}catch(_){}
  if(owner){team.mode="owner";clearTimeout(team.timer);
    if(db){try{team.uid=await user.id()}catch(_){}
      db.collection("requests").onSnapshot(q=>{team.requests=q.docs.map(d=>({id:d.id,...d.data()}));loadNames(team.requests.map(r=>r.id));teamRefresh()},()=>{});
      db.collection("members").onSnapshot(q=>{team.members=q.docs.map(d=>({id:d.id,...d.data()}));loadNames(team.members.map(r=>r.id));teamRefresh()},()=>{});}
    render();return}
  if(!user||!db){team.mode="member";team.status="nodb";clearTimeout(team.timer);render();return}
  let uid=null; try{uid=await user.id()}catch(_){}
  team.mode="member"; team.uid=uid; clearTimeout(team.timer);
  if(!uid){team.status="signin";render();return}
  team.status="checking"; render();
  db.doc("members/"+uid).onSnapshot(d=>{const st=d.exists?d.data().status:null;team.status=st==="approved"?"approved":st==="blocked"?"blocked":(team.myReq?"requested":"none");render()},()=>{team.status="nodb";render()});
  db.doc("requests/"+uid).onSnapshot(d=>{team.myReq=d.exists?d.data():null;if(team.status==="none"||team.status==="requested"||team.status==="checking")team.status=team.myReq?"requested":(team.status==="checking"?"checking":"none");render()},()=>{});
}

async function teamAct(kind,id){
  const db=team.db; if(!db)return;

    if(kind==="approve"){const r=team.requests.find(x=>x.id===id)||{};await db.doc("members/"+id).set({status:"approved",at:Date.now(),note:r.note||""});await db.doc("requests/"+id).delete();toast("승인했습니다")}
    if(kind==="reject"){await db.doc("requests/"+id).delete();toast("요청을 거절했습니다")}
    if(kind==="block"){const m=team.members.find(x=>x.id===id)||{};await db.doc("members/"+id).set({status:"blocked",at:m.at||Date.now(),note:m.note||"",blockedAt:Date.now()});toast("사용을 중지했습니다")}

  h+=`<div class="small muted" style="margin-top:10px">팀원은 앱 주소에서 아이디·비밀번호로 가입 신청을 하고, 여기서 승인하면 바로 사용할 수 있습니다. 중지하면 즉시 잠깁니다. 비밀번호를 잊은 팀원은 Firebase 콘솔(Authentication)에서 계정을 삭제한 뒤 다시 가입하게 하세요.</div>`;

       else{const mail=($("#acc_mail").value||"").trim().toLowerCase();if(!validMail(mail))return say("이메일 형식을 확인해 주세요");await F.account.setEmail(cur,mail,F.id);say(mail+" 로 확인 메일을 보냈습니다. 메일의 링크를 누르면 등록이 끝납니다 (스팸함도 확인)",true)}
       $("#acc_cur").value="";$("#acc_new").value="";
